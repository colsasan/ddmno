        /* ================================================================
         * BATTLE ENGINE SAFETY / TURN FLOW PATCH
         * - Keeps existing save data and all existing battle calculations.
         * - Replaces only the turn/KO/switch orchestration so every action
         *   resolves exactly once and a battle can never remain in processing.
         * ================================================================ */
        // わるあがき: 使える技が1つも無いときに選べる行動(既存のCPU用わるあがきと同じ性能)
        function battleStruggleSkill() {
            return { name: 'わるあがき', type: 'normal', category: 'physical', power: 50, accuracy: 100, maxPp: 1 };
        }

        // 通常の技がすべて選べない(CP切れ・ウィングのかけらの固定・ねこだまし不可)状態か
        function battleHasNoUsableSkill(mon) {
            if (!mon || !Array.isArray(mon.skills) || mon.skills.length === 0) return true;
            if (mon.chargingSkill) return false;
            return mon.skills.every((skill, idx) => {
                const lockedByWing = mon.equippedItemId === 'wing_kakera' && mon.lockedMoveIndex !== null && mon.lockedMoveIndex !== undefined && mon.lockedMoveIndex !== idx;
                const invalidNekodamashi = skill.name === 'ねこだまし' && !mon.isFirstTurn;
                return skill.pp <= 0 || lockedByWing || invalidNekodamashi;
            });
        }

        // 別のバトルに切り替わった/終了した後に、古いタイマーから進行処理が走らないようにする
        function battleIsStale(bs) {
            return !battleState || battleState !== bs || battleState.turnPhase === 'gameover';
        }

        // ターン終了時に持ち越してはいけない「そのターン限り」の状態を解除する
        function battleClearTurnFlags() {
            if (!battleState) return;
            [...battleState.playerTeam, ...battleState.cpuTeam].forEach(mon => {
                if (!mon) return;
                mon.isProtected = false;
                mon.damageTakenThisTurn = 0;
                mon.damageTakenPhysicalThisTurn = 0;
                mon.isBeakCannonCharging = false;
                if (mon.roostedElement) { mon.element = mon.roostedElement; mon.roostedElement = null; }
                mon.volatileStatuses = (mon.volatileStatuses || []).filter(x => x !== 'hirumi');
                if (mon.status === 'hirumi') mon.status = null;
            });
        }

        function battleResetTurnState() {
            if (!battleState) return;
            battleState.turnSerial = (battleState.turnSerial || 0) + 1;
            battleState.actionLock = false;
            battleState.resultResolved = false;
        }

        function battleAliveIndex(team, exceptIndex = -1) {
            if (!Array.isArray(team)) return -1;
            return team.findIndex((m, i) => i !== exceptIndex && m && m.hp > 0);
        }

        function battleCanSwitch(isPlayer) {
            if (!battleState) return false;
            const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
            const index = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
            if (battleAliveIndex(team, index) < 0) return false;
            const enemy = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            const active = team[index];
            const suppressed = isAbilitySuppressor(enemy) || isAbilitySuppressor(active);
            if (battleState.mode !== 'black' && !suppressed && ['だる絡み', 'ねばねば'].includes(enemy?.ability?.name)) return false;
            return true;
        }

        function battleSwitchInternal(isPlayer, newIdx, isForced = false) {
            if (!battleState) return false;
            const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
            const currentIndex = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
            newIdx = Number(newIdx);
            if (!Number.isInteger(newIdx) || !team[newIdx] || newIdx === currentIndex || team[newIdx].hp <= 0) return false;

            const enemy = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            const active = team[currentIndex];
            const freestyle = isAbilitySuppressor(enemy) || isAbilitySuppressor(active);
            if (!isForced && battleState.mode !== 'black' && !freestyle && ['だる絡み', 'ねばねば'].includes(enemy?.ability?.name)) return false;

            if (active) active.lockedMoveIndex = null;
            const nextMon = team[newIdx];
            if (isPlayer) battleState.playerIndex = newIdx;
            else battleState.cpuIndex = newIdx;

            nextMon.isFirstTurn = true;
            const baseElement = nextMon.baseElement || MONSTERS_DB[nextMon.baseId]?.element || nextMon.element;
            nextMon.element = [...baseElement];
            nextMon.baseElement = [...baseElement];
            if (nextMon.ability?.name === '死後高速' && nextMon.hasShigoSpeedBoost) nextMon.speed /= 2;
            nextMon.hasShigoSpeedBoost = false;
            nextMon.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
            nextMon.volatileStatuses = [];
            nextMon.damageTakenThisTurn = 0;
            nextMon.damageTakenPhysicalThisTurn = 0;
            nextMon.isBeakCannonCharging = false;
            nextMon.roostedElement = null;
            nextMon.lastMoveFailed = false;
            nextMon.chargingSkill = null;
            nextMon.isReleasingCharge = false;
            nextMon.lockedMoveIndex = null;
            nextMon.isSkipTurn = false;
            nextMon.isProtected = false;
            nextMon.protectCount = 0;
            nextMon.hasTransformedMask = false;
            nextMon.abilityAtkMultiplier = 1;
            nextMon.abilityDefMultiplier = 1;
            nextMon.libLastSkill = null;
            nextMon.libStreak = 0;
            if (battleState.field.akuShuuTurns > 0) nextMon.volatileStatuses = [...new Set([...(nextMon.volatileStatuses || []), 'akushyuu'])];
            if (nextMon.status === 'hirumi') nextMon.status = null;

            triggerOnEntryAbility(nextMon, isPlayer);

            const hazardActive = isPlayer ? battleState.field.stealthCutPlayer : battleState.field.stealthCutCpu;
            const enemyNow = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            if (hazardActive) {
                const isFuuyuu = nextMon.ability?.name === 'ふゆう';
                const enemyFreestyle = isAbilitySuppressor(enemyNow);
                if (!isFuuyuu || enemyFreestyle) {
                    const multi = getTypeMultiplier('jimen', nextMon.element);
                    if (multi > 0) {
                        const hazardDamage = Math.max(1, Math.floor((nextMon.maxHp / 12) * multi));
                        nextMon.hp = Math.max(0, nextMon.hp - hazardDamage);
                        battleState.log.push(`[ステルスカット] 交代して出てきた ${nextMon.name} に ${hazardDamage} のダメージ！`);
                    } else {
                        battleState.log.push(`[ステルスカット] ${nextMon.name}には効果がない！`);
                    }
                }
            }

            battleState.log.push(`[交代] ${active ? active.name + 'は戻り、' : ''}${nextMon.name}が戦闘に出た！`);
            playSound('buff');
            renderBattleScreen();
            return nextMon.hp > 0;
        }

        function battleResolveFaints() {
            if (!battleState || battleState.turnPhase === 'gameover') return { playerAlive: true, cpuAlive: true, ended: false };

            const pCurrent = battleState.playerTeam[battleState.playerIndex];
            const cCurrent = battleState.cpuTeam[battleState.cpuIndex];
            const faintOccurred = !!((cCurrent && cCurrent.hp <= 0) || (pCurrent && pCurrent.hp <= 0));

            if (cCurrent && cCurrent.hp <= 0 && !cCurrent.__battleFaintLogged) {
                cCurrent.__battleFaintLogged = true;
                playSound('faint');
                battleState.log.push(`相手の ${cCurrent.name} は倒れた！`);
            }
            if (pCurrent && pCurrent.hp <= 0 && !pCurrent.__battleFaintLogged) {
                pCurrent.__battleFaintLogged = true;
                playSound('faint');
                battleState.log.push(`${pCurrent.name} は倒れてしまった！`);
            }

            const cpuHasAlive = battleAliveIndex(battleState.cpuTeam, -1) >= 0;
            const playerHasAlive = battleAliveIndex(battleState.playerTeam, -1) >= 0;

            // イベントモード: チバシン以外の敵を倒したら次の階へ(パーティーが全滅するまでエンドレス)
            if (battleState.mode === 'event' && !cpuHasAlive && playerHasAlive && cCurrent && cCurrent.baseId !== 'chibasin') {
                eventAdvanceFloor();
                renderBattleScreen();
                return { playerAlive: true, cpuAlive: true, ended: false, faintOccurred: true };
            }

            if (!cpuHasAlive || !playerHasAlive) {
                battleState.turnPhase = 'gameover';
                if (battleState.resultResolved) return { playerAlive: playerHasAlive, cpuAlive: cpuHasAlive, ended: true, faintOccurred };
                battleState.resultResolved = true;
                stopBattleBGM();
                // 報酬画面など、全画面の結果表示に切り替えた場合は、直後にバトル画面で上書きしない
                let resultScreenShown = false;

                if (battleState.mode === 'arcade') {
                    if (playerHasAlive && !cpuHasAlive) {
                        arcadeState.wins++;
                        if (arcadeState.currentStage < 3) {
                            const clearedStage = arcadeState.currentStage;
                            arcadeState.currentStage++;
                            saveGame();
                            battleState.log.push(`第${clearedStage}戦 勝利！次のトレーナー戦へ進みます！`);
                            showModal(`STAGE ${clearedStage} 勝利！ 🎉`, `第${clearedStage}戦に勝利しました！\n（※アーケードモードの報酬は3連勝達成時のみ獲得できます）`, '🏆', () => {
                                closeModal();
                                renderArcadePreview();
                            });
                        } else {
                            processArcadeVictory();
                            resultScreenShown = true;
                        }
                    } else {
                        arcadeState = null;
                        showModal('敗北… 挑戦終了 💦', 'アーケードモードで敗北しました。\n途中の勝利報酬も含め、報酬は付与されません。', '💀', () => {
                            closeModal();
                            renderArcadeHub();
                        });
                    }
                } else if (battleState.mode === 'black') {
                    if (playerHasAlive && !cpuHasAlive) {
                        gameState.inventory.push(createMonsterInstance('jahibi'));
                        saveGame();
                        renderJahibiAcquisitionScreen(false);
                        resultScreenShown = true;
                    } else {
                        showModal('敗北… 💦', 'ブラックとのバトルに敗北しました。', '☠️', () => { closeModal(); showMenu(); });
                    }
                } else if (battleState.mode === 'vip') {
                    if (playerHasAlive && !cpuHasAlive) {
                        if (Math.random() < 0.15) {
                            const rewardId = ['mirudew','shigo','tsumi'][Math.floor(Math.random()*3)];
                            const reward = createMonsterInstance(rewardId);
                            gameState.inventory.push(reward);
                            saveGame();
                            renderVipAcquisitionScreen(reward);
                        } else {
                            saveGame();
                            showModal('VIPルーム勝利！', '3体すべてに勝利した！今回はモンスターの獲得はありませんでした（獲得確率15%）。', '🏆', () => { closeModal(); showMenu(); });
                        }
                    } else {
                        saveGame();
                        showModal('VIPルーム敗北', '限定モンスターたちに敗北した。', '☠️', () => { closeModal(); showMenu(); });
                    }
                    resultScreenShown = true;
                } else if (battleState.mode === 'event') {
                    const cleared = playerHasAlive && !cpuHasAlive;
                    const defeatedCount = (battleState.defeated || 0) + (cleared ? 1 : 0);
                    eventRecordBest(defeatedCount);
                    if (cleared) {
                        const reward = createMonsterInstance('chibasin');
                        gameState.inventory.push(reward);
                        saveGame();
                        renderChibashinAcquisitionScreen(reward, battleState.floor, defeatedCount);
                        resultScreenShown = true;
                    } else {
                        saveGame();
                        showModal('千葉神ビル 攻略終了', `パーティーが全滅した…<br><br>到達階：<b class="text-teal-300">${battleState.floor}F</b><br>撃破数：<b class="text-teal-300">${defeatedCount}体</b><br>最高撃破数：<b class="text-yellow-300">${gameState.eventBestFloor || 0}体</b>`, '🏙️', () => { closeModal(); showMenu(); });
                    }
                } else if (battleState.mode === 'online') {
                    // ONLINE uses finishOnlineTurn for its result screen.
                } else {
                    if (playerHasAlive && !cpuHasAlive) {
                        gameState.coins += 300;
                        saveGame();
                        if (Math.random() < 0.05) {
                            showModal('勝利！ 🎉', 'カジュアルマッチ勝利！300コイン獲得！<br><br><span class="text-purple-300 font-black">……しかし、謎のトレーナー【ブラック】が現れた。</span><br>特別なバトルに挑戦しますか？', '⬛', () => { closeModal(); showMenu(); });
                            const buttons = document.getElementById('modal-buttons');
                            if (buttons) buttons.innerHTML = '<button onclick="startBlackBattle()" class="flex-1 bg-gradient-to-r from-red-700 to-purple-800 text-white font-black py-3 rounded-xl">ブラックと対戦する</button><button onclick="closeModal();showMenu()" class="flex-1 bg-gray-700 text-white font-bold py-3 rounded-xl">今回はやめる</button>';
                        } else {
                            showModal('勝利！ 🎉', 'カジュアルマッチに勝利しました！\n報酬として 300 コイン獲得しました！', '🏆', () => { closeModal(); showMenu(); });
                        }
                    } else {
                        gameState.coins += 150;
                        saveGame();
                        showModal('敗北… 💦', 'チームが全滅してしまいました…\n参加賞として 150 コイン獲得しました。', '☠️', () => { closeModal(); showMenu(); });
                    }
                }
                if (!resultScreenShown) renderBattleScreen();
                return { playerAlive: playerHasAlive, cpuAlive: cpuHasAlive, ended: true, faintOccurred };
            }

            if (cCurrent && cCurrent.hp <= 0) {
                const nextCpu = battleAliveIndex(battleState.cpuTeam, -1);
                if (nextCpu >= 0 && nextCpu !== battleState.cpuIndex) battleSwitchInternal(false, nextCpu, true);
            }
            if (pCurrent && pCurrent.hp <= 0) {
                const nextPlayer = battleAliveIndex(battleState.playerTeam, -1);
                if (nextPlayer >= 0 && nextPlayer !== battleState.playerIndex) battleSwitchInternal(true, nextPlayer, true);
            }

            // 繰り出した直後にステルスカット等で再び倒れた場合は、場が安定するまで同じ処理を繰り返す
            // (倒れたポケモンは毎回1体ずつ増えるため、必ず有限回で終わる)
            const pNow = battleState.playerTeam[battleState.playerIndex];
            const cNow = battleState.cpuTeam[battleState.cpuIndex];
            if ((pNow && pNow.hp <= 0) || (cNow && cNow.hp <= 0)) {
                const again = battleResolveFaints();
                return { ...again, faintOccurred: true };
            }

            renderBattleScreen();
            return { playerAlive: true, cpuAlive: true, ended: false, faintOccurred };
        }

        function battleActionPriority(mon, skill) {
            if (!mon || !skill) return 0;
            if (mon.ability?.name === '絶対命令' && mon.hp === mon.maxHp && skill.type === 'ghost') return 1;
            if (['ねこだまし', 'はやてがえし'].includes(skill.name)) return 3;
            if (skill.name === 'しんそく') return 2;
            if (['アクアジェット', 'しんくうは', 'マッハパンチ', 'かげうち'].includes(skill.name)) return 1;
            if (skill.name === 'ジャッチキル') return -1;
            return 0;
        }

        function battleEffectiveSpeed(mon, isPlayer) {
            if (!mon) return 0;
            let speed = mon.speed * getStageMultiplier(mon.stages.speed);
            if (mon.equippedItemId === 'wing_kakera') speed *= 1.5;
            if (mon.name === 'マエザワン' && mon.equippedItemId === 'katsura') speed *= 2;
            if (mon.status === 'mahi') speed *= 0.5;
            if (isPlayer && battleState.field.oikazePlayerTurns > 0) speed *= 2;
            if (!isPlayer && battleState.field.oikazeCpuTurns > 0) speed *= 2;
            return speed;
        }

        function battleChooseCpuAction(cMon, pMon) {
            const alive = battleAliveIndex(battleState.cpuTeam, battleState.cpuIndex);
            const canSwitch = battleCanSwitch(false);
            let validSkills = (cMon.skills || []).filter(s => s.pp > 0 && !(s.name === 'ねこだまし' && !cMon.isFirstTurn));
            if (cMon.chargingSkill) validSkills = [cMon.chargingSkill];
            if (cMon.equippedItemId === 'wing_kakera' && cMon.lockedMoveIndex !== null && !cMon.chargingSkill) validSkills = [cMon.skills[cMon.lockedMoveIndex]].filter(s => s && s.pp > 0);

            if (validSkills.length === 0) return { type: 'skill', index: -1, skill: { name: 'わるあがき', type: 'normal', category: 'physical', power: 50, accuracy: 100, maxPp: 1 } };

            if (canSwitch && cMon.hp / cMon.maxHp <= 0.25) {
                const candidates = battleState.cpuTeam.map((m, i) => ({m, i})).filter(x => x.i !== battleState.cpuIndex && x.m && x.m.hp > 0);
                const switchChance = battleState.mode === 'arcade' && ['t4', 't11'].includes(battleState.arcadeTrainerId) ? 0.7 : 0.45;
                if (candidates.length && Math.random() < switchChance) {
                    const best = candidates.sort((a, b) => {
                        const am = getTypeMultiplier(validSkills[0]?.type || 'normal', a.m.element);
                        const bm = getTypeMultiplier(validSkills[0]?.type || 'normal', b.m.element);
                        return bm - am;
                    })[0];
                    return { type: 'switch', index: best.i };
                }
            }

            // アーケードの各トレーナーは、固有スタイルに応じて技選択の優先順位を変える。
            if (battleState.mode === 'arcade') {
                const choose = list => list.length ? list[Math.floor(Math.random() * list.length)] : null;
                const strongest = list => list.length ? [...list].sort((a, b) => (b.power || 0) - (a.power || 0))[0] : null;
                const attacks = validSkills.filter(s => s.category !== 'status' && (s.power || 0) > 0);
                const statuses = validSkills.filter(s => s.category === 'status');
                const byType = type => attacks.filter(s => s.type === type);
                const pickResult = skill => skill ? { type: 'skill', index: cMon.skills.indexOf(skill), skill } : null;
                let preferred = null;

                switch (battleState.arcadeTrainerId) {
                    case 't1': // サイタマ：物理高火力で押し切る
                        preferred = strongest(attacks.filter(s => s.category === 'physical')) || strongest(attacks);
                        break;
                    case 't2': // マンシー：相手が未状態なら状態異常・能力低下を優先
                        preferred = pMon.status ? null : choose(statuses.filter(s => ['あくび','おにび','どくどく','でんじは','ねむりごな','どくのいと','くしゃみ','うそなき','いやなおと'].includes(s.name)));
                        if (!preferred) preferred = strongest(attacks.filter(s => ['フェイタルクロー','たたりめ','ベノムショック','あくのはどう'].includes(s.name))) || strongest(attacks);
                        break;
                    case 't3': // ダレノガレ：先制技と高速高火力
                        preferred = choose(validSkills.filter(s => ['ねこだまし','はやてがえし','しんそく','アクアジェット','しんくうは','マッハパンチ', 'かげうち'].includes(s.name)));
                        if (!preferred) preferred = strongest(attacks);
                        break;
                    case 't4': // ナカモト：回復・防御・場づくり
                        preferred = cMon.hp / cMon.maxHp < 0.55 ? choose(statuses.filter(s => ['じこさいせい','はねやすめ','まもる','てっぺき','ビルドアップ'].includes(s.name))) : null;
                        if (!preferred && !battleState.field.stealthCutPlayer) preferred = statuses.find(s => s.name === 'ステルスカット');
                        if (!preferred) preferred = choose(statuses.filter(s => ['てっぺき','ビルドアップ','まもる'].includes(s.name))) || strongest(attacks);
                        break;
                    case 't5': // フクザワ：弱点を突くバランス型
                        preferred = strongest(attacks.filter(s => getTypeMultiplier(s.type, pMon.element) > 1)) || strongest(attacks);
                        break;
                    case 't6': // マツシタ：電気技・まひでテンポを取る
                        preferred = !pMon.status && !pMon.element.includes('jimen') ? statuses.find(s => s.name === 'でんじは') : null;
                        if (!preferred) preferred = strongest(byType('denki')) || strongest(attacks);
                        break;
                    case 't7': // ショウミ：水技中心、必要なら追い風
                        preferred = strongest(byType('mizu'));
                        if (!preferred && !battleState.field.oikazeCpuTurns) preferred = statuses.find(s => s.name === 'おいかぜ');
                        if (!preferred) preferred = strongest(attacks);
                        break;
                    case 't8': // ウオダ：一撃必殺・超高威力
                        preferred = choose(validSkills.filter(s => ['じわれ','ダンクシュート'].includes(s.name)));
                        if (!preferred) preferred = strongest(attacks.filter(s => (s.power || 0) >= 110)) || strongest(attacks);
                        break;
                    case 't9': { // アンデイ：相手が先に動きそうならカウンター、他は格闘技
                        const counter = validSkills.find(s => s.name === 'カウンター');
                        const playerPriority = pMon.skills.some(s => s.pp > 0 && ['ねこだまし','はやてがえし','しんそく','アクアジェット','しんくうは','マッハパンチ', 'かげうち'].includes(s.name));
                        const playerLikelyFirst = playerPriority || battleEffectiveSpeed(pMon, true) > battleEffectiveSpeed(cMon, false);
                        preferred = counter && playerLikelyFirst && Math.random() < 0.75 ? counter : null;
                        if (!preferred) preferred = strongest(byType('kakuto')) || choose(statuses.filter(s => ['ビルドアップ','くしゃみ'].includes(s.name))) || strongest(attacks);
                        break;
                    }
                    case 't10': // イニシヤル：先制技と追い風で攻め続ける
                        preferred = choose(validSkills.filter(s => ['しんそく','ねこだまし','はやてがえし','アクアジェット','しんくうは','マッハパンチ', 'かげうち'].includes(s.name)));
                        if (!preferred && !battleState.field.oikazeCpuTurns) preferred = statuses.find(s => s.name === 'おいかぜ');
                        if (!preferred) preferred = strongest(attacks);
                        break;
                    case 't11': { // カツヤマ：回復・防御・カウンターで粘る
                        const counter = validSkills.find(s => s.name === 'カウンター');
                        const playerLikelyFirst = pMon.skills.some(s => s.pp > 0 && ['ねこだまし','はやてがえし','しんそく','アクアジェット','しんくうは','マッハパンチ', 'かげうち'].includes(s.name)) || battleEffectiveSpeed(pMon, true) > battleEffectiveSpeed(cMon, false);
                        preferred = counter && playerLikelyFirst && Math.random() < 0.65 ? counter : null;
                        if (!preferred && cMon.hp / cMon.maxHp < 0.6) preferred = choose(statuses.filter(s => ['じこさいせい','はねやすめ','まもる','てっぺき'].includes(s.name)));
                        if (!preferred) preferred = choose(statuses.filter(s => ['まもる','てっぺき','ビルドアップ'].includes(s.name))) || strongest(attacks);
                        break;
                    }
                    case 't12': // タマキ：状態異常を入れてから倍化技で畳みかける
                        preferred = !pMon.status ? choose(statuses.filter(s => ['おにび','どくどく','でんじは','あくび','ねむりごな','どくのいと'].includes(s.name))) : null;
                        if (!preferred) preferred = strongest(attacks.filter(s => ['たたりめ','ベノムショック','ダメおし','フェイタルクロー'].includes(s.name))) || strongest(attacks);
                        break;
                    case 't13': // リュウジ：ほのお技とでんき技の高火力で押し切る
                        preferred = strongest(byType('honoo')) || strongest(byType('denki')) || strongest(attacks);
                        break;
                    case 't14': { // マサキ：能力ダウンと状態異常で弱らせてからゴースト技
                        const debuffs = ['うらみ','どくどく','クリアスモッグ','くしゃみ','うそなき','いやなおと'];
                        preferred = !pMon.status ? choose(statuses.filter(s => ['どくどく','うらみ'].includes(s.name))) : null;
                        if (!preferred && Math.random() < 0.3) preferred = choose(statuses.filter(s => debuffs.includes(s.name)));
                        if (!preferred) preferred = strongest(attacks.filter(s => ['うらみつらみ','たたりめ','シャドーボール','ダメおし'].includes(s.name))) || strongest(attacks);
                        break;
                    }
                    case 't15': // チホ：おにびや場の技を絡めつつ弱点を突く
                        preferred = !pMon.status ? choose(statuses.filter(s => ['おにび','でんじは','どくどく'].includes(s.name))) : null;
                        if (!preferred && !battleState.field.stealthCutPlayer && Math.random() < 0.3) preferred = statuses.find(s => s.name === 'ステルスカット');
                        if (!preferred) preferred = strongest(attacks.filter(s => getTypeMultiplier(s.type, pMon.element) > 1)) || strongest(attacks);
                        break;
                }
                const chosenArcadeSkill = pickResult(preferred);
                if (chosenArcadeSkill) return chosenArcadeSkill;
            }

            for (const skill of validSkills) {
                if (skill.category !== 'status' && skill.power > 0 && getTypeMultiplier(skill.type, pMon.element) > 1) {
                    return { type: 'skill', index: cMon.skills.indexOf(skill), skill };
                }
            }
            const hpRatio = cMon.hp / cMon.maxHp;
            if (hpRatio < 0.3) {
                const heal = validSkills.find(s => ['じこさいせい', 'はねやすめ'].includes(s.name));
                if (heal) return { type: 'skill', index: cMon.skills.indexOf(heal), skill: heal };
            }
            const high = validSkills.filter(s => s.category !== 'status' && s.power >= 80);
            const chosen = high.length ? high[Math.floor(Math.random() * high.length)] : validSkills[Math.floor(Math.random() * validSkills.length)];
            return { type: 'skill', index: cMon.skills.indexOf(chosen), skill: chosen };
        }

        function battleFinishCpuAction(action, callback) {
            if (!battleState || battleState.turnPhase === 'gameover') return callback && callback();
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const pMon = battleState.playerTeam[battleState.playerIndex];
            if (!cMon || cMon.hp <= 0 || !pMon || pMon.hp <= 0) return callback && callback();

            if (action.type === 'switch') {
                const switchBattle = battleState;
                battleSwitchInternal(false, action.index, false);
                setTimeout(() => { if (!battleIsStale(switchBattle)) callback && callback(); }, 500);
                return;
            }
            let skill = action.skill || cMon.skills[action.index];
            if (!skill) return callback && callback();
            if (!cMon.chargingSkill && typeof skill.pp === 'number' && skill.pp > 0) skill.pp--;
            runAction(cMon, pMon, skill, false, null, () => callback && callback());
        }

        function battleFinishTurn() {
            if (!battleState || battleState.turnPhase === 'gameover') return;
            const turnBattle = battleState;
            const result = battleResolveFaints();
            if (result.ended) return;
            processTurnEndEffects(() => {
                if (battleIsStale(turnBattle)) return;
                const after = battleResolveFaints();
                if (after.ended) return;
                battleClearTurnFlags();
                const p = battleState.playerTeam[battleState.playerIndex];
                const c = battleState.cpuTeam[battleState.cpuIndex];
                if (p) p.isFirstTurn = false;
                if (c) c.isFirstTurn = false;
                battleState.turnPhase = 'menu';
                battleState.actionLock = false;
                renderBattleScreen();
            });
        }

        function executeSwitch(newIdx) {
            if (!battleState || battleState.turnPhase !== 'menu' || battleState.actionLock) return;
            newIdx = Number(newIdx);
            const pMon = battleState.playerTeam[battleState.playerIndex];
            if (!pMon || !battleState.playerTeam[newIdx] || battleState.playerTeam[newIdx].hp <= 0 || newIdx === battleState.playerIndex) return;
            if (!battleCanSwitch(true)) return;
            battleState.turnPhase = 'processing';
            battleState.actionLock = true;
            closeModal();
            const turnBattle = battleState;
            if (!battleSwitchInternal(true, newIdx, false)) {
                if (battleState.playerIndex === newIdx) {
                    // 交代は成立したが、ステルスカット等で出た直後に倒れた場合。相手は行動せず、倒れた処理からターン終了へ進める。
                    battleFinishTurn();
                    return;
                }
                battleState.actionLock = false;
                battleState.turnPhase = 'menu';
                renderBattleScreen();
                return;
            }
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const cpuAction = battleChooseCpuAction(cMon, battleState.playerTeam[battleState.playerIndex]);
            setTimeout(() => {
                if (battleIsStale(turnBattle)) return;
                battleFinishCpuAction(cpuAction, () => {
                    battleFinishTurn();
                });
            }, 450);
        }

        function executePlayerTurn(skillIdx) {
            if (!battleState || battleState.turnPhase === 'processing' || battleState.turnPhase === 'gameover' || battleState.actionLock) return;
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            if (!pMon || pMon.hp <= 0 || !cMon || cMon.hp <= 0) {
                battleResolveFaints();
                return;
            }

            // 使える技が1つも無いときだけ「わるあがき」(skillIdx = -1) を選べる
            const isStruggle = Number(skillIdx) === -1 && battleHasNoUsableSkill(pMon);
            let skill = isStruggle ? battleStruggleSkill() : (pMon.chargingSkill || pMon.skills[Number(skillIdx)]);
            if (!skill) return;
            if (!isStruggle && !pMon.chargingSkill && skill.pp <= 0) {
                showModal('CP切れ', 'この技のCPが切れています！', '⚠️', closeModal);
                return;
            }

            const turnBattle = battleState;
            battleState.turnPhase = 'processing';
            battleState.actionLock = true;
            if (pMon.equippedItemId === 'wing_kakera' && !isStruggle) pMon.lockedMoveIndex = Number(skillIdx);
            if (!isStruggle && !pMon.chargingSkill) skill.pp--;

            const cpuAction = battleChooseCpuAction(cMon, pMon);
            const cpuSkill = cpuAction.type === 'skill' ? cpuAction.skill : null;
            let pPriority = battleActionPriority(pMon, skill);
            let cPriority = cpuAction.type === 'switch' ? 6 : battleActionPriority(cMon, cpuSkill);
            const pSpeed = battleEffectiveSpeed(pMon, true);
            const cSpeed = battleEffectiveSpeed(cMon, false);
            const freestyle = isAbilitySuppressor(pMon) || isAbilitySuppressor(cMon);

            if (!freestyle) {
                // 安心感は相手の先制技だけを無効化し、交代の優先度には干渉しない。
                if (pMon.ability?.name === '安心感' && cpuAction.type === 'skill' && cPriority > 0) cPriority = 0;
                if (cMon.ability?.name === '安心感' && pPriority > 0) pPriority = 0;
            }

            let playerFirst = pPriority > cPriority || (pPriority === cPriority && pSpeed >= cSpeed);
            if (pPriority === cPriority) {
                if (pMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = true;
                    battleState.log.push(`[装備発動: ${pMon.name}のDOPE] 先制行動！`);
                } else if (cMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = false;
                    battleState.log.push(`[装備発動: ${cMon.name}のDOPE] 先制行動！`);
                }
            }
            if (!freestyle) {
                if (pMon.ability?.name === '最風' && Math.random() < 0.2) {
                    playerFirst = true;
                    battleState.log.push(`[特性発動: ${pMon.name}の最風] 20%の確率で先制する！`);
                }
                if (cMon.ability?.name === '最風' && Math.random() < 0.2) {
                    playerFirst = false;
                    battleState.log.push(`[特性発動: ${cMon.name}の最風] 20%の確率で先制する！`);
                }
            }

            const firstIsPlayer = playerFirst;
            if (skill.name === 'くちばしキャノン') pMon.isBeakCannonCharging = true;
            if (cpuSkill?.name === 'くちばしキャノン') cMon.isBeakCannonCharging = true;
            const firstAction = firstIsPlayer ? {type:'skill', skill, index:Number(skillIdx)} : cpuAction;
            const secondAction = firstIsPlayer ? cpuAction : {type:'skill', skill, index:Number(skillIdx)};

            const perform = (action, isPlayer, opponentAction, done) => {
                if (battleIsStale(turnBattle)) return;
                const actor = isPlayer ? battleState.playerTeam[battleState.playerIndex] : battleState.cpuTeam[battleState.cpuIndex];
                const target = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
                if (!actor || actor.hp <= 0 || !target || target.hp <= 0) return done && done();
                if (action.type === 'switch') {
                    battleSwitchInternal(isPlayer, action.index, false);
                    setTimeout(() => { if (!battleIsStale(turnBattle)) done && done(); }, 450);
                    return;
                }
                // CPU側のCP消費(プレイヤー側は技選択時に消費済み)。溜め中の技・わるあがきは消費しない。
                if (!isPlayer && !actor.chargingSkill && typeof action.skill.pp === 'number' && action.skill.pp > 0) action.skill.pp--;
                runAction(actor, target, action.skill, isPlayer, opponentAction?.skill || null, () => { if (!battleIsStale(turnBattle)) done && done(); });
            };

            perform(firstAction, firstIsPlayer, secondAction, () => {
                if (battleIsStale(turnBattle)) return;
                const faint = battleResolveFaints();
                if (faint.ended) return;
                if (faint.faintOccurred) {
                    battleFinishTurn();
                    return;
                }
                if (faint.playerAlive && faint.cpuAlive) {
                    setTimeout(() => {
                        if (battleIsStale(turnBattle)) return;
                        perform(secondAction, !firstIsPlayer, firstAction, () => {
                            battleFinishTurn();
                        });
                    }, 350);
                } else {
                    battleFinishTurn();
                }
            });
        }

        function checkBattleEnd() {
            if (!battleState || battleState.turnPhase === 'gameover') return true;
            return battleResolveFaints().ended;
        }

        // Online: keep the relay/client-authoritative architecture, but use the
        // same deterministic faint/turn-finalization path so a KO or switch can
        // never leave the local client locked in "processing".
        function finishOnlineTurn(resolvedTurn) {
            if (!battleState || battleState.mode !== 'online') return;
            if (battleState.onlineDisconnected) { onlineState.resolvingTurn = false; return; }
            const result = battleResolveFaints();
            onlineState.turn = Number(resolvedTurn) + 1;
            onlineState.turnSubmitted = false;

            if (result.ended) {
                battleState.turnPhase = 'gameover';
                stopBattleBGM();
                const playerAlive = result.playerAlive;
                const opponentAlive = result.cpuAlive;
                const won = playerAlive && !opponentAlive;
                notifyMatchFinished();
                const gained = grantOnlineReward(won);
                const rewardHtml = (gained > 0 ? `<br><br><span class="text-yellow-300 font-black">${won ? '勝利報酬' : '参加賞'}：${gained} G を獲得！</span>` : '') + onlineGearDropHtml();
                const backToOnline = () => { closeModal(); onlineState.resolvingTurn = false; onlineState.turnSubmitted = false; renderOnlineMenu(); };
                if (!playerAlive && !opponentAlive) showModal('引き分け', '両チームが全滅しました。' + rewardHtml, '🤝', backToOnline);
                else if (!playerAlive) showModal('ONLINE 敗北… 💦', 'チームが全滅しました。' + rewardHtml, '☠️', backToOnline);
                else showModal('ONLINE 勝利！ 🎉', '相手チームが全滅しました！' + rewardHtml, '🏆', backToOnline);
                return;
            }

            processTurnEndEffects(() => {
                if (!battleState || battleState.mode !== 'online' || battleState.turnPhase === 'gameover') return;
                const after = battleResolveFaints();
                if (after.ended) {
                    battleState.turnPhase = 'gameover';
                    return;
                }
                battleClearTurnFlags();
                const p = battleState.playerTeam[battleState.playerIndex];
                const c = battleState.cpuTeam[battleState.cpuIndex];
                if (p) p.isFirstTurn = false;
                if (c) c.isFirstTurn = false;
                battleState.turnPhase = 'menu';
                onlineState.resolvingTurn = false;
                renderBattleScreen();
            });
        }

        function dopaFx(kind, text) {
            try {
                if (!document.getElementById('dopa-style')) {
                    const st = document.createElement('style'); st.id = 'dopa-style';
                    st.textContent = '@keyframes dopaFlash{0%{opacity:.85}100%{opacity:0}}@keyframes dopaPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.25);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}@keyframes dopaFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:.8}}@keyframes dopaShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-2px)}}';
                    document.head.appendChild(st);
                }
                const colors = { jackpot:'#facc15', win:'#fb923c', lose:'#64748b' };
                const root = document.createElement('div');
                root.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden';
                const flash = document.createElement('div');
                flash.style.cssText = `position:absolute;inset:0;background:${colors[kind]};animation:dopaFlash ${kind==='lose'?0.25:0.6}s ease-out forwards`;
                root.appendChild(flash);
                if (kind !== 'lose') {
                    const t = document.createElement('div');
                    t.textContent = kind === 'jackpot' ? '🎉 JACKPOT!! 🎉' : (text || 'WIN!');
                    t.style.cssText = `position:absolute;left:50%;top:40%;font-weight:900;font-style:italic;font-size:clamp(28px,8vw,64px);color:#fff;text-shadow:0 0 12px ${colors[kind]},0 4px 0 #5b21b6;white-space:nowrap;animation:dopaPop 1.1s ease-out forwards`;
                    root.appendChild(t);
                    const n = kind === 'jackpot' ? 36 : 18, icons = ['🪙','✨','💰','⭐'];
                    for (let i = 0; i < n; i++) {
                        const c = document.createElement('div');
                        c.textContent = icons[i % icons.length];
                        c.style.cssText = `position:absolute;top:0;left:${Math.random()*100}%;font-size:${18+Math.random()*18}px;animation:dopaFall ${1+Math.random()*0.9}s ${Math.random()*0.4}s linear forwards`;
                        root.appendChild(c);
                    }
                }
                const app = document.getElementById('app-container');
                if (app && kind !== 'lose') { app.style.animation = 'dopaShake .35s'; setTimeout(() => { app.style.animation = ''; }, 400); }
                document.body.appendChild(root);
                setTimeout(() => root.remove(), 2000);
                if (typeof audioCtx !== 'undefined' && audioCtx) {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const notes = kind === 'jackpot' ? [523,659,784,1047,1319] : kind === 'win' ? [659,784,988] : [220,175];
                    notes.forEach((f, i) => {
                        const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + i * 0.09;
                        o.type = kind === 'lose' ? 'triangle' : 'square'; o.frequency.setValueAtTime(f, t0);
                        g.gain.setValueAtTime(0.12, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
                        o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.2);
                    });
                }
            } catch (e) { console.warn('dopaFx error', e); }
        }

            c.innerHTML=`<div class="w-full max-w-2xl px-4"><div class="glass-card rounded-3xl p-6 text-center border border-yellow-500/40"><h2 class="text-3xl font-black text-yellow-300">スロット</h2><p class="my-3">BET：20 G　所持：<span id="casino-coins-disp">${gameState.coins}</span> G</p><div id="slot-reels" class="flex justify-center gap-3 my-8">${[1,2,3].map(()=>'<div class="w-24 h-24 bg-black rounded-xl border-2 border-yellow-500 flex items-center justify-center text-3xl">?</div>').join('')}</div><div class="grid grid-cols-3 gap-3"><button id="slot1" onclick="slotPress(0)" class="bg-purple-700 p-3 rounded-xl font-bold">1</button><button id="slot2" onclick="slotPress(1)" disabled class="bg-purple-700 p-3 rounded-xl font-bold opacity-40">2</button><button id="slot3" onclick="slotPress(2)" disabled class="bg-purple-700 p-3 rounded-xl font-bold opacity-40">3</button></div><p id="slot-result" class="mt-5 min-h-8 font-bold text-yellow-200"></p><button onclick="renderCasino()" class="mt-4 bg-gray-800 px-6 py-2 rounded-xl">戻る</button></div></div>`;
            window.slotState={step:0,results:[],paid:false};
        }
        // [名前, 画像, ハズレ時の表示重み, 還元倍率]
        const SLOT_SYMBOLS = [['サイ','srsai.png',35,5],['マスカット','srmas.png',25,10],['チェリー','srche.png',20,20],['ピエロ','srpie.png',15,50],['7','sr7.png',5,100]];
        const SLOT_WIN_RATES = [50,30,10,8,2];
        const SLOT_NEAR_MISS_RATE = 0.3; // ハズレのうち「2枚揃い」演出になる割合(当選確率8%には影響しない)
        function slotEnsureStyle(){
            if (document.getElementById('slot-style')) return;
            const st = document.createElement('style'); st.id = 'slot-style';
            st.textContent = '@keyframes slotPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}.slot-pop{animation:slotPop .35s ease-out}@keyframes slotReach{0%,100%{box-shadow:0 0 0 rgba(250,204,21,0)}50%{box-shadow:0 0 22px 6px rgba(250,204,21,.95)}}.slot-reach{animation:slotReach .6s ease-in-out infinite;border-color:#fde047!important}@keyframes slotSpin{0%{transform:translateY(-12%)}100%{transform:translateY(12%)}}.slot-spinning img{animation:slotSpin .12s linear infinite;filter:blur(1px)}';
            document.head.appendChild(st);
        }
        function slotSymbolImg(x){ return `<img src="${x[1]}" alt="${x[0]}" class="w-full h-full object-contain">`; }
        function slotPickWeighted(excluded){
            const pool = SLOT_SYMBOLS.filter(x => !excluded.includes(x[0]));
            const total = pool.reduce((sum, x) => sum + x[2], 0);
            let roll = Math.random() * total;
            for (const item of pool) { roll -= item[2]; if (roll < 0) return item; }
            return pool[pool.length - 1];
        }
        function slotDecideOutcome(st){
            let chosen = SLOT_SYMBOLS[0], sum = 0;
            const r = Math.random() * 100;
            for (let wi = 0; wi < SLOT_SYMBOLS.length; wi++) { sum += SLOT_WIN_RATES[wi]; if (r < sum) { chosen = SLOT_SYMBOLS[wi]; break; } }
            if (Math.random() < 0.08) {
                st.kind = 'win'; st.chosen = chosen; st.results = [chosen, chosen, chosen]; st.payout = 20 * chosen[3];
                return;
            }
            st.payout = 0;
            if (Math.random() < SLOT_NEAR_MISS_RATE) {
                // 2枚だけ揃って外れる(揃う絵柄は当選時と同じ重みで選ぶ)
                const pair = chosen;
                const other = slotPickWeighted([pair[0]]);
                const oddPos = Math.floor(Math.random() * 3);
                st.kind = 'near'; st.chosen = pair;
                st.results = [0, 1, 2].map(p => p === oddPos ? other : pair);
            } else {
                const a = slotPickWeighted([]), b = slotPickWeighted([a[0]]), c = slotPickWeighted([a[0], b[0]]);
                st.kind = 'miss'; st.chosen = null; st.results = [a, b, c];
            }
        }
        function slotPress(i){
            const st = window.slotState;
            if (!st || st.busy || st.finished || i !== st.step) return;
            const resultEl = document.getElementById('slot-result');
            if (st.step === 0) {
                if (gameState.coins < 20) { resultEl.textContent = 'コインが足りません'; return; }
                gameState.coins -= 20; st.paid = true;
                saveGame(); updateHeader();
                { const cd = document.getElementById('casino-coins-disp'); if (cd) cd.textContent = gameState.coins; }
                slotDecideOutcome(st);
            }
            slotEnsureStyle();
            st.busy = true;
            const btn = document.getElementById('slot' + (i + 1));
            if (btn) { btn.disabled = true; btn.classList.add('opacity-40'); }
            const reelsEl = document.getElementById('slot-reels');
            const reel = reelsEl && reelsEl.children[i];
            playSound('click');
            let spinTimer = null;
            if (reel) {
                reel.classList.add('slot-spinning');
                reel.style.overflow = 'hidden';
                spinTimer = setInterval(() => { reel.innerHTML = slotSymbolImg(SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)]); }, 90);
            }
            setTimeout(() => {
                if (spinTimer) clearInterval(spinTimer);
                if (reel) {
                    reel.classList.remove('slot-spinning');
                    reel.innerHTML = slotSymbolImg(st.results[i]);
                    reel.classList.add('slot-pop');
                }
                st.step++; st.busy = false;
                const el = document.getElementById('slot-result');
                if (st.step < 3) {
                    const next = document.getElementById('slot' + (st.step + 1));
                    if (next) { next.disabled = false; next.classList.remove('opacity-40'); }
                    if (st.step === 2 && st.results[0][0] === st.results[1][0]) {
                        // 最初の2枚が揃った: リーチ演出
                        playSound('buff');
                        if (reelsEl) { reelsEl.children[0].classList.add('slot-reach'); reelsEl.children[1].classList.add('slot-reach'); }
                        if (el) el.textContent = '🔥 リーチ！！ 最後のボタンを押せ！';
                    } else if (el) {
                        el.textContent = st.step === 1 ? '2枚目のボタンを押そう' : '最後のボタンを押そう';
                    }
                    return;
                }
                slotFinish(st);
            }, 650);
        }
        function slotFinish(st){
            st.finished = true;
            const el = document.getElementById('slot-result');
            const reelsEl = document.getElementById('slot-reels');
            if (reelsEl) Array.from(reelsEl.children).forEach(ch => ch.classList.remove('slot-reach'));
            const win = st.kind === 'win';
            gameState.coins += st.payout; saveGame(); updateHeader();
            { const cd = document.getElementById('casino-coins-disp'); if (cd) cd.textContent = gameState.coins; }
            if (el) {
                if (win) el.textContent = `${st.chosen[0]}揃い！ ${st.payout}G獲得！`;
                else if (st.kind === 'near') el.textContent = '惜しい！！ あと1枚…！ ハズレ';
                else el.textContent = 'ハズレ！ また挑戦しよう';
                const again = document.createElement('button');
                again.className = 'mt-3 bg-yellow-700 px-5 py-2 rounded-xl font-bold';
                again.textContent = 'もう一度'; again.onclick = renderSlot;
                el.after(again);
            }
            if (st.kind === 'near' && reelsEl) {
                reelsEl.style.animation = 'dopaShake .35s'; setTimeout(() => { reelsEl.style.animation = ''; }, 400);
            }
            dopaFx(win ? (st.chosen[3] >= 50 ? 'jackpot' : 'win') : 'lose', win ? `${st.chosen[0]}揃い！` : '');
        }

        /* カジノ系の画面(currentViewが casino で始まる)の間だけ、ゴージャスな背景に切り替える */
        (function(){
            function sync(){ document.body.classList.toggle('casino-mode', typeof gameState !== 'undefined' && String(gameState.currentView || '').startsWith('casino')); }
            function init(){ const t = document.getElementById('app-container'); if (!t) return; new MutationObserver(sync).observe(t, { childList: true }); sync(); }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
        })();

        /* ===== ディディダービー ===== */
        const DERBY_RACERS = [
            { id: 'koujiradon',     goal: 15, fall: 20, accel: 20 },
            { id: 'reishoujin',     goal: 12, fall: 30, accel: 20 },
            { id: 'rafureon',       goal: 18, fall: 10, accel: 20 },
            { id: 'hibihibiki',     goal: 14, fall: 20, accel: 10 },
            { id: 'kairin',         goal: 17, fall: 15, accel: 10 },
            { id: 'kojimasukyuraa', goal: 13, fall: 20, accel: 10 },
            { id: 'ataichou',       goal: 13, fall: 15, accel: 5 },
            { id: 'nemoi',          goal: 8,  fall: 40, accel: 10 },
            { id: 'namiking',       goal: 13, fall: 15, accel: 5 },
            { id: 'maezawan',       goal: 15, fall: 15, accel: 10 }
        ];
        const DERBY_RIG_RATE = 0.5; // 50%の確率で予想したポケモンが2位以下になるよう調整（50%は通常のダービー）
        const DERBY_BETS = [10, 100, 1000];
        const DERBY_PAYOUT_RATES = [3, 0.3, 0]; // 予想したポケモンが1位 / 2位 / 3位のときの還元倍率
        let derbyState = null;

        function derbyMon(r){ return MONSTERS_DB[r.id] || { name: r.id, imageUrl: '' }; }
        function derbyStopTimer(){ if (derbyState && derbyState.timer) { clearTimeout(derbyState.timer); derbyState.timer = null; } }

        function renderDerby(){
            derbyStopTimer();
            window.__coinMask = null;
            gameState.currentView = 'casino-derby';
            const prevBet = (derbyState && derbyState.bet) || DERBY_BETS[0];
            derbyState = { bet: prevBet, phase: 'bet', racers: [], sim: null, pick: null, frame: 0, timer: null, result: null };
            renderDerbyView();
        }
        function derbyBack(){ derbyStopTimer(); window.__coinMask = null; updateHeader(); renderCasino(); }
        function derbySetBet(n){
            if (!derbyState || derbyState.phase !== 'bet') return;
            derbyState.bet = n; playSound('click'); renderDerbyView();
        }
        function derbyDraw(){
            if (!derbyState || derbyState.phase !== 'bet') return;
            if (gameState.coins < derbyState.bet) { showModal('コイン不足', `BET ${derbyState.bet}G に対して所持コインが足りません。`, '⚠️', closeModal); return; }
            const pool = [...DERBY_RACERS];
            for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
            derbyState.racers = pool.slice(0, 3);
            derbyState.phase = 'pick';
            playSound('buff');
            renderDerbyView();
        }
        function derbySimulate(racers){
            const pos = racers.map(() => 0), finished = racers.map(() => false), order = [], frames = [];
            let turn = 0;
            while (order.length < racers.length && turn < 500) {
                turn++;
                const ev = [], arrivals = [];
                racers.forEach((r, idx) => {
                    if (finished[idx]) { ev.push('done'); return; }
                    if (Math.random() * 100 < r.fall) { ev.push('fall'); return; }          // 転倒(一回休み)
                    const boosted = Math.random() * 100 < r.accel;                          // 加速(1マス飛ばし)
                    pos[idx] = Math.min(r.goal, pos[idx] + (boosted ? 2 : 1));
                    ev.push(boosted ? 'boost' : 'move');
                    if (pos[idx] >= r.goal) { finished[idx] = true; arrivals.push(idx); }
                });
                // 同じターンに同時ゴールした場合の順位はランダム
                for (let i = arrivals.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arrivals[i], arrivals[j]] = [arrivals[j], arrivals[i]]; }
                arrivals.forEach(i => order.push(i));
                frames.push({ turn, pos: [...pos], ev, arrivals: [...arrivals] });
            }
            if (order.length < racers.length) {
                racers.map((r, i) => i).filter(i => !order.includes(i)).sort((a, b) => pos[b] - pos[a]).forEach(i => order.push(i));
            }
            return { frames, order };
        }
        function derbyPick(idx){
            if (!derbyState || derbyState.phase !== 'pick') return;
            const bet = derbyState.bet;
            if (gameState.coins < bet) { showModal('コイン不足', `BET ${bet}G に対して所持コインが足りません。`, '⚠️', closeModal); return; }
            // 50%：予想したポケモンが2位以下になるレース結果になるまで再抽選 / 50%：通常のダービー
            const rigged = Math.random() < DERBY_RIG_RATE;
            let sim = derbySimulate(derbyState.racers);
            if (rigged) {
                for (let t = 0; t < 300 && sim.order[0] === idx; t++) sim = derbySimulate(derbyState.racers);
            }
            const rank = sim.order.indexOf(idx);               // 0=1位
            const mult = DERBY_PAYOUT_RATES[rank] ?? 0;
            const payout = Math.floor(bet * mult);
            // 結果は確定済みなので、演出の途中で画面を離れても精算が失われないよう先に保存する
            window.__coinMask = gameState.coins - bet; // レース中は「BET分だけ引いた額」で表示を固定(払い戻しは結果発表時に反映)
            gameState.coins = gameState.coins - bet + payout;
            saveGame();
            updateHeader();
            derbyState.pick = idx; derbyState.sim = sim; derbyState.frame = 0;
            derbyState.result = { rank, mult, payout, bet };
            derbyState.phase = 'race';
            playSound('click');
            renderDerbyView();
            derbyState.timer = setTimeout(derbyStep, 900);
        }
        function derbyStep(){
            const st = derbyState;
            if (!st || st.phase !== 'race') return;
            st.frame++;
            const f = st.sim.frames[st.frame - 1];
            if (f.ev.some(e => e === 'boost')) playSound('buff'); else if (f.ev.some(e => e === 'fall')) playSound('hit');
            renderDerbyView();
            if (st.frame >= st.sim.frames.length) { st.timer = setTimeout(derbyFinish, 700); return; }
            st.timer = setTimeout(derbyStep, 520);
        }
        function derbyFinish(){
            const st = derbyState;
            if (!st || st.phase !== 'race') return;
            derbyStopTimer();
            st.phase = 'result';
            window.__coinMask = null;
            updateHeader();
            renderDerbyView();
            const r = st.result;
            if (r.rank === 0) dopaFx(r.payout >= 10000 ? 'jackpot' : 'win', '1位的中！');

        }
        function derbyRankLabel(n){ return ['🥇 1位', '🥈 2位', '🥉 3位'][n] || (n + 1) + '位'; }

        function derbyLanesHtml(){
            const st = derbyState;
            const frame = st.frame > 0 ? st.sim.frames[st.frame - 1] : null;
            const finishedOrder = [];
            if (st.sim) st.sim.frames.slice(0, st.frame).forEach(fr => fr.arrivals.forEach(i => finishedOrder.push(i)));
            return st.racers.map((r, idx) => {
                const mon = derbyMon(r);
                const pos = frame ? frame.pos[idx] : 0;
                const ev = frame ? frame.ev[idx] : null;
                const finishedRank = finishedOrder.indexOf(idx);
                let cells = '';
                for (let n = 0; n <= r.goal; n++) {
                    const isHere = n === pos;
                    const label = n === 0 ? 'S' : (n === r.goal ? '🏁' : '');
                    cells += `<div class="flex-1 min-w-0 h-11 sm:h-12 border border-gray-700/70 ${n === r.goal ? 'bg-yellow-900/40' : 'bg-gray-900/70'} flex items-center justify-center text-[10px] text-gray-500 relative">${isHere ? `<div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg overflow-hidden border-2 ${st.pick === idx ? 'border-yellow-300' : 'border-white/60'} bg-black" style="transition:all .3s">${mon.imageUrl ? `<img src="${mon.imageUrl}" alt="${mon.name}" class="w-full h-full object-cover">` : mon.name}</div>` : label}</div>`;
                }
                let note = '';
                if (finishedRank >= 0) note = `<span class="text-yellow-300 font-black">ゴール！ ${finishedRank + 1}位</span>`;
                else if (ev === 'fall') note = '<span class="text-red-300 font-bold">転倒！一回休み</span>';
                else if (ev === 'boost') note = '<span class="text-cyan-300 font-bold">加速！1マス飛ばし</span>';
                else if (ev === 'move') note = '<span class="text-gray-400">前進</span>';
                return `<div class="rounded-xl bg-black/40 border ${st.pick === idx ? 'border-yellow-400/70' : 'border-gray-700'} p-2">
                    <div class="flex items-center justify-between text-xs mb-1"><b class="text-white">${st.pick === idx ? '⭐ ' : ''}${mon.name}</b><span>${pos}/${r.goal}マス ${note}</span></div>

            } else if (st.phase === 'pick') {

        // ---- 週間オンライン勝利数トップ(ホーム表示) ----
        function getWeekKey() {
            // サーバー(日本時間の月曜始まり)と同じ基準で週を判定する
            const d = new Date(Date.now() + 9 * 3600 * 1000);
            const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
            const day = t.getUTCDay() || 7;
            t.setUTCDate(t.getUTCDate() + 4 - day);
            const y = t.getUTCFullYear();
            const w = Math.ceil((((t - Date.UTC(y, 0, 1)) / 86400000) + 1) / 7);
            return y + '-W' + String(w).padStart(2, '0');
        }
        function getMyWeeklyWins() {

        // 勝利報告はサーバーへ送り、受理(ack)されるまで未送信として保存する(オフライン・切断時の取りこぼし防止)
        function sendWeeklyReport(roomId) {
            try {
                if (typeof socket !== 'undefined' && socket && socket.connected && roomId) {
                    const payload = { roomId: roomId, playerId: gameState.playerId, playerName: gameState.playerName, name: gameState.playerName };
                    socket.emit('report_weekly_win', payload);

        function syncWeeklyStats() {
            try {
                if (!(typeof socket !== 'undefined' && socket && socket.connected) || !gameState.playerId || !gameState.playerName) return;
                const pending = Array.isArray(gameState.weeklyPending) ? gameState.weeklyPending.length : 0;
                const wins = Math.max(0, getMyWeeklyWins() - pending);
                if (wins <= 0) return;
                socket.emit('sync_weekly_stats', { week: getWeekKey(), wins: wins, playerId: gameState.playerId, playerName: gameState.playerName, name: gameState.playerName });
            } catch (e) { console.warn('weekly sync error', e); }

                gameState.weeklyPending = gameState.weeklyPending.slice(-20);

            sendWeeklyReport(roomId);
            requestWeeklyTop();
            updateWeeklyTopUI();

        function parseWeeklyTopData(data) {
            let list = [];
            if (Array.isArray(data)) list = data;
            else if (data && typeof data === 'object') {
                const arr = data.top || data.ranking || data.rankings || data.list || data.players;
                if (Array.isArray(arr)) list = arr;
                else if (data.top && typeof data.top === 'object') list = [data.top];
                else list = [data];
            }
            const norm = list.map(e => e ? { name: e.name || e.playerName || e.player || '', wins: Number(e.wins ?? e.winCount ?? e.count ?? e.score) || 0 } : null).filter(e => e && e.name && e.wins > 0);
            if (!norm.length) return null;
            return norm.reduce((a, b) => (b.wins > a.wins ? b : a));
        }
        function registerWeeklyTopListeners(sock) {

            setStatus('syncing');
            try {
                const meta = getMeta(); const uid = session.user.id;
                const cloud = await fetchCloud();
                const local = hasLocalProgress();
                const linked = meta.userId === uid;
                if (!cloud) {
                    if (local) { await firstLink(); }
                    else { setMeta({ userId: uid, baseVersion: 0, dirty: false }); setStatus('synced', 'ログイン済み。ゲーム開始後に自動保存されます。'); }
                    return;
                }
                if (!linked) {
                    if (!local) { await applyCloud(cloud, 'login'); return; }
                    askConflict(cloud, linked ? 'diverged' : (meta.userId ? 'otheraccount' : 'firstlink')); return;
                }
                if (Number(cloud.save_version) === Number(meta.baseVersion)) {
                    if (meta.dirty) await pushNow(); else setStatus('synced', '最新の状態です。');
                } else if (!meta.dirty) { await applyCloud(cloud, 'restore'); }
                else { askConflict(cloud, 'diverged'); }
            } catch (e) { console.error('[Cloud] afterLogin', e); setMeta({ dirty: hasLocalProgress() }); setStatus('error', '同期に失敗しました(ローカルデータは保護されています): ' + errText(e)); }
        }
        // 初回連携: バックアップ→アップロード→読み戻し検証→成功時のみ連携完了
        async function firstLink() {
            const bk = backupLocal('prelink');
            if (bk === false) { setStatus('error', 'バックアップに失敗したため連携を中止しました。既存データは保持されています。'); return; }
            const raw = localRaw(); const payload = buildPayload(raw);
            const s = payload.state;
            const { error } = await sb.from(TABLE).insert({ user_id: session.user.id, player_id: s.playerId || null, player_name: s.playerName || null, save_data: payload, client_updated_at: Date.now() });
            if (error) {
                if (error.code === '23505') { const c = await fetchCloud(); if (c) { askConflict(c, 'firstlink'); return; } }
                throw error;
            }
            const back = await fetchCloud();
            if (!back || canon(back.save_data.state) !== canon(payload.state)) { throw new Error('アップロード検証に失敗(連携は完了していません)'); }
            setMeta({ userId: session.user.id, baseVersion: back.save_version, dirty: false, lastSyncAt: Date.now() });
            setStatus('synced', '既存データのクラウド連携が完了しました(バックアップ済み)。');
        }
        function askConflict(cloud, kind) {
            conflictOpen = true; setStatus('conflict', '');
            const why = kind === 'otheraccount' ? 'この端末のデータは別アカウントに連携されています。' : kind === 'firstlink' ? 'クラウドに既存のセーブデータがあります。' : 'この端末とクラウドの両方に新しい変更があります。';
            const cs = (cloud.save_data && cloud.save_data.state) || {};
            const ls = localState() || {};
            const brief = (s) => `所持G ${esc(s.coins)} / モンスター ${Array.isArray(s.inventory) ? s.inventory.length : 0}体 / 名前 ${esc(s.playerName || '未設定')}`;
            window.__cloudCloud = cloud;
            showAccountHtml(`<div class="text-left text-sm text-gray-200 space-y-3">
                <p class="font-bold text-yellow-300">⚠️ データが競合しています</p><p>${why}自動では上書きしません。どちらを使うか選んでください。</p>
                <div class="bg-black/40 rounded-xl p-3 border border-cyan-500/30"><b>☁️ クラウド</b><br>${brief(cs)}<br><span class="text-xs text-gray-400">更新 ${esc(cloud.updated_at)}</span></div>
                <div class="bg-black/40 rounded-xl p-3 border border-pink-500/30"><b>📱 この端末</b><br>${brief(ls)}</div>
                <button onclick="CloudAcct.useCloud()" class="w-full bg-cyan-700 hover:bg-cyan-600 rounded-xl py-3 font-bold">☁️ クラウドを使う(この端末のデータはバックアップ保存)</button>
                <button onclick="CloudAcct.useLocal()" class="w-full bg-pink-700 hover:bg-pink-600 rounded-xl py-3 font-bold">📱 この端末を使う(クラウドは1世代前を退避)</button>
                <button onclick="CloudAcct.later()" class="w-full bg-gray-700 rounded-xl py-2">あとで決める(同期を停止・ローカルで継続)</button></div>`);
            openModal();
        }
        async function applyCloud(cloud, why) {
            const bk = backupLocal('before' + why); if (bk === false) { setStatus('error', 'バックアップ失敗のため復元を中止しました。'); return; }
            const payload = cloud.save_data; const s = payload.state;
            try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch (e) { setStatus('error', 'ローカル保存に失敗: ' + e.message); return; }
            setMeta({ userId: session.user.id, baseVersion: cloud.save_version, dirty: false, lastSyncAt: Date.now() });
            showAccountHtml('<p class="text-lg font-bold text-cyan-300 mb-2">☁️ クラウドデータを復元しました</p><p class="text-sm text-gray-300 mb-4">ゲームを再読み込みします。</p><button onclick="location.reload()" class="w-full bg-cyan-700 rounded-xl py-3 font-bold">OK</button>');
            openModal(); setTimeout(() => location.reload(), 1500);
        }
        async function forceUpload(cloud) {
            // 「この端末を使う」: 明示的な選択後のみ。DBトリガが旧データを backup_data に退避する
            backupLocal('beforeforce');
            const raw = localRaw(); const payload = buildPayload(raw); const s = payload.state;
            const { data, error } = await sb.from(TABLE).update({ player_id: s.playerId || null, player_name: s.playerName || null, save_data: payload, client_updated_at: Date.now() })
                .eq('user_id', session.user.id).eq('save_version', cloud.save_version).select('save_version');
            if (error) throw error;
            if (!data || !data.length) throw new Error('クラウドが更新されていました。もう一度お試しください。');
            setMeta({ userId: session.user.id, baseVersion: data[0].save_version, dirty: false, lastSyncAt: Date.now() });
        }

        // ---------- 自動保存(saveGame から呼ばれる) ----------
        function onLocalSave() { setMeta({ dirty: true }); if (session && st.status !== 'conflict') schedulePush(4000); }
        function schedulePush(ms) { clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, ms); }
        async function pushNow() {
            if (!sb || !session || pushing || conflictOpen) return;
            if (!hasLocalProgress()) return;
            if (!navigator.onLine) { setStatus('pending', 'オフライン: 接続後に自動送信します。'); return; }
            pushing = true; setStatus('syncing');
            try {
                const meta = getMeta();
                if (meta.userId !== session.user.id) { await afterLogin(); return; }
                const raw = localRaw(); const payload = buildPayload(raw); const s = payload.state;
                const { data, error } = await sb.from(TABLE).update({ player_id: s.playerId || null, player_name: s.playerName || null, save_data: payload, client_updated_at: Date.now() })
                    .eq('user_id', session.user.id).eq('save_version', Number(meta.baseVersion) || 0).select('save_version');
                if (error) throw error;
                if (!data || !data.length) { const cloud = await fetchCloud(); if (cloud) { askConflict(cloud, 'diverged'); } else { await firstLink(); } return; }
                setMeta({ baseVersion: data[0].save_version, dirty: localRaw() !== raw, lastSyncAt: Date.now() });
                setStatus(getMeta().dirty ? 'pending' : 'synced', getMeta().dirty ? '' : '保存しました。');
                if (getMeta().dirty) schedulePush(2000);
            } catch (e) { console.error('[Cloud] push', e); setMeta({ dirty: true }); setStatus('error', '送信失敗(ローカルは保護・再接続時に再送します): ' + errText(e)); }
            finally { pushing = false; }
        }

        // ---------- アカウント操作 ----------
        const redirect = () => (location.protocol.startsWith('http') ? location.origin + location.pathname : undefined);
        const val = (id) => ($(id) ? $(id).value.trim() : '');
        async function doSignUp() {
            if (!sb) return; const email = val('acct-email'), pw = $('acct-pw').value;
            if (!email || pw.length < 8) return flash('メールアドレスと8文字以上のパスワードを入力してください。');
            flash('登録中…');
            const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: redirect() } });
            if (error) return flash('登録失敗: ' + error.message);
            if (!data.session) flash('✅ 確認メールを送信しました。メール内のリンクを開いて認証後、ログインしてください。(既存データは端末に保持されています)');
            else { flash('✅ 登録しました。'); }
        }
        async function doLogin() {
            if (!sb) return; const email = val('acct-email'), pw = $('acct-pw').value;
            if (!email || !pw) return flash('メールアドレスとパスワードを入力してください。');
            flash('ログイン中…');
            const { error } = await sb.auth.signInWithPassword({ email, password: pw });
            if (error) return flash('ログイン失敗: ' + (error.message === 'Email not confirmed' ? 'メール認証が完了していません。' : error.message));
            flash('');
        }
        async function doReset() {
            if (!sb) return; const email = val('acct-email'); if (!email) return flash('メールアドレスを入力してください。');
            const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirect() });
            flash(error ? '送信失敗: ' + error.message : '✅ パスワード再設定メールを送信しました。');
        }
        async function doNewPw() {
            const pw = $('acct-newpw').value; if (pw.length < 8) return flash('8文字以上で入力してください。');
            const { error } = await sb.auth.updateUser({ password: pw });
            if (error) return flash('変更失敗: ' + error.message);
            recovery = false; flash('✅ パスワードを変更しました。'); afterLogin();
        }
        async function doLogout() {
            if (!sb) return;
            if (session && getMeta().dirty) { try { await pushNow(); } catch (e) {} }
            await sb.auth.signOut(); session = null; setStatus('guest', 'ログアウトしました(ローカルデータは保持されています)。');
        }
        function flash(t) { const f = $('acct-flash'); if (f) f.textContent = t; }

        // ---------- UI ----------
        function injectModal() {
            const btn = document.createElement('button');
            btn.id = 'acct-btn'; btn.title = 'アカウント / クラウドセーブ'; btn.textContent = '👤 アカウント';
            btn.className = 'cy-name-chip';
            btn.onclick = () => { openModal(); renderAccount(); };
            const slot = $('acct-btn-slot'); if (slot) slot.appendChild(btn);
            const m = document.createElement('div');
            m.id = 'acct-modal'; m.className = 'fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden'; m.style.zIndex = '60';
            m.innerHTML = '<div class="glass-card border border-cyan-500/50 rounded-3xl p-6 max-w-md w-full shadow-2xl max-h-[90vh] overflow-y-auto"><div class="flex justify-between items-center mb-4"><h3 class="text-xl font-black text-white">☁️ アカウント / クラウドセーブ</h3><button onclick="CloudAcct.close()" class="text-gray-300 text-2xl leading-none px-2">×</button></div><div id="acct-body"></div></div>';
            document.body.appendChild(m);
        }
        function openModal() { const m = $('acct-modal'); if (m) m.classList.remove('hidden'); }
        function closeModal2() { const m = $('acct-modal'); if (m) m.classList.add('hidden'); }
        function showAccountHtml(h) { const b = $('acct-body'); if (b) b.innerHTML = h; }
        const inputCls = 'w-full bg-black/60 border border-gray-600 rounded-xl px-3 py-2.5 text-white text-sm mb-2';
        const btnCls = 'w-full rounded-xl py-2.5 font-bold text-white mb-2 ';
        function renderAccount() {
            const b = $('acct-body'); if (!b || conflictOpen && st.status === 'conflict') return;
            if (st.status === 'unavailable') { b.innerHTML = `<p class="text-sm text-yellow-300">${esc(st.msg)}</p>`; return; }
            const status = { guest: '未ログイン', synced: '同期済み', syncing: '同期中…', pending: '未同期(再接続で送信)', error: 'エラー', conflict: '競合(要選択)' }[st.status] || '';
            if (recovery) {
                b.innerHTML = `<p class="text-sm text-gray-300 mb-2">新しいパスワードを入力してください。</p><input id="acct-newpw" type="password" autocomplete="new-password" placeholder="新しいパスワード(8文字以上)" class="${inputCls}"><button onclick="CloudAcct.newPw()" class="${btnCls}bg-cyan-700">パスワードを変更</button><p id="acct-flash" class="text-xs text-yellow-200 min-h-4"></p>`; return;
            }
            if (session) {
                const u = session.user; const meta = getMeta();
                b.innerHTML = `<div class="text-sm text-gray-200 space-y-1 mb-3">
                    <div>📧 ${esc(u.email)} ${u.email_confirmed_at ? '<span class="text-green-400">(認証済み)</span>' : '<span class="text-yellow-300">(未認証)</span>'}</div>
                    <div>🆔 プレイヤー固有ID: <span class="font-mono text-cyan-300 break-all">${esc(u.id)}</span></div>
                    <div>状態: <b>${status}</b>${meta.lastSyncAt ? ' / 最終同期 ' + new Date(meta.lastSyncAt).toLocaleString() : ''}</div>
                    <div class="text-xs text-gray-400">セーブ版 v${esc(meta.baseVersion || 0)}</div></div>
                    <button onclick="CloudAcct.sync()" class="${btnCls}bg-cyan-700">今すぐ同期</button>
                    <button onclick="CloudAcct.logout()" class="${btnCls}bg-gray-700">ログアウト</button>
                    <p id="acct-flash" class="text-xs text-yellow-200 min-h-4">${esc(st.msg)}</p>`; return;
            }
            b.innerHTML = `<p class="text-xs text-gray-400 mb-3">ログインすると進行状況がクラウドに保存され、別端末でも引き継げます。ログインしなくてもこれまで通り遊べます。現在の状態: ${status}</p>
                <input id="acct-email" type="email" autocomplete="email" placeholder="メールアドレス" class="${inputCls}">
                <input id="acct-pw" type="password" autocomplete="current-password" placeholder="パスワード(8文字以上)" class="${inputCls}">
                <button onclick="CloudAcct.login()" class="${btnCls}bg-cyan-700">ログイン</button>
                <button onclick="CloudAcct.signup()" class="${btnCls}bg-purple-700">新規登録(既存データは自動バックアップ)</button>
                <button onclick="CloudAcct.reset()" class="w-full text-xs text-cyan-300 underline py-1">パスワードを忘れた場合</button>
                <p id="acct-flash" class="text-xs text-yellow-200 min-h-4 mt-1">${esc(st.msg)}</p>`;
        }

        window.CloudAcct = {
            close: closeModal2, login: doLogin, signup: doSignUp, reset: doReset, newPw: doNewPw, logout: doLogout,
            sync: () => { conflictOpen = false; afterLogin(); },
            useCloud: async () => { conflictOpen = false; try { await applyCloud(window.__cloudCloud, 'conflict'); } catch (e) { setStatus('error', e.message); } },
            useLocal: async () => { conflictOpen = false; try { await forceUpload(window.__cloudCloud); setStatus('synced', 'この端末のデータでクラウドを更新しました。'); } catch (e) { setStatus('error', e.message); } },
            later: () => { st.status = 'conflict'; closeModal2(); updateBadge(); },
            onLocalSave: onLocalSave,
            updateBadge: updateBadge
        };
        if (document.readyState === 'complete') init(); else window.addEventListener('load', init);
    })();
    </script>
</body>
</html>
