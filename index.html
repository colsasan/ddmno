                                        const isLockedByWing = pMon.equippedItemId === 'wing_kakera' && pMon.lockedMoveIndex !== null && pMon.lockedMoveIndex !== sIdx;
                                        const isNekodamashiInvalid = skill.name === 'ねこだまし' && !pMon.isFirstTurn;
                                        const isLockedByCharge = !!pMon.chargingSkill && skill.name !== pMon.chargingSkill.name;
                                        const isChargingMove = !!pMon.chargingSkill && skill.name === pMon.chargingSkill.name;

                                        return `
                                            <button onclick="${isOnlineMode ? `sendOnlineAction('skill', ${sIdx})` : `executePlayerTurn(${sIdx})`}" ${(!isChargingMove && skill.pp <= 0) || isProcessing || isLockedByWing || isNekodamashiInvalid || isLockedByCharge || (isOnlineMode && onlineState.turnSubmitted) ? 'disabled' : ''} class="${sEl.button} p-3.5 rounded-2xl flex flex-col items-center justify-between transition transform hover:-translate-y-0.5 active:translate-y-0 shadow-lg font-bold disabled:opacity-30 border">
                                                <span class="text-sm tracking-wide truncate w-full text-center mb-1">${skill.name}${isChargingMove ? '（溜め完了）' : ''}</span>
                                                <span class="text-[10px] opacity-90 font-mono bg-black/40 px-2 py-0.5 rounded-full border border-white/10">CP: ${skill.pp}/${skill.maxPp}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                ${noUsableSkill ? `
                                <div class="mb-3">
                                    <button onclick="${isOnlineMode ? `sendOnlineAction('skill', -1)` : `executePlayerTurn(-1)`}" ${isProcessing || (isOnlineMode && onlineState.turnSubmitted) ? 'disabled' : ''} class="${ELEMENTS.normal.button} w-full p-3.5 rounded-2xl flex flex-col items-center justify-between transition shadow-lg font-bold disabled:opacity-30 border">
                                        <span class="text-sm tracking-wide">わるあがき</span>
                                        <span class="text-[10px] opacity-90">使える技がありません</span>
                                    </button>
                                </div>` : ''}
                                <div class="flex justify-center space-x-4 pt-3 border-t border-gray-800/80">
                                    <button onclick="playSound('click'); showSwitchMenu()" ${isProcessing || (isOnlineMode && onlineState.turnSubmitted) ? 'disabled' : ''} class="bg-gradient-to-r from-gray-800 to-gray-700 hover:from-gray-700 hover:to-gray-600 text-gray-200 text-xs font-bold py-2.5 px-8 rounded-xl border border-gray-600 transition shadow-lg disabled:opacity-40 flex items-center space-x-2">
                                        <span>🔄</span>
                                        <span>ポケモン交代 (1ターン消費)</span>
                                    </button>
                                </div>
                            `}
                        </div>

                    </div>
                </div>
            `;
            const logBox = document.getElementById('battle-log-box');
            if(logBox) logBox.scrollTop = logBox.scrollHeight;

            particleSystem.init('particle-canvas');
        }

        function processStartOfBattleTurn() {
            battleState.turnPhase = 'menu';
            renderBattleScreen();
        }

        function showSwitchMenu() {
            if (battleState.turnPhase === 'processing') return;
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cHasFreestyle = isAbilitySuppressor(cMon) || isAbilitySuppressor(pMon);

            // ブラック戦は特性による交代封じ判定の対象外。プレイヤーの手動交代を常に許可する。
            if (battleState.mode !== 'black' && !cHasFreestyle && ['だる絡み', 'ねばねば'].includes(cMon.ability.name)) {
                showModal('交代不可', `相手の【${cMon.name}】の特性「${cMon.ability.name}」により、ポケモンを交代することができない！`, '⚠️', closeModal);
                return;
            }

            const availableMonsters = battleState.playerTeam.map((m, idx) => ({ m, idx })).filter(item => item.idx !== battleState.playerIndex && item.m.hp > 0);
            if (availableMonsters.length === 0) {
                showModal('交代不可', '控えに戦闘可能なモンスターがいません！', '⚠️', closeModal);
                return;
            }
            const html = `
                <div class="space-y-3 w-full">
                    ${availableMonsters.map(item => `
                        <button onclick="playSound('click'); closeModal(); ${battleState.mode === 'online' ? `sendOnlineAction('switch', ${item.idx})` : `executeSwitch(${item.idx})`}" class="w-full bg-gray-800/90 hover:bg-gray-700 p-3.5 rounded-2xl flex items-center justify-between text-white font-bold border border-gray-700 shadow transition group">
                            <div class="flex items-center space-x-3 overflow-hidden">
                                <span class="text-base font-black truncate">${item.m.name}</span>
                                <div class="flex gap-1">
                                    ${item.m.element.map(elKey => {
                                        const el = ELEMENTS[elKey];
                                        return `<span class="text-[9px] px-2 py-0.5 rounded font-bold ${el.badge}">${el.name}</span>`;
                                    }).join('')}
                                </div>
                            </div>
                            <span class="text-xs text-emerald-400 font-mono font-bold whitespace-nowrap">HP:${item.m.hp}/${item.m.maxHp}</span>
                        </button>
                    `).join('')}
                </div>
            `;
            showModal('手持ちから交代', html, '🔄', closeModal);
        }

        function executeSwitch(newIdx) {
            if (!battleState || battleState.turnPhase === 'gameover') return;
            if (!Number.isInteger(Number(newIdx)) || !battleState.playerTeam[Number(newIdx)] || Number(newIdx) === battleState.playerIndex || battleState.playerTeam[Number(newIdx)].hp <= 0) return;
            // ブラック戦では「だる絡み」等の交代封じを適用せず、控えが生存していれば交代可能。
            if (battleState.mode !== 'black') {
                const activeEnemy = battleState.cpuTeam[battleState.cpuIndex];
                const activePlayer = battleState.playerTeam[battleState.playerIndex];
                const freestyle = isAbilitySuppressor(activeEnemy) || isAbilitySuppressor(activePlayer);
                if (!freestyle && activeEnemy?.ability?.name === 'だる絡み') return;
            }
            newIdx = Number(newIdx);
            battleState.turnPhase = 'processing';
            const prevMon = battleState.playerTeam[battleState.playerIndex];
            prevMon.lockedMoveIndex = null;

            const nextMon = battleState.playerTeam[newIdx];
            battleState.playerIndex = newIdx;
            nextMon.isFirstTurn = true;
            const baseElement = nextMon.baseElement || MONSTERS_DB[nextMon.baseId]?.element || nextMon.element;
            nextMon.element = [...baseElement];
            nextMon.baseElement = [...baseElement];
            nextMon.chargingSkill = null;
            nextMon.isReleasingCharge = false;
            nextMon.lockedMoveIndex = null;
            nextMon.abilityAtkMultiplier = 1;
            nextMon.abilityDefMultiplier = 1;
            nextMon.isSkipTurn = false;
            if (battleState.field.akuShuuTurns > 0) nextMon.status = 'akushyuu';
            if (nextMon.status === 'hirumi') nextMon.status = null;

            triggerOnEntryAbility(nextMon, true);

            if (battleState.field.stealthCutPlayer) {
                const isFuuyuu = nextMon.ability.name === 'ふゆう';
                const cMon = battleState.cpuTeam[battleState.cpuIndex];
                const hasFreestyle = isAbilitySuppressor(cMon);
                if (!isFuuyuu || hasFreestyle) {
                    const multi = getTypeMultiplier('jimen', nextMon.element);
                    const cutDmg = Math.max(1, Math.floor((nextMon.maxHp / 8) * multi));
                    nextMon.hp = Math.max(0, nextMon.hp - cutDmg);
                    battleState.log.push(`[ステルスカット] 交代して出てきた ${nextMon.name} に ${cutDmg} のダメージ！`);
                }
            }

            playSound('buff');
            battleState.log.push(`[交代] いけっ！ ${nextMon.name}！`);
            renderBattleScreen();

            setTimeout(() => {
                runCpuTurnAfterSwitch();
            }, 1000);
        }

        function runCpuTurnAfterSwitch() {
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cpuSkill = selectSmartCpuSkill(cMon, pMon);
            if(cpuSkill.pp > 0) cpuSkill.pp--;

            runAction(cMon, pMon, cpuSkill, false, null, () => {
                checkBattleEnd();
                if (battleState.turnPhase !== 'gameover') {
                    battleState.turnPhase = 'menu';
                    renderBattleScreen();
                }
            });
        }

        function selectSmartCpuSkill(cMon, pMon) {
            if (cMon.chargingSkill) return cMon.chargingSkill;

            let validSkills = cMon.skills.filter(s => s.pp > 0);
            validSkills = validSkills.filter(s => !(s.name === 'ねこだまし' && !cMon.isFirstTurn));

            if (cMon.equippedItemId === 'wing_kakera' && cMon.lockedMoveIndex !== null) {
                validSkills = [cMon.skills[cMon.lockedMoveIndex]];
            }

            if (validSkills.length === 0) {
                return { name: 'わるあがき', type: 'normal', category: 'physical', power: 50, accuracy: 100, maxPp: 1 };
            }

            for (let skill of validSkills) {
                if (skill.category !== 'status' && skill.power > 0) {
                    const multi = getTypeMultiplier(skill.type, pMon.element);
                    if (multi > 1) return skill;
                }
            }

            const hpRatio = cMon.hp / cMon.maxHp;
            if (hpRatio < 0.3) {
                const healSkill = validSkills.find(s => s.name === 'じこさいせい' || s.name === 'はねやすめ');
                if (healSkill) return healSkill;
            }

            const highPowerSkills = validSkills.filter(s => s.category !== 'status' && s.power >= 80);
            if (highPowerSkills.length > 0) {
                return highPowerSkills[Math.floor(Math.random() * highPowerSkills.length)];
            }

            return validSkills[Math.floor(Math.random() * validSkills.length)];
        }

        function executePlayerTurn(skillIdx) {
            if (battleState.turnPhase === 'processing') return;
            battleState.turnPhase = 'processing';

            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];

            if (pMon.equippedItemId === 'wing_kakera') {
                pMon.lockedMoveIndex = skillIdx;
            }

            let skill = pMon.chargingSkill || pMon.skills[skillIdx];
            if (!pMon.chargingSkill && skill.pp <= 0) {
                showModal('CP切れ', 'この技のCPが切れています！', '⚠️', closeModal);
                battleState.turnPhase = 'menu';
                renderBattleScreen();
                return;
            }
            if (!pMon.chargingSkill) skill.pp--;

            const cpuSkill = selectSmartCpuSkill(cMon, pMon);
            if(cpuSkill.pp > 0 && !cMon.chargingSkill) cpuSkill.pp--;

            let pSpeed = pMon.speed * getStageMultiplier(pMon.stages.speed);
            let cSpeed = cMon.speed * getStageMultiplier(cMon.stages.speed);
            
            if (pMon.equippedItemId === 'wing_kakera') pSpeed *= 1.5;
            if (cMon.equippedItemId === 'wing_kakera') cSpeed *= 1.5;
            if (pMon.name === 'マエザワン' && pMon.equippedItemId === 'katsura') pSpeed *= 2;
            if (cMon.name === 'マエザワン' && cMon.equippedItemId === 'katsura') cSpeed *= 2;

            if (pMon.status === 'mahi') pSpeed *= 0.5;
            if (cMon.status === 'mahi') cSpeed *= 0.5;
            if (battleState.field.oikazePlayerTurns > 0) pSpeed *= 2;
            if (battleState.field.oikazeCpuTurns > 0) cSpeed *= 2;

            function getPriority(mon, s) {
                if (mon.ability.name === '絶対命令' && mon.hp === mon.maxHp && s.type === 'ghost') return 1;
                if (s.name === 'ねこだまし' || s.name === 'はやてがえし') return 3;
                if (s.name === 'しんそく') return 2;
                if (s.name === 'アクアジェット' || s.name === 'しんくうは' || s.name === 'マッハパンチ') return 1;
                if (s.name === 'ジャッチキル') return -1;
                return 0;
            }

            let pPriority = getPriority(pMon, skill);
            let cPriority = getPriority(cMon, cpuSkill);

            const cHasFreestyle = isAbilitySuppressor(cMon) || isAbilitySuppressor(pMon);
            if (!cHasFreestyle) {
                if (pMon.ability.name === '安心感') pPriority = 0;
                if (cMon.ability.name === '安心感') cPriority = 0;
            }

            let playerFirst = (pPriority > cPriority) || (pPriority === cPriority && pSpeed >= cSpeed);

            if (pPriority === cPriority) {
                if (pMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = true;
                    battleState.log.push(`[装備発動: ${pMon.name}のDOPE] 先制行動！`);
                } else if (cMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = false;
                    battleState.log.push(`[装備発動: ${cMon.name}のDOPE] 先制行動！`);
                }
            }

            if (!cHasFreestyle) {
                if (pMon.ability.name === '最風' && Math.random() < 0.2) {
                    playerFirst = true;
                    battleState.log.push(`[特性発動: ${pMon.name}の最風] 20%の確率で先制する！`);
                }
                if (cMon.ability.name === '最風' && Math.random() < 0.2) {
                    playerFirst = false;
                    battleState.log.push(`[特性発動: ${cMon.name}の最風] 20%の確率で先制する！`);
                }
            }

            const finishNormalTurn = () => {
                if (battleState.turnPhase === 'gameover') return;
                processTurnEndEffects(() => {
                    if (battleState.turnPhase === 'gameover') return;
                    checkBattleEnd();
                    if (battleState.turnPhase === 'gameover') return;
                    const currentPlayer = battleState.playerTeam[battleState.playerIndex];
                    const currentCpu = battleState.cpuTeam[battleState.cpuIndex];
                    if (currentPlayer) currentPlayer.isFirstTurn = false;
                    if (currentCpu) currentCpu.isFirstTurn = false;
                    battleState.turnPhase = 'menu';
                    renderBattleScreen();
                });
            };

            const continueAfterFirstAction = (firstAttacker, firstDefender, nextAction) => {
                if (battleState.turnPhase === 'gameover') return;
                checkBattleEnd();
                if (battleState.turnPhase === 'gameover') return;

                // 最初の行動で相手が倒れた場合、そのターンの相手側の行動は発生させない。
                // ただし再描画でactive参照が変わっても、ターン進行自体は停止させない。
                if (!firstAttacker || !firstDefender || firstAttacker.hp <= 0 || firstDefender.hp <= 0) {
                    battleState.turnPhase = 'menu';
                    renderBattleScreen();
                    return;
                }

                const currentPlayer = battleState.playerTeam[battleState.playerIndex];
                const currentCpu = battleState.cpuTeam[battleState.cpuIndex];
                if (!currentPlayer || !currentCpu || currentPlayer.hp <= 0 || currentCpu.hp <= 0) {
                    battleState.turnPhase = 'menu';
                    renderBattleScreen();
                    return;
                }

                setTimeout(() => {
                    if (battleState.turnPhase === 'gameover') return;
                    const latestPlayer = battleState.playerTeam[battleState.playerIndex];
                    const latestCpu = battleState.cpuTeam[battleState.cpuIndex];
                    if (!latestPlayer || !latestCpu || latestPlayer.hp <= 0 || latestCpu.hp <= 0) {
                        battleState.turnPhase = 'menu';
                        renderBattleScreen();
                        return;
                    }
                    nextAction(latestPlayer, latestCpu);
                }, 1000);
            };

            const finishSecondAction = () => {
                if (battleState.turnPhase === 'gameover') return;
                checkBattleEnd();
                if (battleState.turnPhase === 'gameover') return;
                finishNormalTurn();
            };

            if (playerFirst) {
                runAction(
                    battleState.playerTeam[battleState.playerIndex],
                    battleState.cpuTeam[battleState.cpuIndex],
                    skill, true, cpuSkill,
                    () => continueAfterFirstAction(pMon, cMon, (currentPlayer, currentCpu) => {
                        runAction(currentCpu, currentPlayer, cpuSkill, false, skill, finishSecondAction);
                    })
                );
            } else {
                runAction(
                    battleState.cpuTeam[battleState.cpuIndex],
                    battleState.playerTeam[battleState.playerIndex],
                    cpuSkill, false, skill,
                    () => continueAfterFirstAction(cMon, pMon, (currentPlayer, currentCpu) => {
                        runAction(currentPlayer, currentCpu, skill, true, cpuSkill, finishSecondAction);
                    })
                );
            }
        }

        function processTurnEndEffects(callback) {
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];

            if (pMon.hp > 0 && pMon.equippedItemId === 'tabenokoshi' && pMon.hp < pMon.maxHp) {
                const heal = Math.max(1, Math.floor(pMon.maxHp / 16));
                pMon.hp = Math.min(pMon.maxHp, pMon.hp + heal);
                battleState.log.push(`[装備発動: ${pMon.name}のたべのこし] HPが ${heal} 回復した！`);
            }
            if (cMon.hp > 0 && cMon.equippedItemId === 'tabenokoshi' && cMon.hp < cMon.maxHp) {
                const heal = Math.max(1, Math.floor(cMon.maxHp / 16));
                cMon.hp = Math.min(cMon.maxHp, cMon.hp + heal);
                battleState.log.push(`[装備発動: ${cMon.name}のたべのこし] HPが ${heal} 回復した！`);
            }

            [pMon, cMon].forEach(mon => {
                if (!mon) return;
                const opposingActive = mon === pMon ? cMon : pMon;
                const traitSuppressed = isAbilitySuppressor(opposingActive) || isAbilitySuppressor(mon);
                if (mon.hp > 0 && mon.status === 'reishou' && mon.lastMoveUsedThisTurn) {
                    const usedMove = mon.lastMoveUsedThisTurn;
                    if (typeof usedMove.pp === 'number' && usedMove.pp > 0) {
                        usedMove.pp = Math.max(0, usedMove.pp - 1);
                        battleState.log.push(`[冷笑状態] ${mon.name}の${usedMove.name}のCPが追加で1減った！`);
                    }
                }
                mon.lastMoveUsedThisTurn = null;
                if (mon.hp <= 0) return;
                if (mon.status === 'yakedo' || mon.status === 'doku') {
                    const fraction = mon.status === 'yakedo' ? 16 : 8;
                    const damage = Math.max(1, Math.floor(mon.maxHp / fraction));
                    mon.hp = Math.max(0, mon.hp - damage);
                    battleState.log.push(`[${mon.status === 'yakedo' ? 'やけど' : 'どく'}] ${mon.name}は${damage}のダメージを受けた！`);
                }
                if (mon.hp > 0 && battleState.field.akuShuuTurns > 0 && !mon.element.includes('kusa') && !mon.element.includes('doku')) {
                    const akuDamage = Math.max(1, Math.floor(mon.maxHp / 16));
                    mon.hp = Math.max(0, mon.hp - akuDamage);
                    battleState.log.push(`[あくしゅう] ${mon.name}は${akuDamage}のダメージを受けた！`);
                }
                tryActivatePizzaPan(mon);
                const opposingActiveForTrait = mon === pMon ? cMon : pMon;
                const shigoTraitSuppressed = isAbilitySuppressor(opposingActiveForTrait) || isAbilitySuppressor(mon);
                if (mon.hp > 0 && !shigoTraitSuppressed && mon.ability?.name === '死後高速' && !mon.hasShigoSpeedBoost && mon.hp <= mon.maxHp / 2) {
                    mon.hasShigoSpeedBoost = true; mon.speed *= 2;
                    battleState.log.push(`[特性発動: ${mon.name}の死後高速] HPが半分以下になり、素早さが2倍になった！`);
                }
                if (mon.hp > 0) tryUseDisinfectant(mon);
            });
            if (battleState.field.akuShuuTurns > 0) {
                battleState.field.akuShuuTurns--;
                if (battleState.field.akuShuuTurns === 0) {
                    battleState.log.push('あたりのあくしゅう状態が消えた！');
                    [...battleState.playerTeam, ...battleState.cpuTeam].forEach(mon => { if (mon) mon.volatileStatuses = (mon.volatileStatuses || []).filter(x => x !== 'akushyuu'); });
                }
            }

            [['oikazePlayerTurns', '自分'], ['oikazeCpuTurns', '相手']].forEach(([key, label]) => {
                if (battleState.field[key] > 0) {
                    battleState.field[key]--;
                    if (battleState.field[key] === 0) battleState.log.push(`${label}の追い風が止んだ！素早さが元に戻った！`);
                }
            });

            renderBattleScreen();
            // ONLINEではターン乱数の同期を維持するため、ターン終了処理を
            // 乱数シードが有効な同一コール内で完了させる。
            if (battleState.mode === 'online') callback();
            else setTimeout(callback, 500);
        }

        function triggerParticleEffect(spriteId, particleType) {
            const targetEl = document.getElementById(spriteId);
            const canvasEl = document.getElementById('particle-canvas');
            if (!targetEl || !canvasEl) return;

            const tRect = targetEl.getBoundingClientRect();
            const cRect = canvasEl.getBoundingClientRect();

            const x = (tRect.left + tRect.width / 2) - cRect.left;
            const y = (tRect.top + tRect.height / 2) - cRect.top;

            particleSystem.spawn(x, y, particleType, 45);
        }

        function runAction(attacker, defender, skill, isPlayer, opponentSkill, callback) {
            // 1回の行動につきcallbackは必ず1回だけ実行する。
            // 演出・タイマー・再描画が重なってもターン進行を二重実行しない。
            let actionCallbackCalled = false;
            const finishAction = () => {
                if (actionCallbackCalled) return;
                actionCallbackCalled = true;
                if (typeof callback === 'function') callback();
            };
            attacker.isProtected = false;
            if (attacker.chargingSkill) skill = attacker.chargingSkill;
            if (skill.name === 'くちばしキャノン') attacker.isBeakCannonCharging = false;
            if (skill.name !== 'まもる') attacker.protectCount = 0;

            if (attacker.ability.name === 'マスク換え' && !attacker.hasTransformedMask) {
                attacker.hasTransformedMask = true;
                attacker.element = [skill.type];
                battleState.log.push(`[特性発動: ${attacker.name}のマスク換え] タイプが【${ELEMENTS[skill.type].name}】に変化した！`);
            }

            if (attacker.isSkipTurn) {
                attacker.lastMoveFailed = true;
                attacker.isSkipTurn = false;
                battleState.log.push(`${attacker.name}はピザ食いの反動で動けない！`);
                renderBattleScreen();
                setTimeout(finishAction, 1000);
                return;
            }

            tryUseDisinfectant(attacker);

            if (attacker.ability.name === '横揺れ') {
                attacker.stages.speed = Math.min(3, attacker.stages.speed + 1);
                battleState.log.push(`[特性発動: ${attacker.name}の横揺れ] 素早さが1段階上がった！`);
            }

            if ((attacker.volatileStatuses || []).includes('hirumi') || attacker.status === 'hirumi') {
                attacker.lastMoveFailed = true;
                attacker.volatileStatuses = (attacker.volatileStatuses || []).filter(x => x !== 'hirumi');
                if (attacker.status === 'hirumi') attacker.status = null;
                battleState.log.push(`${attacker.name}はひるんで動けない！`);
                renderBattleScreen();
                setTimeout(finishAction, 1000);
                return;
            }

            if (attacker.status === 'nemuri') {
                attacker.statusTurns = (attacker.statusTurns || 0) + 1;
                if (attacker.statusTurns > 2) {
                    attacker.status = null;
                    attacker.statusTurns = 0;
                    battleState.log.push(`${attacker.name}は目を覚ました！`);
                } else {
                    attacker.lastMoveFailed = true;
                    battleState.log.push(`${attacker.name}はぐっすり眠っている！`);
                    renderBattleScreen();
                    setTimeout(finishAction, 1000);
                    return;
                }
            }

            if (attacker.status === 'mahi' && Math.random() < 0.125) {
                attacker.lastMoveFailed = true;
                battleState.log.push(`${attacker.name}は身体が痺れて動けない！`);
                renderBattleScreen();
                setTimeout(finishAction, 1000);
                return;
            }

            if (attacker.status === 'panic') {
                attacker.statusTurns = (attacker.statusTurns || 0) + 1;
                if (attacker.statusTurns > 3) {
                    attacker.status = null;
                    attacker.statusTurns = 0;
                    battleState.log.push(`${attacker.name}のパニックが治まった！`);
                } else if (Math.random() < (1 / 3)) {
                    const selfDmg = Math.max(1, Math.floor(attacker.maxHp / 6));
                    attacker.hp = Math.max(0, attacker.hp - selfDmg);
                    attacker.lastMoveFailed = true;
                    playSound('hit');
                    battleState.log.push(`${attacker.name}はパニックで自分を攻撃してしまった！ (${selfDmg}ダメージ)`);
                    renderBattleScreen();
                    setTimeout(finishAction, 1000);
                    return;
                }
            }

            if (attacker.status === 'reishou' && Math.random() < 0.05) {
                attacker.lastMoveFailed = true;
                battleState.log.push(`${attacker.name}は冷笑状態のため技が出せない！`);
                renderBattleScreen();
                setTimeout(finishAction, 1000);
                return;
            }

            if (skill.name === 'ねこだまし' && !attacker.isFirstTurn) {
                attacker.lastMoveFailed = true;
                battleState.log.push(`${skill.name} は登場して最初に出す技ではないため失敗した！`);
                renderBattleScreen();
                setTimeout(finishAction, 1000);
                return;
            }

            if (skill.name === 'はやてがえし') {
                const oppPriority = opponentSkill ? ((opponentSkill.name === 'しんそく' ? 2 : (opponentSkill.name === 'ねこだまし' || opponentSkill.name === 'はやてがえし') ? 3 : (opponentSkill.name === 'アクアジェット' || opponentSkill.name === 'しんくうは' || opponentSkill.name === 'マッハパンチ') ? 1 : 0)) : 0;
                if (oppPriority <= 0) {
                    attacker.lastMoveFailed = true;
                    battleState.log.push(`${skill.name} は相手が先制技を使っていないため失敗した！`);
                    renderBattleScreen();
                    setTimeout(finishAction, 1000);
                    return;
                }
            }

            if (attacker.chargingSkill) {
                const execSkill = attacker.chargingSkill;
                attacker.chargingSkill = null;
                attacker.isReleasingCharge = true;
                battleState.log.push(`${attacker.name}は溜めていた力を解き放った！`);
                executeResolvedSkill(attacker, defender, execSkill, isPlayer, opponentSkill, finishAction);
                return;
            }
            executeResolvedSkill(attacker, defender, skill, isPlayer, opponentSkill, finishAction);
        }

        function performPivotSwitch(isPlayer) {
            const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
            const currentIndex = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
            const nextIndex = team.findIndex((mon, idx) => idx !== currentIndex && mon && mon.hp > 0);
            if (nextIndex < 0) return false;
            const outgoing = team[currentIndex];
            const enemyActive = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            const trapSuppressed = isAbilitySuppressor(enemyActive) || isAbilitySuppressor(outgoing);
            if (!trapSuppressed && ['だる絡み', 'ねばねば'].includes(enemyActive?.ability?.name)) return false;
            if (outgoing) outgoing.lockedMoveIndex = null;
            const nextMon = team[nextIndex];
            if (isPlayer) battleState.playerIndex = nextIndex;
            else battleState.cpuIndex = nextIndex;
            nextMon.isFirstTurn = true;
            const baseElement = nextMon.baseElement || MONSTERS_DB[nextMon.baseId]?.element || nextMon.element;
            nextMon.element = [...baseElement];
            nextMon.baseElement = [...baseElement];
            if (nextMon.ability?.name === '死後高速' && nextMon.hasShigoSpeedBoost) nextMon.speed /= 2;
            nextMon.hasShigoSpeedBoost = false;
            nextMon.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
            nextMon.volatileStatuses = [];
            nextMon.damageTakenThisTurn = 0;
            nextMon.damageTakenPhysicalThisTurn = 0;
            nextMon.isBeakCannonCharging = false;
            nextMon.roostedElement = null;
            nextMon.lastMoveFailed = false;
            nextMon.chargingSkill = null;
            nextMon.isReleasingCharge = false;
            nextMon.lockedMoveIndex = null;
            nextMon.isSkipTurn = false;
            nextMon.isProtected = false;
            nextMon.protectCount = 0;
            nextMon.hasTransformedMask = false;
            nextMon.abilityAtkMultiplier = 1;
            nextMon.abilityDefMultiplier = 1;
            if (battleState.field.akuShuuTurns > 0) nextMon.volatileStatuses = [...new Set([...(nextMon.volatileStatuses || []), 'akushyuu'])];
            if (nextMon.status === 'hirumi') nextMon.status = null;
            triggerOnEntryAbility(nextMon, isPlayer);
            const hazardActive = isPlayer ? battleState.field.stealthCutPlayer : battleState.field.stealthCutCpu;
            const enemy = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            const enemyFreestyle = isAbilitySuppressor(enemy);
            if (hazardActive && (nextMon.ability.name !== 'ふゆう' || enemyFreestyle)) {
                const hazardMulti = getTypeMultiplier('jimen', nextMon.element);
                if (hazardMulti > 0) {
                    const hazardDamage = Math.max(1, Math.floor((nextMon.maxHp / 8) * hazardMulti));
                    nextMon.hp = Math.max(0, nextMon.hp - hazardDamage);
                    battleState.log.push(`[ステルスカット] ${nextMon.name}に${hazardDamage}のダメージ！`);
                } else {
                    battleState.log.push(`[ステルスカット] ${nextMon.name}には効果がない！`);
                }
            }
            battleState.log.push(`[交代技] ${outgoing.name}は戻り、${nextMon.name}が戦闘に出た！`);
            return true;
        }

        function applyBinjoFromStageChanges(sourceMon, sourceIsPlayer, stagesBefore) {
            if (!sourceMon || !stagesBefore || !battleState) return;
            const targetTeam = sourceIsPlayer ? battleState.cpuTeam : battleState.playerTeam;
            const targetIndex = sourceIsPlayer ? battleState.cpuIndex : battleState.playerIndex;
            const copyMon = targetTeam && targetTeam[targetIndex];
            if (!copyMon || copyMon.hp <= 0 || copyMon.ability?.name !== 'びんじょう') return;
            const statNames = { atk: '攻撃', def: '防御', spa: '特攻', spd: '特防', speed: '素早さ' };
            const copied = [];
            Object.keys(statNames).forEach(stat => {
                const gained = Math.max(0, (sourceMon.stages?.[stat] || 0) - (stagesBefore[stat] || 0));
                if (gained > 0) {
                    const oldStage = copyMon.stages[stat] || 0;
                    const nextStage = Math.min(3, oldStage + gained);
                    const actualGain = nextStage - oldStage;
                    if (actualGain > 0) {
                        copyMon.stages[stat] = nextStage;
                        copied.push(`${statNames[stat]}+${actualGain}`);
                    }
                }
            });
            if (copied.length) battleState.log.push(`[特性発動: ${copyMon.name}のびんじょう] 相手の能力上昇に便乗！ ${copied.join('・')}！`);
        }

        function showBattleSkillPresentation(skill, attackerSpriteId, targetSpriteId) {
            const power = Number(skill && skill.power) || 0;
            const rank = power >= 130 ? 4 : power >= 90 ? 3 : power >= 60 ? 2 : 1;
            const labels = { 1: 'CHANCE', 2: 'FEVER', 3: '激熱', 4: 'ULTIMATE FEVER' };
            const colors = { honoo:'#ff5a1f', mizu:'#22d3ee', kusa:'#4ade80', denki:'#fde047', normal:'#f8fafc', kakuto:'#fb7185', aku:'#c084fc', doku:'#e879f9', jimen:'#fbbf24', hikou:'#7dd3fc', ghost:'#a78bfa' };
            const color = colors[skill?.type] || '#f8fafc';
            const root = document.createElement('div');
            root.className = 'battle-fx-overlay';
            root.style.setProperty('--fx-color', color);
            const intensity = rank === 4 ? 'fx-flash fx-ultimate' : 'fx-flash';
            root.innerHTML = `<div class="${intensity}"></div>${rank >= 2 ? '<div class="fx-rays"></div><div class="fx-burst"></div>' : ''}<div class="fx-title">${String(skill?.name || 'ATTACK').replace(/[<>]/g, '')}</div><div class="fx-rank">${labels[rank]}</div>`;
            document.body.appendChild(root);
            const app = document.getElementById('app-container');
            if (app && rank >= 2) {
                app.classList.remove('battle-shake');
                void app.offsetWidth;
                app.classList.add('battle-shake');
                setTimeout(() => app.classList.remove('battle-shake'), 460);
            }
            if (rank >= 3) {
                root.style.background = 'radial-gradient(circle at center, transparent 18%, rgba(0,0,0,.62) 100%)';
            }
            if (rank === 4) {
                const flash = root.querySelector('.fx-flash');
                if (flash) flash.style.background = 'linear-gradient(120deg,rgba(255,0,120,.72),rgba(255,210,0,.72),rgba(0,220,255,.72),rgba(180,80,255,.72))';
            }
            setTimeout(() => root.remove(), 1120);
        }

        function showBattleDamageNumber(targetSpriteId, damage) {
            if (!(damage > 0)) return;
            const target = document.getElementById(targetSpriteId);
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const pop = document.createElement('div');
            pop.className = 'battle-damage-pop';
            pop.textContent = `-${Math.floor(damage)}`;
            pop.style.left = `${rect.left + rect.width / 2}px`;
            pop.style.top = `${rect.top + rect.height * .2}px`;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        function executeResolvedSkill(attacker, defender, skill, isPlayer, opponentSkill, callback) {
            let resolvedCallbackCalled = false;
            const finishResolvedSkill = () => {
                if (resolvedCallbackCalled) return;
                resolvedCallbackCalled = true;
                // わるあがきは、当たったかどうかに関わらず使うたびに最大HPの1/4の反動を受ける。
                // (CPが尽きた同士で互いにダメージが通らない場合でも、バトルが必ず決着するようにする)
                if (skill.name === 'わるあがき' && attacker.hp > 0) {
                    const struggleRecoil = Math.max(1, Math.floor(attacker.maxHp / 4));
                    attacker.hp = Math.max(0, attacker.hp - struggleRecoil);
                    battleState.log.push(`${attacker.name}はわるあがきの反動で ${struggleRecoil} のダメージを受けた！`);
                    renderBattleScreen();
                }
                if (typeof callback === 'function') callback();
            };
            const previousMoveFailed = !!attacker.lastMoveFailed;
            attacker.lastMoveFailed = false;
            attacker.lastMoveUsedThisTurn = skill;
            if (skill.name === 'ジャッチキル') {
                const enemyTeam = isPlayer ? battleState.cpuTeam : battleState.playerTeam;
                const enemyIndex = isPlayer ? battleState.cpuIndex : battleState.playerIndex;
                const candidates = enemyTeam.map((m, i) => i).filter(i => i !== enemyIndex && enemyTeam[i] && enemyTeam[i].hp > 0);
                if (candidates.length) {
                    const forcedIndex = candidates[Math.floor(Math.random() * candidates.length)];
                    battleSwitchInternal(!isPlayer, forcedIndex, true);
                    defender = enemyTeam[isPlayer ? battleState.cpuIndex : battleState.playerIndex];
                    battleState.log.push(`[技効果] ジャッチキルで相手を強制交代させた！`);
                }
            }
            const defenderHpBeforeMove = defender.hp;
            const attackerStagesBefore = { ...attacker.stages };
            const defenderStagesBefore = { ...defender.stages };
            battleState.log.push(`${attacker.name}の ${skill.name}！`);

            const targetSpriteId = isPlayer ? 'cpu-sprite' : 'player-sprite';
            const attackerSpriteId = isPlayer ? 'player-sprite' : 'cpu-sprite';

            // 攻撃時のキャラアイコンにはアニメーションを適用しない。
            // 技の効果音・画面演出・命中/ダメージ処理は従来どおり維持する。
            if (skill.type === 'honoo') playSound('honoo');
            else if (skill.type === 'mizu') playSound('mizu');
            else if (skill.type === 'kusa') playSound('kusa');
            else if (skill.type === 'denki') playSound('denki');
            else if (skill.type === 'ghost') playSound('ghost');
            else playSound('hit');

            // 技威力を参照するだけの演出ランク。威力・命中・乱数・処理順は変更しない。
            showBattleSkillPresentation(skill, attackerSpriteId, targetSpriteId);

            if (skill.category === 'status' && (skill.name.includes('じこさいせい') || skill.name.includes('はねやすめ') || skill.name.includes('リフレッシュ'))) {
                playSound('heal');
                triggerParticleEffect(attackerSpriteId, 'heal');
            } else if (skill.category === 'status') {
                playSound('buff');
                triggerParticleEffect(attackerSpriteId, 'buff');
            } else {
                triggerParticleEffect(targetSpriteId, skill.type);
            }

            if (skill.name === 'ゴッドバード' && !attacker.isReleasingCharge) {
                attacker.chargingSkill = skill;
                battleState.log.push(`${attacker.name}は光り輝く羽を溜めている！（溜め状態）`);
                renderBattleScreen();
                setTimeout(finishResolvedSkill, 1000);
                return;
            }
            attacker.isReleasingCharge = false;

            if (defender.isProtected) {
                attacker.lastMoveFailed = true;
                battleState.log.push(`${defender.name}はまもるで攻撃を防いだ！`);
                if (skill.name === 'とびあごげり') {
                    const crash = Math.max(1, Math.floor(attacker.maxHp / 4));
                    attacker.hp = Math.max(0, attacker.hp - crash);
                    battleState.log.push(`${attacker.name}は技が失敗した反動で${crash}ダメージを受けた！`);
                }
                renderBattleScreen();
                setTimeout(finishResolvedSkill, 1000);
                return;
            }

            if (Math.random() * 100 > skill.accuracy) {
                battleState.log.push(`しかし ${skill.name} は外れた！`);
                attacker.lastMoveFailed = true;
                if (skill.name === 'かかとおとし' || skill.name === 'サンダーダイブ' || skill.name === 'とびあごげり') {
                    const failDmg = Math.floor(attacker.maxHp / (skill.name === 'サンダーダイブ' ? 2 : skill.name === 'とびあごげり' ? 4 : 3));
                    attacker.hp = Math.max(0, attacker.hp - failDmg);
                    battleState.log.push(`技を外した反動で ${attacker.name} は ${failDmg} のダメージを受けた！`);
                }
                renderBattleScreen();
                setTimeout(finishResolvedSkill, 1000);
                return;
            }

            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const hasFreestyle = isAbilitySuppressor(cMon) || attacker.ability.name === 'フリースタイル' || defender.ability.name === 'フリースタイル';

            if (!hasFreestyle && attacker.ability.name !== 'マイクラスルーム' && skill.category === 'status' && defender.ability.name === 'ツバサボディ') {
                attacker.lastMoveFailed = true;
                battleState.log.push(`[特性発動: ${defender.name}のツバサボディ] 変化技を完全に無効化した！`);
                renderBattleScreen();
                setTimeout(finishResolvedSkill, 1000);
                return;
            }

            if (!hasFreestyle && attacker.ability.name !== 'マイクラスルーム' && defender.ability.name === 'バスケライフ' && skill.type !== 'kakuto') {
                attacker.lastMoveFailed = true;
                battleState.log.push(`[特性発動: ${defender.name}のバスケライフ] かくとうタイプ以外の技を無効化した！`);
                renderBattleScreen();
                setTimeout(finishResolvedSkill, 1000);
                return;
            }

            let damageMultiplier = 1.0;
            if (skill.category !== 'status' && attacker.ability?.name === '唐突衝動' && !hasFreestyle && Math.random() < 0.2) {
                damageMultiplier *= 1.8;
                battleState.log.push(`[特性発動: ${attacker.name}の唐突衝動] 技の威力が1.8倍になった！`);
            }
            if (skill.category !== 'status' && attacker.equippedItemId === 'kanshakudama') {
                damageMultiplier *= 1.3;
                const selfDmg = Math.max(1, Math.floor(attacker.maxHp / 10));
                attacker.hp = Math.max(0, attacker.hp - selfDmg);
                battleState.log.push(`[装備発動: ${attacker.name}の癇癪玉] 威力1.3倍だが、自傷ダメージでHPが ${selfDmg} 減少！`);
            }

            // totalDamage は技のダメージ処理(攻撃技ブロック)の外側でも参照するため、関数スコープで宣言する。
            let totalDamage = 0;
            if (skill.category === 'status') {
                if (skill.name === 'まもる') {
                    const protectChance = Math.pow(1 / 3, attacker.protectCount || 0);
                    if (Math.random() < protectChance) {
                        attacker.isProtected = true;
                        attacker.protectCount = (attacker.protectCount || 0) + 1;
                        battleState.log.push(`${attacker.name}は身を守る態勢に入った！`);
                    } else {
                        attacker.lastMoveFailed = true;
                        attacker.protectCount = 0;
                        battleState.log.push(`${attacker.name}はまもるに失敗した！`);
                    }
                } else if (skill.name === 'とばす') {
                    const enemyTeamArr = isPlayer ? battleState.cpuTeam : battleState.playerTeam;
                    const aliveIndexes = enemyTeamArr.map((m, idx) => idx).filter(idx => idx !== (isPlayer ? battleState.cpuIndex : battleState.playerIndex) && enemyTeamArr[idx].hp > 0);
                    if (aliveIndexes.length > 0) {
                        const randTarget = aliveIndexes[Math.floor(Math.random() * aliveIndexes.length)];
                        // 強制交代も通常の交代と同じ処理(登場時の状態リセット・特性・ステルスカット)を通す
                        battleSwitchInternal(!isPlayer, randTarget, true);
                        battleState.log.push(`とばされて ${enemyTeamArr[randTarget].name} が引っ張り出された！`);
                    } else {
                        attacker.lastMoveFailed = true;
                        battleState.log.push(`しかし控えがいないため失敗した！`);
                    }
                } else if (skill.name === 'あくび') {
                    defender.status = 'nemuri';
                    defender.statusTurns = 0;
                    battleState.log.push(`${defender.name}はねむり状態になった！`);
                } else if (skill.name === 'じこさいせい' || skill.name === 'はねやすめ') {
                    const heal = Math.floor(attacker.maxHp / 2);
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                    if (skill.name === 'はねやすめ' && attacker.element.includes('hikou')) {
                        attacker.roostedElement = [...attacker.element];
                        attacker.element = attacker.element.filter(type => type !== 'hikou');
                        battleState.log.push(`${attacker.name}はこのターン、ひこうタイプでなくなった！`);
                    }
                    battleState.log.push(`${attacker.name}のHPが回復した！`);
                } else if (skill.name === 'はねる') {
                    const heal = Math.max(1, Math.floor(attacker.maxHp / 4));
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                    battleState.log.push(`${attacker.name}ははねてHPが${heal}回復した！`);
                } else if (skill.name === 'つるぎのまい') {
                    attacker.stages.atk = Math.min(3, attacker.stages.atk + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の攻撃が1段階上がった！`);
                } else if (skill.name === 'てっぺき') {
                    attacker.stages.def = Math.min(3, attacker.stages.def + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の防御が1段階上がった！`);
                } else if (skill.name === 'ビルドアップ') {
                    attacker.stages.atk = Math.min(3, attacker.stages.atk + 1);
                    attacker.stages.def = Math.min(3, attacker.stages.def + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の攻撃と防御が1段階上がった！`);
                } else if (skill.name === 'くしゃみ') {
                    defender.stages.spd = Math.max(-3, defender.stages.spd - 1);
                    defender.stages.speed = Math.max(-3, defender.stages.speed - 1);
                    battleState.log.push(`[技効果] ${defender.name}の特防と素早さが1段階下がった！`);
                } else if (skill.name === 'ねむりごな') {
                    if (defender.element.includes('kusa')) { attacker.lastMoveFailed = true; battleState.log.push(`${defender.name}はくさタイプなので、ねむりごなは効かなかった！`); }
                    else { defender.status = 'nemuri'; defender.statusTurns = 0; battleState.log.push(`${defender.name}はねむり状態になった！`); }
                } else if (skill.name === 'みずみたし') {
                    defender.element = ['mizu'];
                    battleState.log.push(`[技効果] ${defender.name}のタイプがみずタイプに変化した！`);
                } else if (skill.name === 'クリアスモッグ') {
                    defender.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
                    battleState.log.push(`[技効果] ${defender.name}の能力変化が元に戻った！`);
                } else if (skill.name === 'とぐろをまく') {
                    ['atk', 'def', 'speed'].forEach(stat => attacker.stages[stat] = Math.min(3, attacker.stages[stat] + 1));
                    battleState.log.push(`[ステータス変動] ${attacker.name}の攻撃・防御・素早さが1段階上がった！`);
                } else if (skill.name === 'おきみやげ') {
                    defender.stages.atk = Math.max(-3, defender.stages.atk - 2);
                    defender.stages.spa = Math.max(-3, defender.stages.spa - 2);
                    attacker.hp = 0;
                    battleState.log.push(`[技効果] ${defender.name}の攻撃と特攻が2段階下がり、${attacker.name}は力尽きた！`);
                } else if (skill.name === 'すてゼリフ') {
                    defender.stages.atk = Math.max(-3, defender.stages.atk - 1);
                    defender.stages.spa = Math.max(-3, defender.stages.spa - 1);
                    battleState.log.push(`[技効果] ${defender.name}の攻撃と特攻が1段階下がった！`);
                    if (!performPivotSwitch(isPlayer)) battleState.log.push(`${attacker.name}は交代しようとしたが、控えがいない！`);
                } else if (skill.name === 'いやなおと') {
                    defender.stages.def = Math.max(-3, defender.stages.def - 1);
                    battleState.log.push(`[ステータス変動] ${defender.name}の防御が1段階下がった！`);
                } else if (skill.name === 'うそなき' || skill.name === 'かいでんぱ') {
                    defender.stages.spd = Math.max(-3, defender.stages.spd - 2);
                    battleState.log.push(`[ステータス変動] ${defender.name}の能力が下がった！`);
                } else if (skill.name === 'わるだくみ') {
                    attacker.stages.spa = Math.min(3, attacker.stages.spa + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の特攻が1段階上がった！`);
                } else if (skill.name === 'おにび') {
                    tryInflictBurn(defender, 'おにび');
                } else if (skill.name === 'でんじは') {
                    if (defender.element.includes('jimen')) { attacker.lastMoveFailed = true; battleState.log.push(`${defender.name}はじめんタイプなので、でんじはは効かなかった！`); }
                    else { defender.status = 'mahi'; battleState.log.push(`${defender.name}はまひ状態になった！`); }
                } else if (skill.name === 'どくのいと') {
                    defender.stages.speed = Math.max(-3, defender.stages.speed - 1);
                    defender.status = 'doku';
