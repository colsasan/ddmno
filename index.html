        /* ================================================================
         * BATTLE ENGINE SAFETY / TURN FLOW PATCH
         * - Keeps existing save data and all existing battle calculations.
         * - Replaces only the turn/KO/switch orchestration so every action
         *   resolves exactly once and a battle can never remain in processing.
         * ================================================================ */
        // わるあがき: 使える技が1つも無いときに選べる行動(既存のCPU用わるあがきと同じ性能)
        function battleStruggleSkill() {
            return { name: 'わるあがき', type: 'normal', category: 'physical', power: 50, accuracy: 100, maxPp: 1 };
        }

        // 通常の技がすべて選べない(CP切れ・ウィングのかけらの固定・ねこだまし不可)状態か
        function battleHasNoUsableSkill(mon) {
            if (!mon || !Array.isArray(mon.skills) || mon.skills.length === 0) return true;
            if (mon.chargingSkill) return false;
            return mon.skills.every((skill, idx) => {
                const lockedByWing = mon.equippedItemId === 'wing_kakera' && mon.lockedMoveIndex !== null && mon.lockedMoveIndex !== undefined && mon.lockedMoveIndex !== idx;
                const invalidNekodamashi = skill.name === 'ねこだまし' && !mon.isFirstTurn;
                return skill.pp <= 0 || lockedByWing || invalidNekodamashi;
            });
        }

        // 別のバトルに切り替わった/終了した後に、古いタイマーから進行処理が走らないようにする
        function battleIsStale(bs) {
            return !battleState || battleState !== bs || battleState.turnPhase === 'gameover';
        }

        // ターン終了時に持ち越してはいけない「そのターン限り」の状態を解除する
        function battleClearTurnFlags() {
            if (!battleState) return;
            [...battleState.playerTeam, ...battleState.cpuTeam].forEach(mon => {
                if (!mon) return;
                mon.isProtected = false;
                mon.damageTakenThisTurn = 0;
                mon.damageTakenPhysicalThisTurn = 0;
                mon.isBeakCannonCharging = false;
                if (mon.roostedElement) { mon.element = mon.roostedElement; mon.roostedElement = null; }
                mon.volatileStatuses = (mon.volatileStatuses || []).filter(x => x !== 'hirumi');
                if (mon.status === 'hirumi') mon.status = null;
            });
        }

        function battleResetTurnState() {
            if (!battleState) return;
            battleState.turnSerial = (battleState.turnSerial || 0) + 1;
            battleState.actionLock = false;
            battleState.resultResolved = false;
        }

        function battleAliveIndex(team, exceptIndex = -1) {
            if (!Array.isArray(team)) return -1;
            return team.findIndex((m, i) => i !== exceptIndex && m && m.hp > 0);
        }

        function battleCanSwitch(isPlayer) {
            if (!battleState) return false;
            const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
            const index = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
            if (battleAliveIndex(team, index) < 0) return false;
            const enemy = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            const active = team[index];
            const suppressed = isAbilitySuppressor(enemy) || isAbilitySuppressor(active);
            if (battleState.mode !== 'black' && !suppressed && ['だる絡み', 'ねばねば'].includes(enemy?.ability?.name)) return false;
            return true;
        }

        function battleSwitchInternal(isPlayer, newIdx, isForced = false) {
            if (!battleState) return false;
            const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
            const currentIndex = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
            newIdx = Number(newIdx);
            if (!Number.isInteger(newIdx) || !team[newIdx] || newIdx === currentIndex || team[newIdx].hp <= 0) return false;

            const enemy = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            const active = team[currentIndex];
            const freestyle = isAbilitySuppressor(enemy) || isAbilitySuppressor(active);
            if (!isForced && battleState.mode !== 'black' && !freestyle && ['だる絡み', 'ねばねば'].includes(enemy?.ability?.name)) return false;

            if (active) active.lockedMoveIndex = null;
            const nextMon = team[newIdx];
            if (isPlayer) battleState.playerIndex = newIdx;
            else battleState.cpuIndex = newIdx;

            nextMon.isFirstTurn = true;
            const baseElement = nextMon.baseElement || MONSTERS_DB[nextMon.baseId]?.element || nextMon.element;
            nextMon.element = [...baseElement];
            nextMon.baseElement = [...baseElement];
            if (nextMon.ability?.name === '死後高速' && nextMon.hasShigoSpeedBoost) nextMon.speed /= 2;
            nextMon.hasShigoSpeedBoost = false;
            nextMon.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
            nextMon.volatileStatuses = [];
            nextMon.damageTakenThisTurn = 0;
            nextMon.damageTakenPhysicalThisTurn = 0;
            nextMon.isBeakCannonCharging = false;
            nextMon.roostedElement = null;
            nextMon.lastMoveFailed = false;
            nextMon.chargingSkill = null;
            nextMon.isReleasingCharge = false;
            nextMon.lockedMoveIndex = null;
            nextMon.isSkipTurn = false;
            nextMon.isProtected = false;
            nextMon.protectCount = 0;
            nextMon.hasTransformedMask = false;
            nextMon.abilityAtkMultiplier = 1;
            nextMon.abilityDefMultiplier = 1;
            if (battleState.field.akuShuuTurns > 0) nextMon.volatileStatuses = [...new Set([...(nextMon.volatileStatuses || []), 'akushyuu'])];
            if (nextMon.status === 'hirumi') nextMon.status = null;

            triggerOnEntryAbility(nextMon, isPlayer);

            const hazardActive = isPlayer ? battleState.field.stealthCutPlayer : battleState.field.stealthCutCpu;
            const enemyNow = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            if (hazardActive) {
                const isFuuyuu = nextMon.ability?.name === 'ふゆう';
                const enemyFreestyle = isAbilitySuppressor(enemyNow);
                if (!isFuuyuu || enemyFreestyle) {
                    const multi = getTypeMultiplier('jimen', nextMon.element);
                    if (multi > 0) {
                        const hazardDamage = Math.max(1, Math.floor((nextMon.maxHp / 8) * multi));
                        nextMon.hp = Math.max(0, nextMon.hp - hazardDamage);
                        battleState.log.push(`[ステルスカット] 交代して出てきた ${nextMon.name} に ${hazardDamage} のダメージ！`);
                    } else {
                        battleState.log.push(`[ステルスカット] ${nextMon.name}には効果がない！`);
                    }
                }
            }

            battleState.log.push(`[交代] ${active ? active.name + 'は戻り、' : ''}${nextMon.name}が戦闘に出た！`);
            playSound('buff');
            renderBattleScreen();
            return nextMon.hp > 0;
        }

        function battleResolveFaints() {
            if (!battleState || battleState.turnPhase === 'gameover') return { playerAlive: true, cpuAlive: true, ended: false };

            const pCurrent = battleState.playerTeam[battleState.playerIndex];
            const cCurrent = battleState.cpuTeam[battleState.cpuIndex];
            const faintOccurred = !!((cCurrent && cCurrent.hp <= 0) || (pCurrent && pCurrent.hp <= 0));

            if (cCurrent && cCurrent.hp <= 0 && !cCurrent.__battleFaintLogged) {
                cCurrent.__battleFaintLogged = true;
                playSound('faint');
                battleState.log.push(`相手の ${cCurrent.name} は倒れた！`);
            }
            if (pCurrent && pCurrent.hp <= 0 && !pCurrent.__battleFaintLogged) {
                pCurrent.__battleFaintLogged = true;
                playSound('faint');
                battleState.log.push(`${pCurrent.name} は倒れてしまった！`);
            }

            const cpuHasAlive = battleAliveIndex(battleState.cpuTeam, -1) >= 0;
            const playerHasAlive = battleAliveIndex(battleState.playerTeam, -1) >= 0;

            if (!cpuHasAlive || !playerHasAlive) {
                battleState.turnPhase = 'gameover';
                if (battleState.resultResolved) return { playerAlive: playerHasAlive, cpuAlive: cpuHasAlive, ended: true, faintOccurred };
                battleState.resultResolved = true;
                stopBattleBGM();
                // 報酬画面など、全画面の結果表示に切り替えた場合は、直後にバトル画面で上書きしない
                let resultScreenShown = false;

                if (battleState.mode === 'arcade') {
                    if (playerHasAlive && !cpuHasAlive) {
                        arcadeState.wins++;
                        if (arcadeState.currentStage < 3) {
                            const clearedStage = arcadeState.currentStage;
                            arcadeState.currentStage++;
                            saveGame();
                            battleState.log.push(`第${clearedStage}戦 勝利！次のトレーナー戦へ進みます！`);
                            showModal(`STAGE ${clearedStage} 勝利！ 🎉`, `第${clearedStage}戦に勝利しました！\n（※アーケードモードの報酬は3連勝達成時のみ獲得できます）`, '🏆', () => {
                                closeModal();
                                renderArcadePreview();
                            });
                        } else {
                            processArcadeVictory();
                            resultScreenShown = true;
                        }
                    } else {
                        arcadeState = null;
                        showModal('敗北… 挑戦終了 💦', 'アーケードモードで敗北しました。\n途中の勝利報酬も含め、報酬は付与されません。', '💀', () => {
                            closeModal();
                            renderArcadeHub();
                        });
                    }
                } else if (battleState.mode === 'black') {
                    if (playerHasAlive && !cpuHasAlive) {
                        gameState.inventory.push(createMonsterInstance('jahibi'));
                        saveGame();
                        renderJahibiAcquisitionScreen(false);
                        resultScreenShown = true;
                    } else {
                        showModal('敗北… 💦', 'ブラックとのバトルに敗北しました。', '☠️', () => { closeModal(); showMenu(); });
                    }
                } else if (battleState.mode === 'vip') {
                    if (playerHasAlive && !cpuHasAlive) {
                        if (Math.random() < 0.15) {
                            const rewardId = ['mirudew','shigo','tsumi'][Math.floor(Math.random()*3)];
                            const reward = createMonsterInstance(rewardId);
                            gameState.inventory.push(reward);
                            saveGame();
                            renderVipAcquisitionScreen(reward);
                        } else {
                            saveGame();
                            showModal('VIPルーム勝利！', '3体すべてに勝利した！今回はモンスターの獲得はありませんでした（獲得確率15%）。', '🏆', () => { closeModal(); showMenu(); });
                        }
                    } else {
                        saveGame();
                        showModal('VIPルーム敗北', '限定モンスターたちに敗北した。', '☠️', () => { closeModal(); showMenu(); });
                    }
                    resultScreenShown = true;
                } else if (battleState.mode === 'online') {
                    // ONLINE uses finishOnlineTurn for its result screen.
                } else {
                    if (playerHasAlive && !cpuHasAlive) {
                        gameState.coins += 150;
                        saveGame();
                        if (Math.random() < 0.05) {
                            showModal('勝利！ 🎉', 'カジュアルマッチ勝利！150コイン獲得！<br><br><span class="text-purple-300 font-black">……しかし、謎のトレーナー【ブラック】が現れた。</span><br>特別なバトルに挑戦しますか？', '⬛', () => { closeModal(); showMenu(); });
                            const buttons = document.getElementById('modal-buttons');
                            if (buttons) buttons.innerHTML = '<button onclick="startBlackBattle()" class="flex-1 bg-gradient-to-r from-red-700 to-purple-800 text-white font-black py-3 rounded-xl">ブラックと対戦する</button><button onclick="closeModal();showMenu()" class="flex-1 bg-gray-700 text-white font-bold py-3 rounded-xl">今回はやめる</button>';
                        } else {
                            showModal('勝利！ 🎉', 'カジュアルマッチに勝利しました！\n報酬として 150 コイン獲得しました！', '🏆', () => { closeModal(); showMenu(); });
                        }
                    } else {
                        gameState.coins += 50;
                        saveGame();
                        showModal('敗北… 💦', 'チームが全滅してしまいました…\n参加賞として 50 コイン獲得しました。', '☠️', () => { closeModal(); showMenu(); });
                    }
                }
                if (!resultScreenShown) renderBattleScreen();
                return { playerAlive: playerHasAlive, cpuAlive: cpuHasAlive, ended: true, faintOccurred };
            }

            if (cCurrent && cCurrent.hp <= 0) {
                const nextCpu = battleAliveIndex(battleState.cpuTeam, -1);
                if (nextCpu >= 0 && nextCpu !== battleState.cpuIndex) battleSwitchInternal(false, nextCpu, true);
            }
            if (pCurrent && pCurrent.hp <= 0) {
                const nextPlayer = battleAliveIndex(battleState.playerTeam, -1);
                if (nextPlayer >= 0 && nextPlayer !== battleState.playerIndex) battleSwitchInternal(true, nextPlayer, true);
            }

            // 繰り出した直後にステルスカット等で再び倒れた場合は、場が安定するまで同じ処理を繰り返す
            // (倒れたポケモンは毎回1体ずつ増えるため、必ず有限回で終わる)
            const pNow = battleState.playerTeam[battleState.playerIndex];
            const cNow = battleState.cpuTeam[battleState.cpuIndex];
            if ((pNow && pNow.hp <= 0) || (cNow && cNow.hp <= 0)) {
                const again = battleResolveFaints();
                return { ...again, faintOccurred: true };
            }

            renderBattleScreen();
            return { playerAlive: true, cpuAlive: true, ended: false, faintOccurred };
        }

        function battleActionPriority(mon, skill) {
            if (!mon || !skill) return 0;
            if (mon.ability?.name === '絶対命令' && mon.hp === mon.maxHp && skill.type === 'ghost') return 1;
            if (['ねこだまし', 'はやてがえし'].includes(skill.name)) return 3;
            if (skill.name === 'しんそく') return 2;
            if (['アクアジェット', 'しんくうは', 'マッハパンチ'].includes(skill.name)) return 1;
            if (skill.name === 'ジャッチキル') return -1;
            return 0;
        }

        function battleEffectiveSpeed(mon, isPlayer) {
            if (!mon) return 0;
            let speed = mon.speed * getStageMultiplier(mon.stages.speed);
            if (mon.equippedItemId === 'wing_kakera') speed *= 1.5;
            if (mon.name === 'マエザワン' && mon.equippedItemId === 'katsura') speed *= 2;
            if (mon.status === 'mahi') speed *= 0.5;
            if (isPlayer && battleState.field.oikazePlayerTurns > 0) speed *= 2;
            if (!isPlayer && battleState.field.oikazeCpuTurns > 0) speed *= 2;
            return speed;
        }

        function battleChooseCpuAction(cMon, pMon) {
            const alive = battleAliveIndex(battleState.cpuTeam, battleState.cpuIndex);
            const canSwitch = battleCanSwitch(false);
            let validSkills = (cMon.skills || []).filter(s => s.pp > 0 && !(s.name === 'ねこだまし' && !cMon.isFirstTurn));
            if (cMon.chargingSkill) validSkills = [cMon.chargingSkill];
            if (cMon.equippedItemId === 'wing_kakera' && cMon.lockedMoveIndex !== null && !cMon.chargingSkill) validSkills = [cMon.skills[cMon.lockedMoveIndex]].filter(s => s && s.pp > 0);

            if (validSkills.length === 0) return { type: 'skill', index: -1, skill: { name: 'わるあがき', type: 'normal', category: 'physical', power: 50, accuracy: 100, maxPp: 1 } };

            if (canSwitch && cMon.hp / cMon.maxHp <= 0.25) {
                const candidates = battleState.cpuTeam.map((m, i) => ({m, i})).filter(x => x.i !== battleState.cpuIndex && x.m && x.m.hp > 0);
                const switchChance = battleState.mode === 'arcade' && ['t4', 't11'].includes(battleState.arcadeTrainerId) ? 0.7 : 0.45;
                if (candidates.length && Math.random() < switchChance) {
                    const best = candidates.sort((a, b) => {
                        const am = getTypeMultiplier(validSkills[0]?.type || 'normal', a.m.element);
                        const bm = getTypeMultiplier(validSkills[0]?.type || 'normal', b.m.element);
                        return bm - am;
                    })[0];
                    return { type: 'switch', index: best.i };
                }
            }

            // アーケードの各トレーナーは、固有スタイルに応じて技選択の優先順位を変える。
            if (battleState.mode === 'arcade') {
                const choose = list => list.length ? list[Math.floor(Math.random() * list.length)] : null;
                const strongest = list => list.length ? [...list].sort((a, b) => (b.power || 0) - (a.power || 0))[0] : null;
                const attacks = validSkills.filter(s => s.category !== 'status' && (s.power || 0) > 0);
                const statuses = validSkills.filter(s => s.category === 'status');
                const byType = type => attacks.filter(s => s.type === type);
                const pickResult = skill => skill ? { type: 'skill', index: cMon.skills.indexOf(skill), skill } : null;
                let preferred = null;

                switch (battleState.arcadeTrainerId) {
                    case 't1': // サイタマ：物理高火力で押し切る
                        preferred = strongest(attacks.filter(s => s.category === 'physical')) || strongest(attacks);
                        break;
                    case 't2': // マンシー：相手が未状態なら状態異常・能力低下を優先
                        preferred = pMon.status ? null : choose(statuses.filter(s => ['あくび','おにび','どくどく','でんじは','ねむりごな','どくのいと','くしゃみ','うそなき','いやなおと'].includes(s.name)));
                        if (!preferred) preferred = strongest(attacks.filter(s => ['フェイタルクロー','たたりめ','ベノムショック','あくのはどう'].includes(s.name))) || strongest(attacks);
                        break;
                    case 't3': // ダレノガレ：先制技と高速高火力
                        preferred = choose(validSkills.filter(s => ['ねこだまし','はやてがえし','しんそく','アクアジェット','しんくうは','マッハパンチ'].includes(s.name)));
                        if (!preferred) preferred = strongest(attacks);
                        break;
                    case 't4': // ナカモト：回復・防御・場づくり
                        preferred = cMon.hp / cMon.maxHp < 0.55 ? choose(statuses.filter(s => ['じこさいせい','はねやすめ','まもる','てっぺき','ビルドアップ'].includes(s.name))) : null;
                        if (!preferred && !battleState.field.stealthCutPlayer) preferred = statuses.find(s => s.name === 'ステルスカット');
                        if (!preferred) preferred = choose(statuses.filter(s => ['てっぺき','ビルドアップ','まもる'].includes(s.name))) || strongest(attacks);
                        break;
                    case 't5': // フクザワ：弱点を突くバランス型
                        preferred = strongest(attacks.filter(s => getTypeMultiplier(s.type, pMon.element) > 1)) || strongest(attacks);
                        break;
                    case 't6': // マツシタ：電気技・まひでテンポを取る
                        preferred = !pMon.status && !pMon.element.includes('jimen') ? statuses.find(s => s.name === 'でんじは') : null;
                        if (!preferred) preferred = strongest(byType('denki')) || strongest(attacks);
                        break;
                    case 't7': // ショウミ：水技中心、必要なら追い風
                        preferred = strongest(byType('mizu'));
                        if (!preferred && !battleState.field.oikazeCpuTurns) preferred = statuses.find(s => s.name === 'おいかぜ');
                        if (!preferred) preferred = strongest(attacks);
                        break;
                    case 't8': // ウオダ：一撃必殺・超高威力
                        preferred = choose(validSkills.filter(s => ['じわれ','ダンクシュート'].includes(s.name)));
                        if (!preferred) preferred = strongest(attacks.filter(s => (s.power || 0) >= 110)) || strongest(attacks);
                        break;
                    case 't9': { // アンデイ：相手が先に動きそうならカウンター、他は格闘技
                        const counter = validSkills.find(s => s.name === 'カウンター');
                        const playerPriority = pMon.skills.some(s => s.pp > 0 && ['ねこだまし','はやてがえし','しんそく','アクアジェット','しんくうは','マッハパンチ'].includes(s.name));
                        const playerLikelyFirst = playerPriority || battleEffectiveSpeed(pMon, true) > battleEffectiveSpeed(cMon, false);
                        preferred = counter && playerLikelyFirst && Math.random() < 0.75 ? counter : null;
                        if (!preferred) preferred = strongest(byType('kakuto')) || choose(statuses.filter(s => ['ビルドアップ','くしゃみ'].includes(s.name))) || strongest(attacks);
                        break;
                    }
                    case 't10': // イニシヤル：先制技と追い風で攻め続ける
                        preferred = choose(validSkills.filter(s => ['しんそく','ねこだまし','はやてがえし','アクアジェット','しんくうは','マッハパンチ'].includes(s.name)));
                        if (!preferred && !battleState.field.oikazeCpuTurns) preferred = statuses.find(s => s.name === 'おいかぜ');
                        if (!preferred) preferred = strongest(attacks);
                        break;
                    case 't11': { // カツヤマ：回復・防御・カウンターで粘る
                        const counter = validSkills.find(s => s.name === 'カウンター');
                        const playerLikelyFirst = pMon.skills.some(s => s.pp > 0 && ['ねこだまし','はやてがえし','しんそく','アクアジェット','しんくうは','マッハパンチ'].includes(s.name)) || battleEffectiveSpeed(pMon, true) > battleEffectiveSpeed(cMon, false);
                        preferred = counter && playerLikelyFirst && Math.random() < 0.65 ? counter : null;
                        if (!preferred && cMon.hp / cMon.maxHp < 0.6) preferred = choose(statuses.filter(s => ['じこさいせい','はねやすめ','まもる','てっぺき'].includes(s.name)));
                        if (!preferred) preferred = choose(statuses.filter(s => ['まもる','てっぺき','ビルドアップ'].includes(s.name))) || strongest(attacks);
                        break;
                    }
                    case 't12': // タマキ：状態異常を入れてから倍化技で畳みかける
                        preferred = !pMon.status ? choose(statuses.filter(s => ['おにび','どくどく','でんじは','あくび','ねむりごな','どくのいと'].includes(s.name))) : null;
                        if (!preferred) preferred = strongest(attacks.filter(s => ['たたりめ','ベノムショック','ダメおし','フェイタルクロー'].includes(s.name))) || strongest(attacks);
                        break;
                }
                const chosenArcadeSkill = pickResult(preferred);
                if (chosenArcadeSkill) return chosenArcadeSkill;
            }

            for (const skill of validSkills) {
                if (skill.category !== 'status' && skill.power > 0 && getTypeMultiplier(skill.type, pMon.element) > 1) {
                    return { type: 'skill', index: cMon.skills.indexOf(skill), skill };
                }
            }
            const hpRatio = cMon.hp / cMon.maxHp;
            if (hpRatio < 0.3) {
                const heal = validSkills.find(s => ['じこさいせい', 'はねやすめ'].includes(s.name));
                if (heal) return { type: 'skill', index: cMon.skills.indexOf(heal), skill: heal };
            }
            const high = validSkills.filter(s => s.category !== 'status' && s.power >= 80);
            const chosen = high.length ? high[Math.floor(Math.random() * high.length)] : validSkills[Math.floor(Math.random() * validSkills.length)];
            return { type: 'skill', index: cMon.skills.indexOf(chosen), skill: chosen };
        }

        function battleFinishCpuAction(action, callback) {
            if (!battleState || battleState.turnPhase === 'gameover') return callback && callback();
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const pMon = battleState.playerTeam[battleState.playerIndex];
            if (!cMon || cMon.hp <= 0 || !pMon || pMon.hp <= 0) return callback && callback();

            if (action.type === 'switch') {
                const switchBattle = battleState;
                battleSwitchInternal(false, action.index, false);
                setTimeout(() => { if (!battleIsStale(switchBattle)) callback && callback(); }, 500);
                return;
            }
            let skill = action.skill || cMon.skills[action.index];
            if (!skill) return callback && callback();
            if (!cMon.chargingSkill && typeof skill.pp === 'number' && skill.pp > 0) skill.pp--;
            runAction(cMon, pMon, skill, false, null, () => callback && callback());
        }

        function battleFinishTurn() {
            if (!battleState || battleState.turnPhase === 'gameover') return;
            const turnBattle = battleState;
            const result = battleResolveFaints();
            if (result.ended) return;
            processTurnEndEffects(() => {
                if (battleIsStale(turnBattle)) return;
                const after = battleResolveFaints();
                if (after.ended) return;
                battleClearTurnFlags();
                const p = battleState.playerTeam[battleState.playerIndex];
                const c = battleState.cpuTeam[battleState.cpuIndex];
                if (p) p.isFirstTurn = false;
                if (c) c.isFirstTurn = false;
                battleState.turnPhase = 'menu';
                battleState.actionLock = false;
                renderBattleScreen();
            });
        }

        function executeSwitch(newIdx) {
            if (!battleState || battleState.turnPhase !== 'menu' || battleState.actionLock) return;
            newIdx = Number(newIdx);
            const pMon = battleState.playerTeam[battleState.playerIndex];
            if (!pMon || !battleState.playerTeam[newIdx] || battleState.playerTeam[newIdx].hp <= 0 || newIdx === battleState.playerIndex) return;
            if (!battleCanSwitch(true)) return;
            battleState.turnPhase = 'processing';
            battleState.actionLock = true;
            closeModal();
            const turnBattle = battleState;
            if (!battleSwitchInternal(true, newIdx, false)) {
                if (battleState.playerIndex === newIdx) {
                    // 交代は成立したが、ステルスカット等で出た直後に倒れた場合。相手は行動せず、倒れた処理からターン終了へ進める。
                    battleFinishTurn();
                    return;
                }
                battleState.actionLock = false;
                battleState.turnPhase = 'menu';
                renderBattleScreen();
                return;
            }
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const cpuAction = battleChooseCpuAction(cMon, battleState.playerTeam[battleState.playerIndex]);
            setTimeout(() => {
                if (battleIsStale(turnBattle)) return;
                battleFinishCpuAction(cpuAction, () => {
                    battleFinishTurn();
                });
            }, 450);
        }

        function executePlayerTurn(skillIdx) {
            if (!battleState || battleState.turnPhase === 'processing' || battleState.turnPhase === 'gameover' || battleState.actionLock) return;
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            if (!pMon || pMon.hp <= 0 || !cMon || cMon.hp <= 0) {
                battleResolveFaints();
                return;
            }

            // 使える技が1つも無いときだけ「わるあがき」(skillIdx = -1) を選べる
            const isStruggle = Number(skillIdx) === -1 && battleHasNoUsableSkill(pMon);
            let skill = isStruggle ? battleStruggleSkill() : (pMon.chargingSkill || pMon.skills[Number(skillIdx)]);
            if (!skill) return;
            if (!isStruggle && !pMon.chargingSkill && skill.pp <= 0) {
                showModal('CP切れ', 'この技のCPが切れています！', '⚠️', closeModal);
                return;
            }

            const turnBattle = battleState;
            battleState.turnPhase = 'processing';
            battleState.actionLock = true;
            if (pMon.equippedItemId === 'wing_kakera' && !isStruggle) pMon.lockedMoveIndex = Number(skillIdx);
            if (!isStruggle && !pMon.chargingSkill) skill.pp--;

            const cpuAction = battleChooseCpuAction(cMon, pMon);
            const cpuSkill = cpuAction.type === 'skill' ? cpuAction.skill : null;
            let pPriority = battleActionPriority(pMon, skill);
            let cPriority = cpuAction.type === 'switch' ? 6 : battleActionPriority(cMon, cpuSkill);
            const pSpeed = battleEffectiveSpeed(pMon, true);
            const cSpeed = battleEffectiveSpeed(cMon, false);
            const freestyle = isAbilitySuppressor(pMon) || isAbilitySuppressor(cMon);

            if (!freestyle) {
                // 安心感は相手の先制技だけを無効化し、交代の優先度には干渉しない。
                if (pMon.ability?.name === '安心感' && cpuAction.type === 'skill' && cPriority > 0) cPriority = 0;
                if (cMon.ability?.name === '安心感' && pPriority > 0) pPriority = 0;
            }

            let playerFirst = pPriority > cPriority || (pPriority === cPriority && pSpeed >= cSpeed);
            if (pPriority === cPriority) {
                if (pMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = true;
                    battleState.log.push(`[装備発動: ${pMon.name}のDOPE] 先制行動！`);
                } else if (cMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = false;
                    battleState.log.push(`[装備発動: ${cMon.name}のDOPE] 先制行動！`);
                }
            }
            if (!freestyle) {
                if (pMon.ability?.name === '最風' && Math.random() < 0.2) {
                    playerFirst = true;
                    battleState.log.push(`[特性発動: ${pMon.name}の最風] 20%の確率で先制する！`);
                }
                if (cMon.ability?.name === '最風' && Math.random() < 0.2) {
                    playerFirst = false;
                    battleState.log.push(`[特性発動: ${cMon.name}の最風] 20%の確率で先制する！`);
                }
            }

            const firstIsPlayer = playerFirst;
            if (skill.name === 'くちばしキャノン') pMon.isBeakCannonCharging = true;
            if (cpuSkill?.name === 'くちばしキャノン') cMon.isBeakCannonCharging = true;
            const firstAction = firstIsPlayer ? {type:'skill', skill, index:Number(skillIdx)} : cpuAction;
            const secondAction = firstIsPlayer ? cpuAction : {type:'skill', skill, index:Number(skillIdx)};

            const perform = (action, isPlayer, opponentAction, done) => {
                if (battleIsStale(turnBattle)) return;
                const actor = isPlayer ? battleState.playerTeam[battleState.playerIndex] : battleState.cpuTeam[battleState.cpuIndex];
                const target = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
                if (!actor || actor.hp <= 0 || !target || target.hp <= 0) return done && done();
                if (action.type === 'switch') {
                    battleSwitchInternal(isPlayer, action.index, false);
                    setTimeout(() => { if (!battleIsStale(turnBattle)) done && done(); }, 450);
                    return;
                }
                // CPU側のCP消費(プレイヤー側は技選択時に消費済み)。溜め中の技・わるあがきは消費しない。
                if (!isPlayer && !actor.chargingSkill && typeof action.skill.pp === 'number' && action.skill.pp > 0) action.skill.pp--;
                runAction(actor, target, action.skill, isPlayer, opponentAction?.skill || null, () => { if (!battleIsStale(turnBattle)) done && done(); });
            };

            perform(firstAction, firstIsPlayer, secondAction, () => {
                if (battleIsStale(turnBattle)) return;
                const faint = battleResolveFaints();
                if (faint.ended) return;
                if (faint.faintOccurred) {
                    battleFinishTurn();
                    return;
                }
                if (faint.playerAlive && faint.cpuAlive) {
                    setTimeout(() => {
                        if (battleIsStale(turnBattle)) return;
                        perform(secondAction, !firstIsPlayer, firstAction, () => {
                            battleFinishTurn();
                        });
                    }, 350);
                } else {
                    battleFinishTurn();
                }
            });
        }

        function checkBattleEnd() {
            if (!battleState || battleState.turnPhase === 'gameover') return true;
            return battleResolveFaints().ended;
        }

        // Online: keep the relay/client-authoritative architecture, but use the
        // same deterministic faint/turn-finalization path so a KO or switch can
        // never leave the local client locked in "processing".
        function finishOnlineTurn(resolvedTurn) {
            if (!battleState || battleState.mode !== 'online') return;
            const result = battleResolveFaints();
            onlineState.turn = Number(resolvedTurn) + 1;
            onlineState.turnSubmitted = false;

            if (result.ended) {
                battleState.turnPhase = 'gameover';
                stopBattleBGM();
                const playerAlive = result.playerAlive;
                const opponentAlive = result.cpuAlive;
                if (!playerAlive && !opponentAlive) {
                    showModal('引き分け', '両チームが全滅しました。', '🤝', () => { closeModal(); renderOnlineMenu(); });
                } else if (!playerAlive) {
                    showModal('ONLINE 敗北… 💦', 'チームが全滅しました。', '☠️', () => { closeModal(); renderOnlineMenu(); });
                } else {
                    showModal('ONLINE 勝利！ 🎉', '相手チームが全滅しました！', '🏆', () => { closeModal(); renderOnlineMenu(); });
                }
                return;
            }

            processTurnEndEffects(() => {
                if (!battleState || battleState.mode !== 'online' || battleState.turnPhase === 'gameover') return;
                const after = battleResolveFaints();
                if (after.ended) {
                    battleState.turnPhase = 'gameover';
                    return;
                }
                battleClearTurnFlags();
                const p = battleState.playerTeam[battleState.playerIndex];
                const c = battleState.cpuTeam[battleState.cpuIndex];
                if (p) p.isFirstTurn = false;
                if (c) c.isFirstTurn = false;
                battleState.turnPhase = 'menu';
                onlineState.resolvingTurn = false;
                renderBattleScreen();
            });
        }

            if (gameState.coins < bet) { showModal('コイン不足', `BET ${bet}G に対して所持コインが足りません。`, '⚠️', closeModal); return; }
            // 80%：予想したポケモンが2位以下になるレース結果になるまで再抽選 / 20%：通常のダービー
            const rigged = Math.random() < DERBY_RIG_RATE;
            let sim = derbySimulate(derbyState.racers);
            if (rigged) {
                for (let t = 0; t < 300 && sim.order[0] === idx; t++) sim = derbySimulate(derbyState.racers);
            }
            const rank = sim.order.indexOf(idx);               // 0=1位
            const mult = DERBY_PAYOUT_RATES[rank] ?? 0;
            const payout = Math.floor(bet * mult);
            // 結果は確定済みなので、演出の途中で画面を離れても精算が失われないよう先に保存する
            gameState.coins = gameState.coins - bet + payout;
            saveGame();
            derbyState.pick = idx; derbyState.sim = sim; derbyState.frame = 0;
            derbyState.result = { rank, mult, payout, bet };
            derbyState.phase = 'race';
            playSound('click');
            renderDerbyView();
            derbyState.timer = setTimeout(derbyStep, 900);
        }
        function derbyStep(){
            const st = derbyState;
            if (!st || st.phase !== 'race') return;
            st.frame++;
            const f = st.sim.frames[st.frame - 1];
            if (f.ev.some(e => e === 'boost')) playSound('buff'); else if (f.ev.some(e => e === 'fall')) playSound('hit');
            renderDerbyView();
            if (st.frame >= st.sim.frames.length) { st.timer = setTimeout(derbyFinish, 700); return; }
            st.timer = setTimeout(derbyStep, 520);
        }
        function derbySkip(){
            const st = derbyState;
            if (!st || st.phase !== 'race') return;
            derbyStopTimer();
            st.frame = st.sim.frames.length;
            derbyFinish();
        }
        function derbyFinish(){
            const st = derbyState;
            if (!st || st.phase !== 'race') return;
            derbyStopTimer();
            st.phase = 'result';
            updateHeader();
            renderDerbyView();
            const r = st.result;
            if (r.rank === 0) dopaFx(r.payout >= 10000 ? 'jackpot' : 'win', '1位的中！');
            else if (r.rank === 1) dopaFx('win', '2位… 半額払い戻し');
            else dopaFx('lose', '');
        }
        function derbyRankLabel(n){ return ['🥇 1位', '🥈 2位', '🥉 3位'][n] || (n + 1) + '位'; }

        function derbyLanesHtml(){
            const st = derbyState;
            const frame = st.frame > 0 ? st.sim.frames[st.frame - 1] : null;
            const finishedOrder = [];
            if (st.sim) st.sim.frames.slice(0, st.frame).forEach(fr => fr.arrivals.forEach(i => finishedOrder.push(i)));
            return st.racers.map((r, idx) => {
                const mon = derbyMon(r);
                const pos = frame ? frame.pos[idx] : 0;
                const ev = frame ? frame.ev[idx] : null;
                const finishedRank = finishedOrder.indexOf(idx);
                let cells = '';
                for (let n = 0; n <= r.goal; n++) {
                    const isHere = n === pos;
                    const label = n === 0 ? 'S' : (n === r.goal ? '🏁' : '');
                    cells += `<div class="flex-1 min-w-0 h-11 sm:h-12 border border-gray-700/70 ${n === r.goal ? 'bg-yellow-900/40' : 'bg-gray-900/70'} flex items-center justify-center text-[10px] text-gray-500 relative">${isHere ? `<div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg overflow-hidden border-2 ${st.pick === idx ? 'border-yellow-300' : 'border-white/60'} bg-black" style="transition:all .3s">${mon.imageUrl ? `<img src="${mon.imageUrl}" alt="${mon.name}" class="w-full h-full object-cover">` : mon.name}</div>` : label}</div>`;
                }
                let note = '';
                if (finishedRank >= 0) note = `<span class="text-yellow-300 font-black">ゴール！ ${finishedRank + 1}位</span>`;
                else if (ev === 'fall') note = '<span class="text-red-300 font-bold">転倒！一回休み</span>';
                else if (ev === 'boost') note = '<span class="text-cyan-300 font-bold">加速！1マス飛ばし</span>';
                else if (ev === 'move') note = '<span class="text-gray-400">前進</span>';
                return `<div class="rounded-xl bg-black/40 border ${st.pick === idx ? 'border-yellow-400/70' : 'border-gray-700'} p-2">
                    <div class="flex items-center justify-between text-xs mb-1"><b class="text-white">${st.pick === idx ? '⭐ ' : ''}${mon.name}</b><span>${pos}/${r.goal}マス ${note}</span></div>
                    <div class="flex">${cells}</div></div>`;
            }).join('');
        }

        function renderDerbyView(){
            const st = derbyState; if (!st) return;
            const c = document.getElementById('app-container');
            const head = `<h2 class="text-3xl sm:text-4xl font-black text-emerald-300 mb-1">🏇 ディディダービー</h2><p class="text-yellow-100 mb-4">所持コイン：<b>${gameState.coins} G</b>${st.phase === 'race' ? '' : ''}</p>`;
            let body = '';
            if (st.phase === 'bet') {
                body = `<p class="text-sm text-gray-300 mb-3">BETを選ぶと、10体の中から3体がランダムで出走。<b class="text-yellow-200">1位になるポケモン</b>を予想しよう！</p>
                    <div class="grid grid-cols-4 gap-2 mb-4">${DERBY_BETS.map(n => `<button onclick="derbySetBet(${n})" class="py-3 rounded-xl font-black border ${st.bet === n ? 'bg-yellow-500 text-gray-900 border-yellow-300' : 'bg-gray-800 text-gray-200 border-gray-600'}">${n}G</button>`).join('')}</div>
                    <div class="rounded-xl bg-black/40 border border-gray-700 p-3 text-xs text-gray-300 text-left mb-4">
                        <div class="font-bold text-emerald-200 mb-1">還元率（予想したポケモンの順位）</div>
                        <div>🥇 1位：<b class="text-yellow-300">3倍</b>　🥈 2位：<b class="text-yellow-300">0.3倍</b>　🥉 3位：<b class="text-yellow-300">0倍</b></div>
                        <div class="mt-2 text-gray-400">全員が同時に1ターン1マスずつ進み、転倒すると一回休み、加速すると1マス飛ばしで進みます。</div>
                    </div>
                    <div class="rounded-xl bg-black/40 border border-gray-700 p-3 mb-4"><div class="font-bold text-sm text-emerald-200 mb-2 text-left">出走候補（10体）</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs">${DERBY_RACERS.map(r => `<div class="flex items-center justify-between bg-gray-900/70 rounded-lg px-2 py-1"><b class="text-white">${derbyMon(r).name}</b><span class="text-gray-300">${r.goal}マス／転倒${r.fall}%／加速${r.accel}%</span></div>`).join('')}</div></div>
                    <button onclick="derbyDraw()" class="w-full bg-gradient-to-r from-emerald-600 to-green-500 text-white font-black py-4 rounded-2xl text-lg">出走ポケモンを決める（BET ${st.bet}G）</button>
                    <button onclick="derbyBack()" class="mt-4 bg-gray-800 px-8 py-3 rounded-xl">カジノに戻る</button>`;
            } else if (st.phase === 'pick') {
                body = `<p class="text-sm text-gray-200 mb-3">出走ポケモンが決まった！ <b class="text-yellow-200">1位になる</b>と思うポケモンを選ぼう（BET ${st.bet}G）</p>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">${st.racers.map((r, idx) => `<button onclick="derbyPick(${idx})" class="rounded-2xl bg-gray-900/80 border border-emerald-500/50 hover:border-yellow-300 p-4 flex flex-col items-center gap-2">
                        ${renderMonsterImage(derbyMon(r), 'w-24 h-24')}<b class="text-lg text-white">${derbyMon(r).name}</b>
                        <div class="text-xs text-gray-300">ゴール ${r.goal}マス<br>転倒率 ${r.fall}%／加速率 ${r.accel}%</div>
                        <span class="mt-1 bg-yellow-500 text-gray-900 font-black px-4 py-1 rounded-full text-sm">1位を予想</span></button>`).join('')}</div>
                    <button onclick="renderDerby()" class="bg-gray-800 px-8 py-3 rounded-xl">やめる（BETは消費されません）</button>`;
            } else {
                const r = st.result;
                const over = st.phase === 'result';
                const pickedName = derbyMon(st.racers[st.pick]).name;
                body = `<p class="text-sm text-gray-300 mb-3">予想：<b class="text-yellow-200">${pickedName}</b>が1位　／　BET ${r.bet}G　<span class="text-gray-400">ターン ${Math.max(st.frame, 0)}</span></p>
                    <div class="space-y-2 mb-4 text-left">${derbyLanesHtml()}</div>`;
                if (!over) {
                    body += `<button onclick="derbySkip()" class="bg-gray-800 border border-gray-600 px-8 py-3 rounded-xl font-bold">結果までスキップ</button>`;
                } else {
                    const order = st.sim.order;
                    body += `<div class="rounded-2xl bg-black/50 border border-yellow-500/40 p-4 mb-4">
                        <div class="text-lg font-black text-yellow-200 mb-2">🏁 レース結果</div>
                        <div class="space-y-1 text-sm">${order.map((ri, n) => `<div class="flex items-center justify-between ${ri === st.pick ? 'text-yellow-300 font-black' : 'text-gray-200'}"><span>${derbyRankLabel(n)}</span><span>${derbyMon(st.racers[ri]).name}${ri === st.pick ? '（予想）' : ''}</span></div>`).join('')}</div>
                        <div class="mt-3 text-base font-black ${r.rank === 0 ? 'text-yellow-300' : (r.rank === 1 ? 'text-orange-300' : 'text-gray-400')}">${r.rank === 0 ? `1位的中！ ${r.mult}倍 → ${r.payout}G獲得！` : (r.rank === 1 ? `2位… 還元 ${r.mult}倍 → ${r.payout}G戻り` : '3位… ハズレ（還元0倍）')}</div></div>
                        <div class="grid grid-cols-2 gap-3"><button onclick="renderDerby()" class="bg-gradient-to-r from-emerald-600 to-green-500 text-white font-black py-3 rounded-2xl">もう一度</button><button onclick="derbyBack()" class="bg-gray-800 border border-gray-600 py-3 rounded-2xl font-bold">カジノに戻る</button></div>`;
                }
            }
            c.innerHTML = `<div class="w-full max-w-3xl px-4"><div class="glass-card rounded-3xl p-5 sm:p-8 border border-emerald-500/40 text-center">${head}${body}</div></div>`;
        }

        function renderKojiJudge(){
            window.kojiJudgePlayed = false;
            gameState.currentView='casino-koji';const c=document.getElementById('app-container');
            c.innerHTML=`<div class="w-full max-w-xl px-4"><div class="glass-card rounded-3xl p-6 text-center border border-blue-500/40"><h2 class="text-3xl font-black text-blue-200">コジジャッチ</h2><p class="my-3">BET：100 G　所持：${gameState.coins} G</p><img src="kjur.png" class="w-40 h-40 object-contain mx-auto my-5" alt="裏面カード"><p class="mb-4">表面を予想しよう！</p><div class="grid grid-cols-2 gap-4"><button onclick="playKojiJudge(true)" class="bg-blue-800 rounded-xl p-4"><img src="kjkj.png" class="w-24 h-24 object-contain mx-auto" alt="コジマスキュラー"><b>コジマスキュラー</b></button><button onclick="playKojiJudge(false)" class="bg-gray-800 rounded-xl p-4"><img src="kjom.png" class="w-24 h-24 object-contain mx-auto" alt="無地"><b>無地のカード</b></button></div><p id="koji-result" class="mt-5 font-bold text-yellow-200"></p><button onclick="renderCasino()" class="mt-4 bg-gray-800 px-6 py-2 rounded-xl">戻る</button></div></div>`;
        }
        function playKojiJudge(pick){
            if (window.kojiJudgePlayed) return;
            if(gameState.coins<100){document.getElementById('koji-result').textContent='コインが足りません';return;}
            window.kojiJudgePlayed = true;
            gameState.coins-=100;
            const actual=Math.random()<0.5;
            const won=pick===actual;
            const payout=won?200:0;
            gameState.coins+=payout;
            saveGame();
            document.querySelectorAll('[onclick^="playKojiJudge"]').forEach(b=>{b.disabled=true;b.classList.add('opacity-40','cursor-not-allowed');});
            document.getElementById('koji-result').innerHTML=`<img src="${actual?'kjkj.png':'kjom.png'}" class="w-28 h-28 object-contain mx-auto"><div>${actual?'コジマスキュラー！':'無地のカード！'} ${won?'的中！ '+payout+'G獲得':'ハズレ！'}</div>`;
            dopaFx(won?'win':'lose', won?'的中！':'');
        }
        function renderVipEntrance(){
            gameState.currentView = 'casino-vip-entrance';
            const c = document.getElementById('app-container');
            const teamCount = (gameState.team || []).length;
            c.innerHTML = `<div class="w-full max-w-2xl px-4"><div class="glass-card rounded-3xl p-8 sm:p-10 border-2 border-yellow-400/70 bg-gradient-to-b from-gray-950 via-amber-950/60 to-black text-center shadow-2xl">
                <div class="text-sm font-black tracking-[0.35em] text-yellow-200 mb-2">VIP ROOM</div>
                <div class="text-6xl mb-3">👑</div>
                <h2 class="text-3xl sm:text-4xl font-black text-yellow-200 mb-4">VIPルームに入りますか？</h2>
                <div class="rounded-2xl bg-black/50 border border-yellow-500/40 p-5 text-left text-sm text-amber-100 space-y-2">
                    <div>💰 入室料：<b class="text-yellow-300">1500 G</b>（所持：${gameState.coins} G）</div>
                    <div>⚔️ カジノ限定ポケモン3体（ミルデュー・シゴ・ツミ）と対戦</div>
                    <div>🎁 勝利すると<b class="text-yellow-300">15%</b>の確率で3体のうちどれかを獲得（重複取得可）</div>
                    <div class="text-xs text-gray-400">※入室すると入室料は戻りません。現在の編成：${teamCount}体</div>
                </div>
                <div class="grid grid-cols-2 gap-3 mt-6">
                    <button onclick="playSound('click');startVipRoom()" class="rounded-2xl bg-gradient-to-r from-yellow-600 to-amber-500 py-4 font-black text-gray-950">入室する</button>
                    <button onclick="playSound('click');renderCasino()" class="rounded-2xl bg-gray-800 border border-gray-600 py-4 font-bold text-gray-200">やめておく</button>
                </div>
            </div></div>`;
        }

        function startVipRoom(){
            if(gameState.coins<1500){showModal('コイン不足','VIPルームには1500G必要です。','⚠️',closeModal);return;}
            if(!gameState.team?.length){showModal('編成不足','先にモンスターを編成してください。','⚠️',closeModal);return;}
            gameState.coins-=1500;saveGame();
            const playerTeam=gameState.team.map(id=>JSON.parse(JSON.stringify(gameState.inventory.find(m=>m.instanceId===id))));
            playerTeam.forEach(m=>{m.hp=m.maxHp;m.status=null;m.statusTurns=0;m.stages={atk:0,def:0,spa:0,spd:0,speed:0};m.isFirstTurn=true;});
            playerTeam.forEach(resetMonsterForBattle);
            const cpuTeam=['mirudew','shigo','tsumi'].map(id=>createMonsterInstance(id));
            battleState={mode:'vip',playerTeam,playerIndex:0,cpuTeam,cpuIndex:0,log:['VIPルーム開幕！カジノ限定3体が立ちはだかる！'],field:{stealthCutPlayer:false,stealthCutCpu:false,akuShuuTurns:0,oikazePlayerTurns:0,oikazeCpuTurns:0},turnPhase:'processing'};
            playBattleBGM();checkBattleStartAbilities();renderBattleScreen();setTimeout(()=>processStartOfBattleTurn(),800);
        }


        function renderVipAcquisitionScreen(monster) {
            gameState.currentView = 'vip-acquired';
            const base = MONSTERS_DB[monster.baseId] || {};
            const c = document.getElementById('app-container');
            c.innerHTML = `
                <div class="w-full max-w-3xl px-4 text-center">
                    <div class="glass-card rounded-3xl border-2 border-yellow-400/70 bg-gradient-to-b from-gray-950 via-amber-950/70 to-black p-8 sm:p-12 shadow-2xl">
                        <div class="text-sm font-black tracking-[0.35em] text-yellow-200 mb-3">VIP ROOM REWARD</div>
                        <div class="text-6xl mb-3">👑</div>
                        <h2 class="text-3xl sm:text-5xl font-black text-yellow-200 mb-3">限定モンスター獲得！</h2>
                        <p class="text-amber-100 mb-6">15%の抽選に当選した！</p>
                        <div class="mx-auto max-w-md rounded-3xl border border-yellow-500/50 bg-black/50 p-7">
                            <div class="mx-auto mb-4 w-40 h-40">${renderMonsterImage(monster, 'w-40 h-40')}</div>
                            <div class="text-3xl font-black text-white">${monster.name}</div>
                            <div class="mt-2 text-sm font-bold text-purple-200">${base.title || 'カジノ限定'}</div>
                            <div class="mt-3 text-sm text-gray-300">特性【${monster.ability.name}】</div>
                            <div class="mt-4 text-xs text-emerald-300">所持モンスター・図鑑に登録済み。重複取得も可能！</div>
                        </div>
                        <button onclick="playSound('click');showMenu()" class="mt-7 rounded-2xl bg-gradient-to-r from-yellow-600 to-amber-500 px-10 py-4 font-black text-gray-950">ロビーへ戻る</button>
                    </div>
                </div>`;
        }

        // レア報酬モンスター(アーケード/ブラック/VIPルームの報酬)は300G、それ以外は100G
        const RARE_REWARD_MONSTER_IDS = ['kamiDeYaiba', 'jahibi', 'mirudew', 'shigo', 'tsumi'];
        function getMonsterSellPrice(baseId){ return RARE_REWARD_MONSTER_IDS.includes(baseId) ? 300 : 100; }
        function sellMonster(instanceId){
            const mon=gameState.inventory.find(m=>m.instanceId===instanceId); if(!mon)return;
            if(gameState.team.includes(instanceId)){showModal('売却できません','編成中のモンスターは先にチームから外してください。','⚠️',closeModal);return;}
            if(gameState.inventory.length<=1){showModal('売却できません','最後の1体は売却できません。','⚠️',closeModal);return;}
            const sellPrice=getMonsterSellPrice(mon.baseId);
            gameState.inventory=gameState.inventory.filter(m=>m.instanceId!==instanceId);gameState.coins+=sellPrice;saveGame();renderParty();
            showModal('売却完了',`${mon.name}を${sellPrice}Gで売却しました。`,'💰',closeModal);
        }
    </script>
</body>
</html>
