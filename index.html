<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ディディットモンスター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.IO Client Library (HTTPS対応) -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Zen Maru Gothic', sans-serif;
            background-color: #060911;
            color: #f3f4f6;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1322;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.15); }
        }
        .animate-card:hover {
            animation: pulseGlow 1.5s infinite;
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes floatEffect {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .floating {
            animation: floatEffect 3s ease-in-out infinite;
        }
        @keyframes gachaFlash {
            0% { transform: scale(0.3); opacity: 0; filter: brightness(3); }
            50% { transform: scale(1.2); opacity: 1; filter: brightness(2); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
        .gacha-anim {
            animation: gachaFlash 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        /* モーションエフェクト */
        @keyframes animHonoo {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(249,115,22,0.5)); }
            50% { transform: scale(1.25) rotate(5deg); filter: drop-shadow(0 0 40px rgba(239,68,68,1)) brightness(1.8); }
            100% { transform: scale(1); }
        }
        .effect-honoo { animation: animHonoo 0.6s ease-in-out; }

        @keyframes animMizu {
            0% { transform: translateY(0); filter: drop-shadow(0 0 5px rgba(59,130,246,0.5)); }
            50% { transform: translateY(-16px) scale(1.15); filter: drop-shadow(0 0 35px rgba(96,165,250,1)) brightness(1.6); }
            100% { transform: translateY(0); }
        }
        .effect-mizu { animation: animMizu 0.6s ease-in-out; }

        @keyframes animKusa {
            0% { transform: rotate(0deg); filter: drop-shadow(0 0 5px rgba(16,185,129,0.5)); }
            25% { transform: rotate(-12deg) scale(1.12); }
            75% { transform: rotate(12deg) scale(1.12); filter: drop-shadow(0 0 35px rgba(52,211,153,1)); }
            100% { transform: rotate(0deg); }
        }
        .effect-kusa { animation: animKusa 0.6s ease-in-out; }

        @keyframes animDenki {
            0%, 100% { filter: brightness(1); transform: scale(1); }
            20% { filter: brightness(3.5) drop-shadow(0 0 35px rgba(250,204,21,1)); transform: scale(1.2); }
            40% { filter: brightness(0.3); transform: scale(0.92); }
            60% { filter: brightness(3.0) drop-shadow(0 0 35px rgba(250,204,21,1)); transform: scale(1.15); }
        }
        .effect-denki { animation: animDenki 0.5s ease-in-out; }

        @keyframes animNormal {
            0% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(2.0) drop-shadow(0 0 30px rgba(255,255,255,0.95)); transform: scale(1.12); }
            100% { filter: brightness(1); }
        }
        .effect-normal { animation: animNormal 0.5s ease-in-out; }

        @keyframes animKakuto {
            0% { transform: translateX(0) scale(1); }
            30% { transform: translateX(-20px) scale(1.25); filter: brightness(1.8) drop-shadow(0 0 35px rgba(239,68,68,1)); }
            100% { transform: translateX(0) scale(1); }
        }
        .effect-kakuto { animation: animKakuto 0.5s ease-in-out; }

        @keyframes animAku {
            0% { filter: brightness(1); }
            50% { filter: brightness(0.2) drop-shadow(0 0 40px rgba(168,85,247,1)); transform: scale(1.1); }
            100% { filter: brightness(1); }
        }
        .effect-aku { animation: animAku 0.6s ease-in-out; }

        @keyframes animDoku {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(130deg) brightness(1.6) drop-shadow(0 0 30px rgba(217,70,239,1)); transform: scale(1.1); }
            100% { filter: hue-rotate(0deg); }
        }
        .effect-doku { animation: animDoku 0.6s ease-in-out; }

        @keyframes animJimen {
            0%, 100% { transform: translateY(0); }
            20% { transform: translateY(12px) rotate(-4deg); filter: drop-shadow(0 0 25px rgba(234,179,8,1)); }
            40% { transform: translateY(-12px) rotate(4deg); }
            60% { transform: translateY(10px) rotate(-3deg); }
            80% { transform: translateY(-6px) rotate(3deg); }
        }
        .effect-jimen { animation: animJimen 0.6s ease-in-out; }

        @keyframes animHikou {
            0% { transform: translateX(-25px) scale(0.9); opacity: 0.7; }
            50% { transform: translateX(25px) scale(1.15); filter: drop-shadow(0 0 30px rgba(56,189,248,1)); opacity: 1; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }
        .effect-hikou { animation: animHikou 0.6s ease-in-out; }

        @keyframes animGhost {
            0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px rgba(147,51,234,0.5)); }
            30% { transform: translateY(-10px) scale(1.2); opacity: 0.3; filter: drop-shadow(0 0 35px rgba(168,85,247,1)) brightness(2); }
            70% { transform: translateY(5px) scale(0.9); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .effect-ghost { animation: animGhost 0.6s ease-in-out; }

        /* UIスタイル */
        .neon-border-player {
            border: 2px solid rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        .neon-border-cpu {
            border: 2px solid rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }
        .log-box-custom {
            background: linear-gradient(180deg, rgba(5, 10, 20, 0.95) 0%, rgba(10, 15, 30, 0.9) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 10px rgba(59, 130, 246, 0.1);
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* 必殺技演出レイヤー：バトル計算・通信状態には一切触れない */
        @keyframes battleScreenShake { 0%,100%{transform:translate3d(0,0,0)} 15%{transform:translate3d(-5px,2px,0)} 30%{transform:translate3d(5px,-2px,0)} 45%{transform:translate3d(-4px,-1px,0)} 60%{transform:translate3d(4px,1px,0)} 75%{transform:translate3d(-2px,0,0)} }
        @keyframes battleVignette { 0%{opacity:0} 22%{opacity:1} 72%{opacity:1} 100%{opacity:0} }
        @keyframes battleBurst { 0%{transform:translate(-50%,-50%) scale(.08) rotate(0);opacity:0} 25%{opacity:1} 100%{transform:translate(-50%,-50%) scale(1.8) rotate(28deg);opacity:0} }
        @keyframes battleTitle { 0%{transform:translate(-50%,-50%) scale(1.8);opacity:0} 18%{transform:translate(-50%,-50%) scale(1);opacity:1} 78%{transform:translate(-50%,-50%) scale(1);opacity:1} 100%{transform:translate(-50%,-50%) scale(.82);opacity:0} }
        @keyframes battleRays { from{transform:translate(-50%,-50%) rotate(0) scale(.25);opacity:0} 20%{opacity:.7} to{transform:translate(-50%,-50%) rotate(35deg) scale(1.5);opacity:0} }
        @keyframes battleDamagePop { 0%{transform:translate(-50%,0) scale(.35);opacity:0} 18%{transform:translate(-50%,-18px) scale(1.2);opacity:1} 100%{transform:translate(-50%,-64px) scale(.9);opacity:0} }
        .battle-shake { animation:battleScreenShake .42s linear; }
        .battle-fx-overlay { position:fixed; inset:0; z-index:80; pointer-events:none; overflow:hidden; }
        .battle-fx-overlay .fx-vignette { position:absolute; inset:0; background:radial-gradient(circle at center, transparent 18%, rgba(0,0,0,.62) 100%); opacity:0; animation:battleVignette 1.05s ease-in-out forwards; }
        .battle-fx-overlay .fx-burst { position:absolute; left:50%; top:50%; width:min(76vw,620px); aspect-ratio:1; border:8px solid var(--fx-color); border-radius:50%; box-shadow:0 0 35px var(--fx-color),inset 0 0 45px var(--fx-color); animation:battleBurst .72s ease-out forwards; will-change:transform,opacity; }
        .battle-fx-overlay .fx-rays { position:absolute; left:50%; top:50%; width:140vw; height:140vw; background:repeating-conic-gradient(from 0deg,transparent 0deg 7deg,var(--fx-color) 7.5deg 8.2deg,transparent 8.8deg 15deg); opacity:0; mask-image:radial-gradient(circle,black 0%,transparent 68%); animation:battleRays .78s ease-out forwards; will-change:transform,opacity; }
        .battle-fx-overlay .fx-title { position:absolute; left:50%; top:43%; width:100%; padding:0 12px; text-align:center; color:#fff; font-size:clamp(25px,7vw,64px); line-height:1.1; font-weight:1000; font-style:italic; letter-spacing:.06em; -webkit-text-stroke:1px rgba(20,10,30,.8); text-shadow:0 4px 0 #381047,0 0 12px var(--fx-color),0 0 34px var(--fx-color); animation:battleTitle 1.05s cubic-bezier(.16,.8,.2,1) forwards; will-change:transform,opacity; }
        .battle-damage-pop { position:fixed; z-index:85; pointer-events:none; font-weight:1000; font-size:clamp(28px,8vw,58px); color:#fff; -webkit-text-stroke:1.5px #7f1d1d; text-shadow:0 3px 0 #7f1d1d,0 0 18px #fb923c,0 0 32px #ef4444; animation:battleDamagePop .95s ease-out forwards; }
        @media (prefers-reduced-motion: reduce) { .battle-shake,.battle-fx-overlay *,.battle-damage-pop { animation-duration:.01ms !important; } }

        /* ===== カジノモード：ゴージャス背景（カジノ画面表示中のみ body.casino-mode が付く） ===== */
        @keyframes casinoShimmer { 0%{background-position:0 0,0 0,0 0,0 0} 100%{background-position:0 0,0 0,60px 60px,0 0} }
        body.casino-mode {
            background-color: #1a0006 !important;
            background-image:
                radial-gradient(ellipse at 50% -10%, rgba(255,215,90,.38) 0%, rgba(255,215,90,0) 55%),
                radial-gradient(ellipse at 50% 120%, rgba(190,20,50,.55) 0%, rgba(190,20,50,0) 60%),
                repeating-linear-gradient(45deg, rgba(255,205,80,.07) 0 2px, transparent 2px 60px),
                linear-gradient(180deg, #2a0410 0%, #12000a 55%, #050003 100%) !important;
        }
        body.casino-mode::before {
            content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
            background:
                repeating-linear-gradient(-45deg, rgba(255,205,80,.07) 0 2px, transparent 2px 60px),
                radial-gradient(circle at 12% 18%, rgba(255,230,140,.9) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 12%, rgba(255,230,140,.8) 0 2px, transparent 3px),
                radial-gradient(circle at 30% 78%, rgba(255,230,140,.7) 0 2px, transparent 3px),
                radial-gradient(circle at 90% 70%, rgba(255,230,140,.85) 0 2px, transparent 3px),
                radial-gradient(circle at 60% 40%, rgba(255,230,140,.6) 0 1.5px, transparent 3px);
        }
        body.casino-mode::after {
            content:''; position:fixed; inset:8px; z-index:-1; pointer-events:none;
            border:3px solid transparent; border-radius:18px;
            border-image: repeating-linear-gradient(90deg,#ffd75e 0 14px,#b8101f 14px 28px) 3;
            box-shadow: 0 0 30px rgba(255,200,80,.35), inset 0 0 60px rgba(255,200,80,.12);
        }
        body.casino-mode .glass-card {
            background: linear-gradient(160deg, rgba(60,8,22,.88) 0%, rgba(20,3,12,.92) 100%);
            border: 2px solid rgba(255,206,90,.75) !important;
            box-shadow: 0 0 28px rgba(255,190,60,.35), inset 0 0 24px rgba(255,190,60,.12), 0 20px 25px -5px rgba(0,0,0,.6);
        }
        body.casino-mode h2 {
            text-shadow: 0 0 10px rgba(255,210,90,.75), 0 2px 0 #5a2a00;
            letter-spacing: .06em;
        }
    
        /* ===== v2: 戦闘前モーション(渦に吸い込まれる) ===== */
        #battle-intro-overlay { position: fixed; inset: 0; z-index: 99999; overflow: hidden; background: #02020c; opacity: 0; animation: biFadeIn 0.25s ease-out forwards; }
        #battle-intro-overlay.bi-out { animation: biFadeOut 0.45s ease-in forwards; pointer-events: none; }
        #battle-intro-overlay .bi-vortex { position: absolute; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; border-radius: 50%; will-change: transform; }
        #battle-intro-overlay .bi-v1 { background: repeating-conic-gradient(from 0deg, #7c3aed 0 14deg, #1e3a8a 14deg 28deg, #06b6d4 28deg 34deg, #312e81 34deg 52deg); animation: biSpin 1.1s linear infinite, biZoom 0.95s ease-in forwards; opacity: 0.9; }
        #battle-intro-overlay .bi-v2 { background: repeating-conic-gradient(from 20deg, transparent 0 20deg, rgba(168,85,247,0.55) 20deg 32deg, transparent 32deg 60deg); animation: biSpinRev 0.8s linear infinite, biZoom 0.95s ease-in forwards; }
        #battle-intro-overlay .bi-core { position: absolute; inset: 0; background: radial-gradient(circle at center, #000 0, #000 7%, rgba(0,0,0,0) 48%, rgba(2,2,12,0.85) 100%); }
        #app-container.bi-suck { transform-origin: center center; animation: biSuck 0.95s cubic-bezier(0.55, 0, 1, 0.45) forwards; }
        @keyframes biSuck { 0% { transform: scale(1) rotate(0deg); opacity: 1; } 100% { transform: scale(0.03) rotate(560deg); opacity: 0; } }
        @keyframes biSpin { to { rotate: 360deg; } }
        @keyframes biSpinRev { to { rotate: -360deg; } }
        @keyframes biZoom { 0% { scale: 0.35; } 100% { scale: 1; } }
        @keyframes biFadeIn { to { opacity: 1; } }
        @keyframes biFadeOut { from { opacity: 1; } to { opacity: 0; } }
        /* ===== v2: イベント「千葉神ビル」戦闘背景 ===== */
        .event-bldg-bg { background-image: linear-gradient(rgba(4,6,20,0.40), rgba(4,6,20,0.55)), url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 800 520%22 preserveAspectRatio=%22xMidYMax slice%22%3E%3Cdefs%3E%3ClinearGradient id=%22sky%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23070b1f%22/%3E%3Cstop offset=%22.55%22 stop-color=%22%232a1b5e%22/%3E%3Cstop offset=%221%22 stop-color=%22%230f766e%22/%3E%3C/linearGradient%3E%3Cpattern id=%22w%22 width=%2216%22 height=%2220%22 patternUnits=%22userSpaceOnUse%22%3E%3Crect x=%224%22 y=%225%22 width=%227%22 height=%229%22 fill=%22%23fde68a%22 opacity=%22.75%22/%3E%3C/pattern%3E%3Cpattern id=%22w2%22 width=%2212%22 height=%2216%22 patternUnits=%22userSpaceOnUse%22%3E%3Crect x=%223%22 y=%224%22 width=%225%22 height=%227%22 fill=%22%2367e8f9%22 opacity=%22.7%22/%3E%3C/pattern%3E%3C/defs%3E%3Crect width=%22800%22 height=%22520%22 fill=%22url(%23sky)%22/%3E%3Ccircle cx=%22640%22 cy=%2290%22 r=%2234%22 fill=%22%23e0f2fe%22 opacity=%22.85%22/%3E%3Crect x=%22-10%22 y=%22128%22 width=%2268%22 height=%22392%22 fill=%22%23111c3a%22/%3E%3Crect x=%22-10%22 y=%22128%22 width=%2268%22 height=%22392%22 fill=%22url(%23w2)%22/%3E%3Crect x=%22-10%22 y=%22128%22 width=%2268%22 height=%223%22 fill=%22%2322d3ee%22 opacity=%22.9%22/%3E%3Crect x=%2223%22 y=%22102%22 width=%222%22 height=%2226%22 fill=%22%2322d3ee%22 opacity=%22.8%22/%3E%3Crect x=%2255%22 y=%22221%22 width=%2271%22 height=%22299%22 fill=%22%230f172a%22/%3E%3Crect x=%2255%22 y=%22221%22 width=%2271%22 height=%22299%22 fill=%22url(%23w)%22/%3E%3Crect x=%2255%22 y=%22221%22 width=%2271%22 height=%223%22 fill=%22%2322d3ee%22 opacity=%22.9%22/%3E%3Crect x=%2289%22 y=%22195%22 width=%222%22 height=%2226%22 fill=%22%2322d3ee%22 opacity=%22.8%22/%3E%3Crect x=%22133%22 y=%22309%22 width=%2252%22 height=%22211%22 fill=%22%230f172a%22/%3E%3Crect x=%22133%22 y=%22309%22 width=%2252%22 height=%22211%22 fill=%22url( Crect x=%22589%22 y=%22268%22 width=%222%22 height=%2226%22 fill=%22%23e879f9%22 opacity=%22.8%22/%3E%3Crect x=%22629%22 y=%22244%22 width=%2281%22 height=%22276%22 fill=%22%23172554%22/%3E%3Crect x=%22629%22 y=%22244%22 width=%2281%22 height=%22276%22 fill=%22url(%23w2)%22/%3E%3Crect x=%22629%22 y=%22244%22 width=%2281%22 height=%223%22 fill=%22%23f472b6%22 opacity=%22.9%22/%3E%3Crect x=%22706%22 y=%22239%22 width=%2255%22 height=%22281%22 fill=%22%231e1b4b%22/%3E%3Crect x=%22706%22 y=%22239%22 width=%2255%22 height=%22281%22 fill=%22url(%23w)%22/%3E%3Crect x=%22706%22 y=%22239%22 width=%2255%22 height=%223%22 fill=%22%23f472b6%22 opacity=%22.9%22/%3E%3Crect x=%22732%22 y=%22213%22 width=%222%22 height=%2226%22 fill=%22%23f472b6%22 opacity=%22.8%22/%3E%3Crect x=%22770%22 y=%22360%22 width=%2274%22 height=%22160%22 fill=%22%230f172a%22/%3E%3Crect x=%22770%22 y=%22360%22 width=%2274%22 height=%22160%22 fill=%22url(%23w2)%22/%3E%3Crect x=%22770%22 y=%22360%22 width=%2274%22 height=%223%22 fill=%22%23f472b6%22 opacity=%22.9%22/%3E%3C/svg%3E"); background-size: cover; background-position: center bottom; }

        /* ===== v8: CYBER NEON UI (ストリートファイター6風ネオン／サイバー) ===== */
        :root { --cy-cyan:0,240,255; --cy-pink:255,43,214; --cy-purple:155,92,255; --cy-blue:47,107,255; --cy-amber:255,196,60; --cy-green:0,255,160; --cy-red:255,70,90; }
        body {
            background-color:#05030f !important;
            background-image:
                radial-gradient(ellipse at 12% 0%, rgba(155,92,255,.38), transparent 55%),
                radial-gradient(ellipse at 92% 8%, rgba(0,240,255,.22), transparent 50%),
                radial-gradient(ellipse at 50% 112%, rgba(255,43,214,.30), transparent 55%),
                linear-gradient(180deg,#07041a 0%,#030211 100%) !important;

    <script>
        // ==========================================
        // --- 1. BGM & SOUND Synthesizer ---
        // ==========================================
        const bgmAudio = new Audio('戦闘.mp3');
        bgmAudio.loop = true;
        const blackBattleBgmAudio = new Audio('ブラック戦闘.mp3');
        blackBattleBgmAudio.loop = true;
        const vipBattleBgmAudio = new Audio('VIP戦闘.mp3');
        vipBattleBgmAudio.loop = true;
        const eventBattleBgmAudio = new Audio('千葉神戦闘.mp3');
        eventBattleBgmAudio.loop = true;
        let activeBgmAudio = bgmAudio;

        function playBattleBGM() {
            stopBattleBGM();
            activeBgmAudio = battleState && battleState.mode === 'black' ? blackBattleBgmAudio : (battleState && battleState.mode === 'vip' ? vipBattleBgmAudio : (battleState && battleState.mode === 'event' ? eventBattleBgmAudio : bgmAudio));
            activeBgmAudio.currentTime = 0;
            activeBgmAudio.play().catch(e => console.log("BGM自動再生ブロック:", e));
        }

        function stopBattleBGM() {
            [bgmAudio, blackBattleBgmAudio, vipBattleBgmAudio, eventBattleBgmAudio].forEach(audio => { audio.pause(); audio.currentTime = 0; });
            activeBgmAudio = bgmAudio; // 次の戦闘では必ずモードに合わせて選び直す(千葉神戦闘BGMを持ち越さない)
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'honoo') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'mizu') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'denki') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'kusa') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'ghost') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'buff') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(500, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'faint') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'victory') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.15);
                osc.frequency.setValueAtTime(659.25, now + 0.3);
                osc.frequency.setValueAtTime(880, now + 0.45);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        // ==========================================
        // --- 2. CANVAS PARTICLE ENGINE ---
        // ==========================================
        // オンライン対戦の同期乱数(Math.random差し替え)に演出用乱数を混ぜない。
        const visualRandom = Math.random.bind(Math);
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                
                const angle = visualRandom() * Math.PI * 2;
                const speed = 2 + visualRandom() * 8;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                if (type === 'honoo') {
                    this.vx *= 0.5;
                    this.vy = -(2 + visualRandom() * 5);
                    this.color = ['#ff4500', '#ff8c00', '#ffa500', '#ffff00'][Math.floor(visualRandom() * 4)];
                } else if (type === 'mizu') {
                    this.color = ['#00bfff', '#1e90ff', '#4169e1', '#00ffff'][Math.floor(visualRandom() * 4)];
                    this.vy += 1.5;
                } else if (type === 'kusa') {
                    this.color = ['#00ff7f', '#32cd32', '#228b22', '#adff2f'][Math.floor(visualRandom() * 4)];
                } else if (type === 'denki') {
                    this.color = ['#ffd700', '#ffff00', '#fffacd', '#ffffe0'][Math.floor(visualRandom() * 4)];
                    this.vx *= 1.8;
                    this.vy *= 1.8;
                } else if (type === 'ghost') {
                    this.color = ['#a855f7', '#c084fc', '#e879f9', '#7e22ce', '#ffffff'][Math.floor(visualRandom() * 5)];
                    this.vy = -(1 + visualRandom() * 3);
                } else if (type === 'arcade_ultra' || type === 'super_rare') {
                    this.color = ['#ffd700', '#ff1493', '#00ffff', '#ffffff', '#a855f7'][Math.floor(visualRandom() * 5)];
                    this.vx *= 1.5;
                    this.vy *= 1.5;
                } else if (type === 'equip') {
                    this.color = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#ffffff'][Math.floor(visualRandom() * 5)];
                } else if (type === 'heal') {
                    this.color = ['#00ff7f', '#adff2f', '#ffffff', '#00ffff'][Math.floor(visualRandom() * 4)];
                } else if (type === 'buff') {
                    this.color = ['#ffd700', '#ff4500', '#ff1493', '#ffffff'][Math.floor(visualRandom() * 4)];
                } else {
                    this.color = ['#ffffff', '#d3d3d3', '#a9a9a9', '#f5f5f5'][Math.floor(visualRandom() * 4)];
                }

                this.size = 4 + visualRandom() * 8;
                this.maxLife = 30 + visualRandom() * 30;
                this.life = this.maxLife;
                this.alpha = 1.0;
                this.gravity = (type === 'jimen' || type === 'mizu') ? 0.2 : -0.05;
                this.friction = 0.93;
                this.shape = visualRandom() > 0.3 ? 'spark' : 'circle';
                this.rotation = visualRandom() * Math.PI * 2;
                this.rotSpeed = (visualRandom() - 0.5) * 0.25;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                this.alpha = Math.max(0, this.life / this.maxLife);
                this.size = Math.max(0.5, this.size * 0.97);
                this.rotation += this.rotSpeed;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;

                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        ctx.lineTo(0, -this.size);
                        ctx.rotate(Math.PI / 4);
                        ctx.lineTo(0, -this.size * 0.4);
                        ctx.rotate(Math.PI / 4);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class ParticleSystemManager {
            constructor() {
                this.particles = [];
                this.canvas = null;
                this.ctx = null;
                this.animId = null;
                this.isRunning = false;
            }

            init(canvasId) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                this.isRunning = true;
                if (this.particles.length) this.ensureLoop();
            }

            resize() {
                if (!this.canvas) return;
                const rect = this.canvas.getBoundingClientRect();
                const w = Math.round(rect.width) || window.innerWidth;
                const h = Math.round(rect.height) || 400;
                // サイズが変わらない時はキャンバスを触らない(再描画によるちらつき・無駄な処理を防ぐ)
                if (this.canvas.width !== w) this.canvas.width = w;
                if (this.canvas.height !== h) this.canvas.height = h;
            }

            // パーティクルがある間だけアニメーションを回す(無い時は何も処理しない)
            ensureLoop() {
                if (!this.isRunning || this.animId) return;
                this.animId = requestAnimationFrame(() => this.loop());
            }

            spawn(x, y, type, count = 35) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x, y, type));
                }
                this.ensureLoop();
            }

            burstCenter(type = 'arcade_ultra', count = 100) {
                if (!this.canvas) return;
                const cx = this.canvas.width / 2;
                const cy = this.canvas.height / 2;
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(cx, cy, type));
                }
                this.ensureLoop();
            }

            loop() {
                this.animId = null;
                if (!this.isRunning || !this.ctx || !this.canvas) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.update();
                    p.draw(this.ctx);
                    if (p.life <= 0 || p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                if (this.particles.length) this.ensureLoop();
                else this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
                this.animId = null;
                this.particles = [];
            }
        }

        const particleSystem = new ParticleSystemManager();
        // 画面サイズ・向きが変わった時もキャンバスの内部サイズを表示サイズに合わせる
        window.addEventListener('resize', () => { try { particleSystem.resize(); } catch (e) {} });
        window.addEventListener('orientationchange', () => { try { setTimeout(() => particleSystem.resize(), 200); } catch (e) {} });

        function getTypeMultiplier(attackType, defenderElements) {
            let multi = 1;
            const defs = Array.isArray(defenderElements) ? defenderElements : [defenderElements];
            defs.forEach(def => {
                if (TYPE_CHART[attackType] && TYPE_CHART[attackType][def] !== undefined) {
                    multi *= TYPE_CHART[attackType][def];
                }
            });
            return multi;

        // 起動時にバージョンを記録する。前回のバージョンは previousVersion に残す（プレイデータは消さない）。
        function recordAppVersion() {

        // 既存のプレイデータ(所持モンスター)を消さずに、今回の調整内容(ステータス・特性・技)へ追従させる。
        const SPEC_SYNC_BASE_IDS = ['shachirichiri', 'koakusan', 'kikuchuu', 'nemoi', 'jahibi', 'kamiDeYaiba', 'shigo', 'armorGao', 'basuken', 'chibasin'];
        const SPEC_SYNC_SKILL_NAMES = ['じこさいせい', 'はねやすめ', 'おたけび', 'はねる', 'ねらいうち', 'ジャッチキル', 'ひびきファージ', 'まもる', 'ダンクシュート'];
        function migrateMonsterToCurrentSpec(mon) {
            if (!mon) return false;
            let changed = false;
            const base = MONSTERS_DB[mon.baseId];
            if (base && SPEC_SYNC_BASE_IDS.includes(mon.baseId)) {
                const statKeys = ['atk', 'def', 'spa', 'spd', 'speed'];
                const differs = Number(mon.maxHp) !== base.maxHp
                    || statKeys.some(k => mon[k] !== base[k])
                    || !mon.ability || mon.ability.name !== base.ability.name || mon.ability.desc !== base.ability.desc;
                if (differs) {
                    const oldMax = Number(mon.maxHp) > 0 ? Number(mon.maxHp) : base.maxHp;
                    const oldHp = Number(mon.hp);
                    const ratio = Number.isFinite(oldHp) ? Math.max(0, Math.min(1, oldHp / oldMax)) : 1;
                    mon.maxHp = base.maxHp;
                    mon.hp = Math.min(base.maxHp, Math.max(0, Math.round(base.maxHp * ratio)));
                    statKeys.forEach(k => { mon[k] = base[k]; });
                    mon.ability = { ...base.ability };
                    changed = true;
                }
            }
            if (Array.isArray(mon.skills)) {
                mon.skills.forEach(skill => {
                    if (!skill || !SPEC_SYNC_SKILL_NAMES.includes(skill.name)) return;
                    const updated = Object.values(SKILLS_DB).find(d => d.name === skill.name);
                    if (!updated) return;
                    ['type', 'category', 'power', 'accuracy', 'maxPp', 'desc'].forEach(k => {
                        if (skill[k] !== updated[k]) { skill[k] = updated[k]; changed = true; }
                    });
                    const nextPp = Math.min(Number.isFinite(Number(skill.pp)) ? Number(skill.pp) : updated.maxPp, updated.maxPp);
                    if (skill.pp !== nextPp) { skill.pp = nextPp; changed = true; }
                });
            }
            return changed;
        }

                            const nemoiBase = MONSTERS_DB.nemoi;
                            mon.maxHp = nemoiBase.maxHp; mon.hp = Math.max(0, Math.min(mon.maxHp, Math.round(mon.maxHp * oldRatio)));
                            mon.atk = nemoiBase.atk; mon.def = nemoiBase.def; mon.spa = nemoiBase.spa; mon.spd = nemoiBase.spd; mon.speed = nemoiBase.speed;
                            mon.ability = { ...nemoiBase.ability };
                        }
                        if (mon.baseId === 'basuken' && Array.isArray(mon.skills)) {
                            mon.skills = mon.skills.map(skill => {
                                if (!skill || (skill.name !== 'はたく' && skill.id !== 'hataku')) return skill;
                                const updated = SKILLS_DB.tataku;
                                basukenSkillMigrated = true;
                                return { ...skill, id: 'tataku', name: updated.name, type: updated.type, category: updated.category, power: updated.power, accuracy: updated.accuracy, maxPp: updated.maxPp, desc: updated.desc, pp: Math.min(Number(skill.pp) || 0, updated.maxPp) };
                            });
                        }

                        if (!mon) return;
                        if (mon.baseId === 'jahibi') {
                            const oldMaxHp = Number(mon.maxHp) || MONSTERS_DB.jahibi.maxHp;
                            const oldHp = Number(mon.hp);
                            const hpRate = oldMaxHp > 0 && Number.isFinite(oldHp) ? Math.max(0, Math.min(1, oldHp / oldMaxHp)) : 1;
                            const base = MONSTERS_DB.jahibi;
                            mon.name = base.name;
                            mon.element = [...base.element];
                            mon.maxHp = base.maxHp;
                            mon.hp = Math.min(mon.maxHp, Math.max(0, Math.round(mon.maxHp * hpRate)));
                            mon.atk = base.atk;
                            mon.def = base.def;
                            mon.spa = base.spa;
                            mon.spd = base.spd;
                            mon.speed = base.speed;
                            mon.ability = { ...base.ability };
                            mon.skills = base.skillIds.map(id => {
                                const def = SKILLS_DB[id];
                                const old = (mon.skills || []).find(sk => sk && sk.name === def.name);
                                const oldPp = old ? Number(old.pp) : NaN;
                                return { ...def, pp: Number.isFinite(oldPp) ? Math.max(0, Math.min(oldPp, def.maxPp)) : def.maxPp };
                            });
                            jahibiStatsMigrated = true;
                        } else if (mon.baseId === 'kamiDeYaiba' && Array.isArray(mon.skills)) {
                            mon.skills.forEach(skill => {
                                const updated = skill.name === 'カミデヤイバ' ? SKILLS_DB.kamiDeYaibaSkill : (skill.name === 'ゴッドバード' ? SKILLS_DB.goddobaado : null);
                                if (!updated) return;
                                skill.type = updated.type;
                                skill.category = updated.category;
                                skill.power = updated.power;
                                skill.accuracy = updated.accuracy;
                                skill.maxPp = updated.maxPp;
                                skill.desc = updated.desc;
                                skill.pp = Math.min(Number(skill.pp) || 0, updated.maxPp);
                                jahibiStatsMigrated = true;
                            });
                        }
                    });
                    recordAppVersion();
                    if (jahibiStatsMigrated || basukenSkillMigrated || specMigrated || balanceDirty) saveGame();
                } catch(e) {
                    console.error("Save load error:", e);
                }
            } else {
                gameState.balanceAdjustV1 = true; // 新規プレイヤーは調整の対象外
                recordAppVersion();
            }
            if (!gameState.playerId) {
                gameState.playerId = 'usr_' + Math.random().toString(36).substring(2, 10) + Date.now();
                saveGame();
            }
        }

        function sanitizeName(name) {
            if (!name) return '';
            let clean = name.trim().replace(/<[^>]*>?/gm, '');
            return clean.substring(0, 12);
        }

        // Socket.IO Manager (単一インスタンス・ターン完全同期)
        function initOnlineSocket() {
            const storedName = gameState.playerName || '';
            addOnlineLog(`1. プレイヤー確認: 名前="${storedName}" (ID: ${gameState.playerId})`);

            if (!storedName) {
                onlineState.authStatus = 'unauthenticated';
                onlineState.lastError = 'プレイヤー名が未登録です。';
                addOnlineLog(`⚠️ プレイヤー名が未登録のためオンライン処理を開始できません。`);
                updateOnlineUI();
                return;
            }

            if (socket) {
                if (socket.connected) {
                    if (!onlineState.isRegistered && !onlineState.registerRequested) {
                        sendRegisterPlayer();
                    }
                    return;
                } else {
                    addOnlineLog("既存のSocketインスタンスを再接続します...");
                    socket.connect();
                    return;
                }
            }

            onlineState.authStatus = 'authenticating';
            updateOnlineUI();

            addOnlineLog(`2. io("${RENDER_SERVER_URL}") を実行します`);
            socket = io(RENDER_SERVER_URL, {
                autoConnect: true,
                reconnection: true,
                reconnectionAttempts: 10,
                reconnectionDelay: 1000,
                transports: ["websocket", "polling"],
                secure: true
            });

            socket.on('connect', () => {
                onlineState.isConnected = true;
                onlineState.lastError = null;
                addOnlineLog(`3. connectイベント発生: Socket.ID = ${socket.id}`);
                updateOnlineUI();

                sendRegisterPlayer();
            });

            socket.on('connect_error', (err) => {
                onlineState.isConnected = false;
                onlineState.isRegistered = false;
                onlineState.authStatus = 'error';
                onlineState.registerRequested = false;
                onlineState.lastError = err.message || '接続エラーが発生しました。';
                addOnlineLog(`4. connect_error発生: ${onlineState.lastError}`);
                updateOnlineUI();
            });

            socket.on('disconnect', (reason) => {
                onlineState.isConnected = false;
                onlineState.isSearching = false;
                if (onlineState.matchProposal) finishMatchProposal('サーバーとの接続が切れたため対戦をキャンセルしました');
                onlineState.isRegistered = false;
                onlineState.authStatus = 'unauthenticated';
                onlineState.registerRequested = false;
                addOnlineLog(`⚠️ サーバー切断: ${reason}`);
                updateOnlineUI();
            });

            const handleRegisteredSuccess = (data) => {
                onlineState.playerId = (data && data.playerId) || (socket && socket.id) || '';
                onlineState.isRegistered = true;
                onlineState.authStatus = 'authenticated';
                onlineState.lastError = null;
                onlineState.registerRequested = false;
                addOnlineLog(`登録完了(registered受信)！ 認証状態: authenticated`);
                updateOnlineUI();

                // 対戦中に回線が切れて再接続した場合は、同じ対戦への復帰を試みる
                if (battleState && battleState.mode === 'online' && battleState.turnPhase !== 'gameover' && !battleState.onlineDisconnected && battleState.onlineRoomId) {
                    addOnlineLog('対戦中の再接続: 対戦への復帰を要求します。');
                    socket.emit('rejoin_match', { roomId: battleState.onlineRoomId, playerId: gameState.playerId });
                }
                if (onlineState.pendingMatchAfterRegister) {
                    onlineState.pendingMatchAfterRegister = false;
                    addOnlineLog(`保留中のマッチングを実行します。`);
                    executeJoinQueueInternal();
                }
            };

            socket.on('registered', handleRegisteredSuccess);
            socket.on('player_registered', handleRegisteredSuccess);
            socket.on('registerSuccess', handleRegisteredSuccess);

            const handleRegisterError = (data) => {
                const errMsg = typeof data === 'string' ? data : (data.message || JSON.stringify(data));
                addOnlineLog(`登録エラー発生: ${errMsg}`);
                onlineState.lastError = errMsg;
                onlineState.isRegistered = false;
                onlineState.authStatus = 'error';
                onlineState.registerRequested = false;
                updateOnlineUI();
            };

            socket.on('registerError', handleRegisterError);
            socket.on('register_error', handleRegisterError);
            socket.on('error', handleRegisterError);

            socket.on('queueJoined', () => addOnlineLog(`キュー登録成功: 対戦待ち中...`));
            socket.on('queue_joined', () => addOnlineLog(`キュー登録成功: 対戦相手を検索中...`));

            const handleMatchFound = (data) => {
                try {
                    addOnlineLog(`🎉 matchFoundイベントを受信しました: ${JSON.stringify(data || {})}`);

                    if (!data) return;
                    const incomingRoom = data.roomId || data.room_id || 'room_default';
                    if (battleState && battleState.mode === 'online' && battleState.turnPhase !== 'gameover' && onlineState.roomId === incomingRoom) {
                        addOnlineLog('⚠️ 同じルームのマッチ通知を重複受信したため無視しました。');
                        return;
                    }
                    if (onlineState.matchProposal && onlineState.matchProposal.roomId === incomingRoom) {
                        addOnlineLog('⚠️ 承諾待ちのルームのマッチ通知を重複受信したため無視しました。');
                        return;
                    }
                    // 自動検索中のホーム画面以外(他のモード・戦闘中など)ではマッチングを成立させない
                    if (!onlineState.isSearching || onlineState.matchProposal || onlineState.battleStarting || gameState.currentView !== 'menu' || gameState.autoMatchEnabled === false || document.hidden || __autoMatchPaused || isUserIdle()) {
                        addOnlineLog('⚠️ 自動検索中ではないタイミングのマッチ通知のため、対戦を開始せず辞退します。');
                        sendMatchDecision({ roomId: incomingRoom }, false);
                        return;
                    }
                    onlineState.resolvingTurn = false;
                    onlineState.isSearching = false;
                    onlineState.roomId = data.roomId || data.room_id || 'room_default';
                    onlineState.playerId = data.playerId || (socket && socket.id) || onlineState.playerId || '';
                    onlineState.localIsFirst = !!(onlineState.playerId && onlineState.roomId.startsWith('match_' + onlineState.playerId + '_'));
                    onlineState.turn = 1;
                    onlineState.turnSubmitted = false;

                    const oppName = data.opponentName || data.opponent_name || (data.opponent && data.opponent.name) || '対戦相手';
                    onlineState.opponentName = oppName;

                    let oppTeamRaw = data.opponentTeam || data.opponent_team || (data.opponent && data.opponent.party) || data.party || [];

                    let formattedOpponentTeam = oppTeamRaw.map(mon => {
                        let baseMon = MONSTERS_DB[mon.baseId || mon.id] || MONSTERS_DB['koujiradon'];
                        return {
                            instanceId: mon.instanceId || ('opp_' + Math.random().toString(36).substring(2, 9)),
                            baseId: baseMon.id,
                            name: mon.name || baseMon.name,
                            element: mon.element || [...baseMon.element],
                            hp: mon.hp !== undefined ? mon.hp : baseMon.hp,
                            maxHp: mon.maxHp || mon.hp || baseMon.maxHp,
                            atk: mon.atk || baseMon.atk,
                            def: mon.def || baseMon.def,
                            spa: mon.spa || baseMon.spa,
                            spd: mon.spd || baseMon.spd,
                            speed: mon.speed || baseMon.speed,
                            ability: mon.ability || { ...baseMon.ability },
                            skills: (mon.skills && mon.skills.length > 0) ? mon.skills : baseMon.skillIds.map(sId => ({ ...SKILLS_DB[sId], pp: SKILLS_DB[sId].maxPp })),
                            imageUrl: mon.imageUrl || baseMon.imageUrl || '',
                            desc: mon.desc || baseMon.desc,
                            equippedItemId: mon.equippedItemId || null,
                            stages: mon.stages || { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 },
                            status: mon.status || null,
                            statusTurns: 0,
                            turnsInBattle: 0,
                            hasSturdied: false,
                            isSkipTurn: false,
                            isProtected: false,
                            isFirstTurn: true
                        };
                    });

                    if (formattedOpponentTeam.length === 0) {
                        formattedOpponentTeam = ['koujiradon', 'reishoujin', 'rafureon'].map(bId => createMonsterInstance(bId));
                    }

                    onlineState.opponentTeam = formattedOpponentTeam;
                    addOnlineLog(`マッチング成立: RoomID=${onlineState.roomId}, 相手=${onlineState.opponentName} (対戦する/しないの確認待ち)`);
                    // この時点では対戦を開始しない。双方が「対戦する」を選んだ時だけ startOnlineBattle() を呼ぶ
                    beginMatchProposal();

                } catch (err) {
                    console.error("matchFound受信処理でエラーが発生しました:", err);
                    addOnlineLog(`❌ matchFound受信エラー: ${err.message}`);
                }
            };

            socket.on('matchFound', handleMatchFound);
            socket.on('match_found', handleMatchFound);
            socket.on('match_decision', onMatchDecisionReceived);
            socket.on('matchDecision', onMatchDecisionReceived);

            socket.on('serverError', handleRegisterError);
            socket.on('server_error', handleRegisterError);

            // オンラインターン処理受信
            const handleTurnResolution = (data) => {
                handleOnlineTurnResolution(data);
            };

            socket.on('turn_resolution', handleTurnResolution);
            socket.on('turnResolution', handleTurnResolution);
            socket.on('turn_result', handleTurnResolution);
            registerWeeklyTopListeners(socket);
            socket.on('connect', () => { requestWeeklyTop(); flushWeeklyPending(); syncWeeklyStats(); });
            socket.on('battle_turn', handleTurnResolution);

            socket.on('opponent_disconnected', (info) => {
                addOnlineLog(`相手プレイヤーが切断されました。`);
                const infoRoom = info && info.roomId;
                if (onlineState.matchProposal) {
                    if (infoRoom && infoRoom !== onlineState.matchProposal.roomId) return; // 別の部屋の通知は無視
                    finishMatchProposal('相手が切断したため対戦をキャンセルしました'); return;
                }
                // 進行中のオンライン対戦以外(すでに決着済みなど)では不戦勝にしない
                if (!battleState || battleState.mode !== 'online' || battleState.turnPhase === 'gameover' || battleState.onlineDisconnected) return;
                if (infoRoom && battleState.onlineRoomId && infoRoom !== battleState.onlineRoomId) return; // 過去の対戦の通知で今の対戦を勝利扱いにしない
                battleState.turnPhase = 'gameover';
                battleState.resultResolved = true;
                battleState.onlineDisconnected = true;
                onlineState.turnSubmitted = false;
                onlineState.resolvingTurn = false;
                stopBattleBGM();
                const gained = grantOnlineReward(true);
                const rewardHtml = (gained > 0 ? `<br><br><span class="text-yellow-300 font-black">勝利報酬：${gained} G を獲得！</span>` : '') + onlineGearDropHtml();
                const dcReason = info && info.reason === 'timeout' ? '相手プレイヤーが長時間操作しなかったため、あなたの不戦勝となりました！' : '相手プレイヤーが切断されたため、あなたの不戦勝となりました！';
                showModal(info && info.reason === 'timeout' ? '放置勝利' : '通信切断勝訴', dcReason + rewardHtml, '🎉', () => {
                    closeModal();
                    renderOnlineMenu();
                });
            });


            // v16: 相手が降参した(サーバーから通知) → 勝利
            socket.on('opponent_surrendered', (info) => {
                const infoRoom = info && info.roomId;
                if (!battleState || battleState.mode !== 'online' || battleState.turnPhase === 'gameover' || battleState.onlineDisconnected) return;
                if (infoRoom && battleState.onlineRoomId && infoRoom !== battleState.onlineRoomId) return; // 過去の対戦の通知は無視
                addOnlineLog('相手プレイヤーが降参しました。');
                battleState.turnPhase = 'gameover';
                battleState.resultResolved = true;
                battleState.onlineDisconnected = true;
                onlineState.turnSubmitted = false;
                onlineState.resolvingTurn = false;
                stopBattleBGM();
                const gained = grantOnlineReward(true);
                refreshSurrenderButton();
                const rewardHtml = (gained > 0 ? `<br><br><span class="text-yellow-300 font-black">勝利報酬：${gained} G を獲得！</span>` : '') + onlineGearDropHtml();
                showModal('ONLINE 勝利！ 🎉', '相手プレイヤーが降参しました！あなたの勝利です！' + rewardHtml, '🏆', () => {
                    closeModal();
                    renderOnlineMenu();
                });
            });

            // ---- v12: マッチング放置対策・対戦同期の見直し ----
            // 承諾待ちがサーバー側で時間切れになった(どちらか/双方が返答しなかった)
            socket.on('match_expired', (info) => {
                const p = onlineState.matchProposal;
                if (!p || (info && info.roomId && info.roomId !== p.roomId)) return;
                addOnlineLog('承諾待ちがサーバー側で時間切れになりました。');
                finishMatchProposal(info && info.noResponse ? '返答がなかったため対戦を中止しました' : '相手から応答がなかったため対戦を中止しました');
            });
            // 検索中の生存確認が途絶えて待機列から外れた → 自動検索を再開できる状態にする
            socket.on('queue_expired', () => {
                addOnlineLog('待機列から外れました(再検索します)。');
                onlineState.isSearching = false;
                __autoMatchNextAt = Date.now() + 1000;
            });
            // 無応答が続いた → 画面操作が戻るまで自動マッチングを止める
            const handleIdleKick = () => {
                addOnlineLog('応答がない状態が続いたため、自動マッチングを一時停止しました。');
                __autoMatchPaused = true;
                onlineState.isSearching = false;
                if (onlineState.matchProposal) finishMatchProposal('');
                showMatchToast('応答がなかったため自動マッチングを一時停止しました(画面を操作すると再開します)');
            };
            socket.on('idle_kicked', handleIdleKick);
            socket.on('queue_blocked', () => { __autoMatchPaused = true; onlineState.isSearching = false; });
            // 自分が長時間行動を送らず、対戦が放置扱いで終了した
            socket.on('match_timeout', (info) => {
                if (!battleState || battleState.mode !== 'online' || battleState.turnPhase === 'gameover' || battleState.onlineDisconnected) return;
                if (info && info.roomId && battleState.onlineRoomId && info.roomId !== battleState.onlineRoomId) return;
                abortOnlineBattle('長時間操作がなかったため、対戦は終了しました。', '対戦終了');
            });
            socket.on('opponent_reconnecting', () => {
                addOnlineLog('相手の接続が一時的に切れました。復帰を待っています...');
                if (battleState && battleState.mode === 'online' && battleState.turnPhase !== 'gameover') showMatchToast('相手の通信が不安定です。復帰を待っています...');
            });
            socket.on('opponent_reconnected', () => { addOnlineLog('相手が復帰しました。'); });
            // 自分の回線が復帰した → 続行できなければ対戦を終了する
            socket.on('rejoin_failed', () => {
                if (!battleState || battleState.mode !== 'online' || battleState.turnPhase === 'gameover' || battleState.onlineDisconnected) return;
                abortOnlineBattle('通信が切れている間に対戦が終了しました。', '対戦終了');
            });
            socket.on('rejoined', () => { addOnlineLog('対戦に復帰しました。'); });
        }

        // 決着・中断した対戦をサーバーに知らせる(古い部屋が残って次の対戦に影響しないようにする)

        // ===== v16: オンライン戦闘の降参機能(戦闘開始から5ターン経過後に表示) =====
        const SURRENDER_AFTER_TURNS = 5;
        function surrenderAvailable() {
            return !!(gameState.currentView === 'battle' && battleState && battleState.mode === 'online'
                && battleState.turnPhase !== 'gameover' && !battleState.onlineDisconnected && !battleState.surrendered
                && Number(onlineState.turn) > SURRENDER_AFTER_TURNS);
        }
        // 押せるのは「自分の行動選択中」か「行動送信後に相手を待っている間」だけ(ターン処理・アニメ中は不可)
        function surrenderClickable() {
            if (!surrenderAvailable()) return false;
            if (onlineState.resolvingTurn) return false;
            return battleState.turnPhase === 'menu' || (battleState.turnPhase === 'processing' && !!onlineState.turnSubmitted);
        }
        function refreshSurrenderButton() {
            const btn = document.getElementById('surrender-btn');
            if (!btn) return;
            const show = surrenderAvailable();
            btn.classList.toggle('hidden', !show);
            btn.disabled = show ? !surrenderClickable() : true;
        }
        function surrenderOnlineBattle() {
            if (!surrenderClickable()) return;
            playSound('click');
            showModal('降参しますか？', 'この対戦に降参すると<b class="text-red-300">敗北</b>となり、相手の勝利になります。<br><span class="text-xs text-gray-400">(参加賞のみ獲得できます)</span>', '🏳️');
            const btnBox = document.getElementById('modal-buttons');
            if (btnBox) btnBox.innerHTML = `<button onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-2xl">続ける</button><button onclick="executeSurrender()" class="flex-1 bg-gradient-to-r from-red-700 to-rose-600 text-white font-black py-3 rounded-2xl">降参する</button>`;
        }
        function executeSurrender() {
            closeModal();
            if (!surrenderAvailable() || battleState.surrendered) return; // 確認中に決着・切断した場合は何もしない
            if (!socket || !socket.connected) {
                showModal('通信エラー', 'サーバーとの接続が切れているため降参できません。', '⚠️', closeModal);
                return;
            }
            const roomId = battleState.onlineRoomId || onlineState.roomId;
            battleState.surrendered = true;
            battleState.turnPhase = 'gameover';
            battleState.resultResolved = true;
            battleState.onlineDisconnected = true; // 以後のターン処理・相手からの通知を無視する
            onlineState.turnSubmitted = false;
            onlineState.resolvingTurn = false;
            stopBattleBGM();
            addOnlineLog('[降参] 降参を送信しました。');
            socket.emit('surrender', { roomId: roomId, playerId: gameState.playerId });
            const gained = grantOnlineReward(false); // 敗北扱い(参加賞)
            refreshSurrenderButton();
            const rewardHtml = gained > 0 ? `<br><br><span class="text-yellow-300 font-black">参加賞：${gained} G を獲得！</span>` : '';
            showModal('降参しました', '対戦に降参しました。' + rewardHtml, '🏳️', () => { closeModal(); renderOnlineMenu(); });
        }

        function notifyMatchFinished() {
            try {
                const roomId = (battleState && battleState.onlineRoomId) || onlineState.roomId;
                if (socket && socket.connected && roomId) socket.emit('match_finished', { roomId: roomId });
            } catch (e) {}
        }
        // 報酬なしで対戦を終了してオンラインメニューへ戻す(放置・通信断など)
        function abortOnlineBattle(message, title) {
            if (!battleState || battleState.mode !== 'online') return;
            battleState.turnPhase = 'gameover';
            battleState.resultResolved = true;
            battleState.onlineDisconnected = true;
            onlineState.turnSubmitted = false;
            onlineState.resolvingTurn = false;
            stopBattleBGM();
            showModal(title || '対戦終了', message, '⚠️', () => { closeModal(); renderOnlineMenu(); });
        }

        function sendRegisterPlayer() {
            const nameToSend = gameState.playerName || '';
            if (!nameToSend || !socket || !socket.connected) return;

            if (onlineState.isRegistered && onlineState.authStatus === 'authenticated') return;

            const payloadObject = {
                playerId: gameState.playerId,
                playerName: nameToSend,
                name: nameToSend,
                id: gameState.playerId
            };

            onlineState.registerRequested = true;
            addOnlineLog(`registerPlayer送信: ${JSON.stringify(payloadObject)}`);

            socket.emit('registerPlayer', payloadObject);
        }

        function renderMonsterImage(monster, className = "w-32 h-32") {
            let src = monster.imageUrl;
            if (src) {
                return `
                    <div class="${className} relative flex items-center justify-center bg-gradient-to-b from-gray-900 to-black rounded-2xl overflow-hidden border border-gray-700/80 shadow-2xl flex-shrink-0">
                        <img src="${src}" alt="${monster.name}" class="w-full h-full object-cover object-center" onerror="this.onerror=null; this.src='https://placehold.co/200x200/111827/fff?text=${encodeURIComponent(monster.name)}';" />
                    </div>
                `;
            } else {
                return `
                    <div class="${className} relative flex items-center justify-center bg-gradient-to-b from-purple-950/60 to-indigo-950/80 rounded-2xl p-2 border border-purple-600/50 shadow-inner flex-shrink-0">
                        <span class="text-4xl">✨</span>
                    </div>
                `;
            }
        }

        // ==========================================
        // --- 5. VIEW RENDERERS ---
        // ==========================================
        function renderStarterSelect() {
            stopBattleBGM();
            gameState.currentView = 'starter-select';
            updateHeader();
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-5xl text-center px-4">
                    <div class="inline-block bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-sm font-bold px-4 py-1.5 rounded-full mb-4 shadow-lg">
                        冒険の始まり - 御三家を選ぼう
                    </div>
                    <h2 class="text-3xl sm:text-5xl font-black mb-3 tracking-wide text-white">最初の相棒を選べ</h2>
                    <p class="text-gray-400 text-sm sm:text-base mb-10 max-w-xl mx-auto">くさ・ほのお・みずの3体から、最初のパートナーを選択してください。</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
