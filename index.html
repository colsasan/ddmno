        function getAuthBadgeStyle() {
            if (onlineState.authStatus === 'authenticated') return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
            if (onlineState.authStatus === 'authenticating') return 'bg-amber-500/20 text-amber-300 border border-amber-500/40 animate-pulse';
            if (onlineState.authStatus === 'error') return 'bg-red-500/20 text-red-400 border border-red-500/40';
            return 'bg-gray-500/20 text-gray-400 border border-gray-500/40';
        }

        function getAuthStatusText() {
            if (onlineState.authStatus === 'authenticated') return '● 接続・プレイヤー登録完了 (認証OK)';
            if (onlineState.authStatus === 'authenticating') return '○ 接続完了 (サーバー認証中...)';
            if (onlineState.authStatus === 'error') return '❌ 認証・接続エラー発生';
            return '○ 未認証';
        }

        function updateOnlineUI() {
            const badge = document.getElementById('connection-status-badge');
            if (badge) {
                badge.className = `text-xs px-3 py-1 rounded-full font-bold mb-4 ${getAuthBadgeStyle()}`;
                badge.innerText = getAuthStatusText();
            }
            if (gameState.currentView === 'online-menu') {
                renderOnlineMenu();
            }
        }

        function startRandomMatch() {
            if (!socket || !onlineState.isConnected) {
                addOnlineLog("Socketが未接続です。接続試行を行います...");
                onlineState.pendingMatchAfterRegister = true;
                initOnlineSocket();
                return;
            }

            if (onlineState.authStatus !== 'authenticated' || !onlineState.isRegistered) {
                addOnlineLog("⚠️ まだプレイヤー登録認証が完了していません。登録認証を待ってマッチングします。");
                onlineState.pendingMatchAfterRegister = true;
                sendRegisterPlayer();
                return;
            }

            executeJoinQueueInternal();
        }

        function executeJoinQueueInternal() {
            onlineState.pendingMatchAfterRegister = false;
            // ホーム画面にいて、自動マッチングがONで、オンライン専用編成が完成している時だけ検索する
            if (!autoMatchShouldRun() || onlineState.isSearching) {
                addOnlineLog('自動検索の条件を満たしていないため、検索を開始しません。');
                return;
            }
            if (!socket || !socket.connected) return;

            const myParty = getOnlineTeamCopies(); // オンライン専用編成(通常編成は使わない)
            onlineState.myParty = JSON.parse(JSON.stringify(myParty));
            onlineState.isSearching = true;
            __lastQueuePing = Date.now();

            const matchPayload = {
                playerId: gameState.playerId,
                playerName: gameState.playerName,
                party: myParty,
                pingCapable: true // 検索中は定期的に生存確認(queue_ping)を送る
            };

            addOnlineLog(`送信: マッチング要求 (joinQueue/join_random_match) [オンライン専用編成]`);
            socket.emit('joinQueue', matchPayload);
        }

        function cancelMatching() {
            stopAutoSearch();
            if (gameState.currentView === 'online-menu') renderOnlineMenu();
        }

        function resetMonsterForBattle(mon) {
            if (!mon) return;
            if (mon.ability?.name === '死後高速' && mon.hasShigoSpeedBoost) mon.speed /= 2;
            const baseElement = mon.baseElement || MONSTERS_DB[mon.baseId]?.element || mon.element || [];
            mon.baseElement = [...baseElement];
            mon.element = [...baseElement];
            mon.hp = mon.maxHp;
            mon.status = null;
            mon.statusTurns = 0;
            mon.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
            mon.volatileStatuses = [];
            mon.protectCount = 0;
            mon.turnsInBattle = 0;
            mon.hasSturdied = false;
            mon.hasShigoSpeedBoost = false;
            mon.hasPizaPanActivated = false;
            mon.hasDisinfected = false;
            mon.hasTransformedMask = false;
            mon.isSkipTurn = false;
            mon.isProtected = false;
            mon.isFirstTurn = true;
            mon.chargingSkill = null;
            mon.isReleasingCharge = false;
            mon.lockedMoveIndex = null;
            mon.abilityAtkMultiplier = 1;
            mon.abilityDefMultiplier = 1;
            mon.lastMoveFailed = false;
            mon.lastMoveUsedThisTurn = null;
            mon.damageTakenThisTurn = 0;
            mon.damageTakenPhysicalThisTurn = 0;
            mon.isBeakCannonCharging = false;
            mon.roostedElement = null;
            mon.entryAbilityUsed = false;
            mon.libLastSkill = null;
            mon.libStreak = 0;
            if (mon.baseId === 'nemoi') mon.ability = { ...MONSTERS_DB.nemoi.ability };
            (mon.skills || []).forEach(skill => { if (typeof skill.maxPp === 'number') skill.pp = skill.maxPp; });
        }

        function tryUseDisinfectant(mon) {
            if (!mon || mon.equippedItemId !== 'shoudokueki' || mon.hasDisinfected) return false;
            const hasAilment = !!mon.status || (mon.volatileStatuses || []).includes('hirumi');
            if (!hasAilment) return false;
            mon.status = null;
            mon.statusTurns = 0;
            mon.volatileStatuses = (mon.volatileStatuses || []).filter(x => x === 'akushyuu');
            mon.hasDisinfected = true;
            mon.equippedItemId = null;
            battleState.log.push(`[装備発動: ${mon.name}の消毒液] 状態異常を全て回復した！`);
            return true;
        }

        function tryActivatePizzaPan(mon) {
            if (!mon || mon.hp <= 0 || mon.equippedItemId !== 'pizapan' || mon.hasPizaPanActivated || mon.hp > mon.maxHp / 2) return false;
            mon.hasPizaPanActivated = true;
            mon.equippedItemId = null;
            const heal = Math.max(1, Math.floor(mon.maxHp / 4));
            mon.hp = Math.min(mon.maxHp, mon.hp + heal);
            battleState.log.push(`[装備発動: ${mon.name}のピザパン] HPが${heal}回復し、装備が消費された！`);
            return true;
        }

        function startOnlineBattle() {
            try {
                // オンライン対戦では必ずオンライン専用編成(検索時に相手へ送った内容と同じスナップショット)を使う
                const playerTeam = (onlineState.myParty && onlineState.myParty.length ? onlineState.myParty : getOnlineTeamCopies()).map(m => JSON.parse(JSON.stringify(m)));
                playerTeam.forEach(m => {
                    m.hp = m.maxHp;
                    m.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
                    m.status = null;
                    m.statusTurns = 0;
                    m.volatileStatuses = [];
                    m.protectCount = 0;
                    m.turnsInBattle = 0;
                    m.hasSturdied = false;
                    m.isSkipTurn = false;
                    m.isProtected = false;
                    m.isFirstTurn = true;
                });
                playerTeam.forEach(resetMonsterForBattle);
                // 相手チームも自分と同じ初期化を通す(両クライアントで同じ初期状態から計算し、結果のズレを防ぐ)
                const oppTeam = (onlineState.opponentTeam || []).slice(0, 3).map(m => JSON.parse(JSON.stringify(m)));
                oppTeam.forEach(m => {
                    if (!Array.isArray(m.skills)) m.skills = [];
                    m.skills.forEach(sk => { if (typeof sk.maxPp !== 'number') sk.maxPp = Number(sk.pp) || 0; });
                    resetMonsterForBattle(m);
                });
                onlineState.resolvingTurn = false;
                onlineState.turnSubmitted = false;

                battleState = {
                    mode: 'online',
                    onlineRoomId: onlineState.roomId,
                    onlineRewardGranted: false,
                    onlineDisconnected: false,
                    playerTeam: playerTeam,
                    playerIndex: 0,
                    cpuTeam: oppTeam,
                    cpuIndex: 0,
                    log: [`ONLINE BATTLE MATCHED: vs ${onlineState.opponentName}！`],
                    field: { stealthCutPlayer: false, stealthCutCpu: false, akuShuuTurns: 0, oikazePlayerTurns: 0, oikazeCpuTurns: 0 },
                    turnPhase: 'menu'
                };

                playBattleBGM(); // 今回の戦闘モードが決まった後にBGMを選ぶ
                checkBattleStartAbilities();
                renderBattleScreen();
                onlineState.battleStarting = false;
            } catch (err) {
                onlineState.battleStarting = false;
                console.error("startOnlineBattleの実行中にエラーが発生しました:", err);
                addOnlineLog(`❌ バトル画面切り替えエラー: ${err.message}`);
            }
        }

        // --- オンライン行動送信 (二重入力防止 & 統一フォーマット & 詳細ログ記録) ---
        function sendOnlineAction(actionType, detailIndex) {
            // [ログ] 技選択ボタンが押されたとき
            addOnlineLog(`[技選択] roomId=${onlineState.roomId}, playerId=${gameState.playerId}, turn=${onlineState.turn}, actionType=${actionType}, index=${detailIndex}`);

            if (!battleState || battleState.mode !== 'online' || battleState.turnPhase === 'gameover' || battleState.onlineDisconnected) return;
            if (battleState.turnPhase === 'processing' || onlineState.turnSubmitted) {
                addOnlineLog(`[二重送信防止] すでに行動送信済みまたは処理中です。(turn=${onlineState.turn})`);
                return;
            }

            if (!socket || !socket.connected) {
                const connErr = '通信エラー: サーバーとの接続が切断されています。';
                addOnlineLog(`❌ ${connErr}`);
                showModal('通信エラー', 'サーバーとの接続が切断されています。', '⚠️', closeModal);
                return;
            }

            // 同一ターン内での重複送信をガード
            onlineState.turnSubmitted = true;
            battleState.turnPhase = 'processing';
            battleState.log.push(`相手の行動選択を待っています...`);
            renderBattleScreen();

            // サーバーとクライアントのイベント名・データ形式統一
            const actionPayload = {
                roomId: onlineState.roomId,
                playerId: (socket && socket.id) || onlineState.playerId,
                turn: onlineState.turn,
                turnNumber: onlineState.turn,
                action: { type: actionType, index: detailIndex },
                type: actionType,
                index: detailIndex
            };

            // [ログ] 技選択データをサーバーへ送信したとき
            addOnlineLog(`[送信: 技選択データ] ${JSON.stringify(actionPayload)}`);
            
            onlineState.lastActionPayload = actionPayload; // 通信の取りこぼし時に再送するため保持
            onlineState.submitAt = Date.now();
            onlineState.lastResyncAt = 0;
            socket.emit('submit_action', actionPayload);
        }

        // --- リレーサーバーから届いた両者の行動を同じ順序で実行 ---
        function handleOnlineTurnResolution(data) {
            if (!battleState || battleState.mode !== 'online' || !data) return;
            if (battleState.onlineDisconnected || battleState.turnPhase === 'gameover') return;
            if (onlineState.resolvingTurn || Number(data.turn) !== onlineState.turn) {
                addOnlineLog(`[同期無視] 進行中またはターン不一致: received=${data.turn}, current=${onlineState.turn}`);
                return;
            }
            if (!data.myAction || !data.opponentAction) {
                addOnlineLog('❌ ターン結果に両プレイヤーの行動が含まれていません。');
                return;
            }

            onlineState.resolvingTurn = true;
            addOnlineLog(`[受信: ターン行動] turn=${data.turn}, my=${JSON.stringify(data.myAction)}, opponent=${JSON.stringify(data.opponentAction)}`);
            battleState.turnPhase = 'processing';

            // roomIdはserver.jsが match_<先着socket.id>_<後着socket.id> で生成する。
            // 両クライアントで同じ先着側から処理することで乱数消費順も一致させる。
            const firstAction = onlineState.localIsFirst ? data.myAction : data.opponentAction;
            const secondAction = onlineState.localIsFirst ? data.opponentAction : data.myAction;
            const seedText = `${onlineState.roomId}:${data.turn}`;
            let seed = 2166136261;
            for (let i = 0; i < seedText.length; i++) {
                seed ^= seedText.charCodeAt(i);
                seed = Math.imul(seed, 16777619);
            }
            let randomState = seed >>> 0;
            const originalRandom = Math.random;
            Math.random = function() {
                randomState += 0x6D2B79F5;
                let t = randomState;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };

            const localActorIsFirst = onlineState.localIsFirst;
            const onlinePlayerAction = localActorIsFirst ? firstAction : secondAction;
            const onlineCpuAction = localActorIsFirst ? secondAction : firstAction;
            if (onlinePlayerAction?.type === 'skill' && battleState.playerTeam[battleState.playerIndex]?.skills?.[Number(onlinePlayerAction.index)]?.name === 'くちばしキャノン') battleState.playerTeam[battleState.playerIndex].isBeakCannonCharging = true;
            if (onlineCpuAction?.type === 'skill' && battleState.cpuTeam[battleState.cpuIndex]?.skills?.[Number(onlineCpuAction.index)]?.name === 'くちばしキャノン') battleState.cpuTeam[battleState.cpuIndex].isBeakCannonCharging = true;
            const firstIsPlayer = localActorIsFirst;
            const secondIsPlayer = !localActorIsFirst;
            const getActorMon = isPlayer => isPlayer
                ? battleState.playerTeam[battleState.playerIndex]
                : battleState.cpuTeam[battleState.cpuIndex];
            const getTargetMon = isPlayer => isPlayer
                ? battleState.cpuTeam[battleState.cpuIndex]
                : battleState.playerTeam[battleState.playerIndex];

            let turnFinished = false;
            let turnWatchdog = null;
            const finish = () => {
                if (turnFinished) return;
                turnFinished = true;
                clearTimeout(turnWatchdog);
                try {
                    finishOnlineTurn(data.turn);
                } finally {
                    Math.random = originalRandom;
                    onlineState.resolvingTurn = false;
                }
            };
            // 何らかの理由でターン処理が止まっても、乱数を元に戻して進行を再開する
            turnWatchdog = setTimeout(() => {
                if (turnFinished) return;
                addOnlineLog('⚠️ ターン処理が長時間完了しなかったため、強制的に進行を再開します。');
                finish();
            }, 30000);

            const performAction = (action, isPlayer, opponentAction, callback) => {
                const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
                const activeIndex = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
                const actor = team[activeIndex];
                if (!actor || actor.hp <= 0) {
                    battleState.log.push(`${actor ? actor.name : '行動側'}は倒れていて行動できない！`);
                    callback();
                    return;
                }

                if (action.type === 'switch') {
                    const nextIndex = Number(action.index);
                    const enemy = getTargetMon(isPlayer);
                    const freestyle = isAbilitySuppressor(actor) || isAbilitySuppressor(enemy);
                    if (!Number.isInteger(nextIndex) || nextIndex < 0 || nextIndex >= team.length || nextIndex === activeIndex || !team[nextIndex] || team[nextIndex].hp <= 0 || (!freestyle && enemy && ['だる絡み', 'ねばねば'].includes(enemy.ability.name))) {
                        battleState.log.push(`${actor.name}は交代できなかった！`);
                        callback();
                        return;
                    }
                    // オフラインと同じ共通の交代処理(登場時の状態リセット・特性・ステルスカット)を使い、両クライアントで結果を一致させる
                    battleSwitchInternal(isPlayer, nextIndex, false);
                    setTimeout(callback, 350);
                    return;
                }

                if (action.type !== 'skill') {
                    battleState.log.push(`${actor.name}の行動データが不正です！`);
                    callback();
                    return;
                }
                const skillIndex = Number(action.index);
                // 使える技が無いときの「わるあがき」(index = -1)
                const isStruggle = skillIndex === -1 && battleHasNoUsableSkill(actor);
                let skill = isStruggle ? battleStruggleSkill() : (actor.skills && actor.skills[skillIndex]);
                if (!Number.isInteger(skillIndex) || !skill) {
                    battleState.log.push(`${actor.name}は技を選択できなかった！`);
                    callback();
                    return;
                }
                if (actor.chargingSkill) {
                    skill = actor.chargingSkill;
                } else if (isStruggle) {
                    // わるあがきはCPを消費しない
                } else if (skill.pp <= 0) {
                    battleState.log.push(`${actor.name}の${skill.name}はCP切れで出せない！`);
                    callback();
                    return;
                } else {
                    skill.pp--;
                }
                if (actor.equippedItemId === 'wing_kakera' && !isStruggle) actor.lockedMoveIndex = skillIndex;

                let opponentSkill = null;
                if (opponentAction && opponentAction.type === 'skill') {
                    const opponent = getTargetMon(isPlayer);
                    opponentSkill = opponent && opponent.skills ? opponent.skills[Number(opponentAction.index)] : null;
                    if (opponent && opponent.chargingSkill) opponentSkill = opponent.chargingSkill;
                }
                runAction(actor, getTargetMon(isPlayer), skill, isPlayer, opponentSkill, callback);
            };

            // 先制度・素早さを同一の乱数列で評価。交代は技より先に処理する。
            const actionPriority = (action, isPlayer) => {
                if (action && action.type === 'switch') return 6;
                const mon = getActorMon(isPlayer);
                const skill = mon && mon.chargingSkill ? mon.chargingSkill : (mon && mon.skills ? mon.skills[Number(action && action.index)] : null);
                if (!skill) return 0;
                if (mon.ability.name === '絶対命令' && mon.hp === mon.maxHp && skill.type === 'ghost') return 1;
                if (skill.name === 'ねこだまし' || skill.name === 'はやてがえし') return 3;
                if (skill.name === 'しんそく') return 2;
                if (['アクアジェット', 'しんくうは', 'マッハパンチ', 'かげうち'].includes(skill.name)) return 1;
                if (skill.name === 'ジャッチキル') return -1;
                return 0;
            };
            const speedOf = isPlayer => {
                const mon = getActorMon(isPlayer);
                let speed = mon.speed * getStageMultiplier(mon.stages.speed);
                if (mon.equippedItemId === 'wing_kakera') speed *= 1.5;
                if (mon.name === 'マエザワン' && mon.equippedItemId === 'katsura') speed *= 2;
                if (mon.status === 'mahi') speed *= 0.5;
                if (isPlayer && battleState.field.oikazePlayerTurns > 0) speed *= 2;
                if (!isPlayer && battleState.field.oikazeCpuTurns > 0) speed *= 2;
                return speed;
            };
            let firstPriority = actionPriority(firstAction, firstIsPlayer);
            let secondPriority = actionPriority(secondAction, secondIsPlayer);
            const firstMon = getActorMon(firstIsPlayer);
            const secondMon = getActorMon(secondIsPlayer);
            const freestyle = isAbilitySuppressor(firstMon) || isAbilitySuppressor(secondMon);
            if (!freestyle) {
                if (firstMon.ability.name === '安心感' && secondAction.type === 'skill' && secondPriority > 0) secondPriority = 0;
                if (secondMon.ability.name === '安心感' && firstAction.type === 'skill' && firstPriority > 0) firstPriority = 0;
            }
            let firstGoesFirst = firstPriority > secondPriority || (firstPriority === secondPriority && speedOf(firstIsPlayer) >= speedOf(secondIsPlayer));
            if (firstPriority === secondPriority) {
                if (firstMon.equippedItemId === 'nope' && Math.random() < 0.3) firstGoesFirst = true;
                else if (secondMon.equippedItemId === 'nope' && Math.random() < 0.3) firstGoesFirst = false;
            }
            if (!freestyle) {
                if (firstMon.ability.name === '最風' && Math.random() < 0.2) {
                    firstGoesFirst = true;
                    battleState.log.push(`[特性発動: ${firstMon.name}の最風] 20%の確率で先制する！`);
                }
                if (secondMon.ability.name === '最風' && Math.random() < 0.2) {
                    firstGoesFirst = false;
                    battleState.log.push(`[特性発動: ${secondMon.name}の最風] 20%の確率で先制する！`);
                }
            }

            const ordered = firstGoesFirst
                ? [[firstAction, firstIsPlayer, secondAction], [secondAction, secondIsPlayer, firstAction]]
                : [[secondAction, secondIsPlayer, firstAction], [firstAction, firstIsPlayer, secondAction]];
            try {
            performAction(ordered[0][0], ordered[0][1], ordered[0][2], () => {
                const nextActor = getActorMon(ordered[1][1]);
                if (!nextActor || nextActor.hp <= 0) {
                    battleState.log.push(`${nextActor ? nextActor.name : '後攻側'}は行動できない！`);
                    finish();
                    return;
                }
                performAction(ordered[1][0], ordered[1][1], ordered[1][2], finish);
            });
            } catch (turnErr) {
                console.error(turnErr);
                addOnlineLog('❌ ターン処理エラー: ' + turnErr.message);
                finish();
            }
        }

        function finishOnlineTurn(resolvedTurn) {
            const replaceFainted = (isPlayer) => {
                const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
                let index = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
                if (team[index] && team[index].hp > 0) return true;
                const nextIndex = team.findIndex(mon => mon.hp > 0);
                if (nextIndex < 0) return false;
                if (isPlayer) battleState.playerIndex = nextIndex;
                else battleState.cpuIndex = nextIndex;
                const nextMon = team[nextIndex];
                nextMon.isFirstTurn = true;
                triggerOnEntryAbility(nextMon, isPlayer);
                battleState.log.push(`いけっ！ ${nextMon.name}！`);
                return true;
            };

            const playerAlive = replaceFainted(true);
            const opponentAlive = replaceFainted(false);
            onlineState.turn = Number(resolvedTurn) + 1;
            onlineState.turnSubmitted = false;
            processTurnEndEffects(() => {
                if (battleState.mode !== 'online') return;
                if (!playerAlive || !opponentAlive) {
                    battleState.turnPhase = 'gameover';
                    stopBattleBGM();
                    if (!playerAlive && !opponentAlive) {
                        showModal('引き分け', '両チームが全滅しました。', '🤝', () => { closeModal(); renderOnlineMenu(); });
                    } else if (!playerAlive) {
                        showModal('ONLINE 敗北… 💦', 'チームが全滅しました。', '☠️', () => { closeModal(); renderOnlineMenu(); });
                    } else {
                        showModal('ONLINE 勝利！ 🎉', '相手チームが全滅しました！', '🏆', () => { closeModal(); renderOnlineMenu(); });
                    }
                    return;
                }
                battleState.playerTeam[battleState.playerIndex].isFirstTurn = false;
                battleState.cpuTeam[battleState.cpuIndex].isFirstTurn = false;
                battleState.turnPhase = 'menu';
                renderBattleScreen();
            });
        }

                return;

            playSound('buff');

            const btn = document.getElementById('gacha-btn');
            if(orb) { orb.classList.add('gacha-anim'); orb.innerText = '⚡'; }
            if(btn) btn.disabled = true;

            setTimeout(() => {
                const gachaKeys = Object.keys(MONSTERS_DB).filter(k => !(['kamiDeYaiba', 'jahibi', 'mirudew', 'shigo', 'tsumi', 'chibasin'].includes(k) || (MONSTERS_DB[k] && MONSTERS_DB[k].hidden)));
                const randomKey = gachaKeys[Math.floor(Math.random() * gachaKeys.length)];
                const newMonster = createMonsterInstance(randomKey);
                const SHINY_IMAGES = { rafureon: 'ra2.png', koujiradon: 'ko2.png', reishoujin: 'uo2.png', kojimasukyuraa: 'kj2.png', koakusan: 'ka2.png', kairin: 'ki2.png', ryougon: 'ry2.png', ataichou: 'ta2.png', hibihibiki: 'hi2.png', shachirichiri: 'sy2.png', nemoi: 'ne2.png' };
                const STARTER_KEYS = ['rafureon', 'koujiradon', 'reishoujin'];
                const shinyRate = STARTER_KEYS.includes(randomKey) ? 0.08 : 0.03; // 御三家8%・それ以外3%
                if (SHINY_IMAGES[randomKey] && Math.random() < shinyRate) {
                    newMonster.imageUrl = SHINY_IMAGES[randomKey];
                    newMonster.isShiny = true;
                }
                gameState.inventory.push(newMonster);

                if (gameState.team.length < 3) {
                    gameState.team.push(newMonster.instanceId);
                }

                saveGame();

                showModal(
                    `✨ 召喚成功！ ✨`,
                    `<div class="gacha-anim py-2 flex flex-col items-center">
                        <div class="w-20 h-20 mb-2">${renderMonsterImage(newMonster, 'w-20 h-20')}</div>
                        ${newMonster.isShiny ? '<div class="text-sm font-black text-pink-300 animate-pulse mb-1">✨ 色違い！ ✨</div>' : ''}<div class="text-xl font-black text-amber-300 mb-1">${newMonster.name}</div>
                        <div class="text-xs text-gray-400">新しい仲間がBOXに加わりました！</div>
                    </div>`,
                    '🌟',
                    () => { closeModal(); renderGacha(); }
                );
            }, 800);
        }

        // --- キャラ編成 & 装備設定画面 ---
        function renderParty() {
            stopBattleBGM();
            gameState.currentView = 'party';
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-5xl px-4">

            playSound('click');

                return;

            const equip = EQUIPMENT_DB[equipId];
            if (!equip) return;
            const html = `

                        <div>
                            <div class="font-black text-lg text-yellow-300">${equip.name}</div>

                        </div>
                    </div>
                    <p class="text-xs text-gray-200 leading-relaxed pt-2 border-t border-gray-800">${equip.desc}</p>
                </div>

            showModal(`装備詳細: ${equip.name}`, html, '🛡️', closeModal);
        }

        function addToTeam(instId) {
            if (gameState.team.length >= 3) {
                showModal('編成制限', 'チームには最大3体までしか編成できません。', '⚠️', closeModal);
                return;
            }
            if (!gameState.team.includes(instId)) {
                gameState.team.push(instId);
                saveGame();
                renderParty();
            }
        }

        function removeFromTeam(instId) {
            if (gameState.team.length <= 1) {
                showModal('警告', 'チームには最低1体のモンスターが必要です。', '⚠️', closeModal);
                return;
            }
            gameState.team = gameState.team.filter(id => id !== instId);
            saveGame();
            renderParty();
        }

        function openEquipSelectModal(instanceId) {
            playSound('click');
            const targetMon = gameState.inventory.find(m => m.instanceId === instanceId);
            if (!targetMon) return;

            const ownedList = gameState.ownedEquipment || [];

            const html = `
                <div class="space-y-3 w-full text-left">
                    <div class="text-xs text-gray-400 mb-2 font-bold">${targetMon.name} に装備させるアイテムを選択してください。</div>
                    
                    <button onclick="equipItemToMonster('${instanceId}', null)" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-2xl flex items-center justify-between text-gray-300 font-bold border border-gray-700">
                        <span>❌ 装備を外す</span>
                        <span class="text-xs text-gray-500">解除</span>
                    </button>

                    ${ownedList.length === 0 ? `
                        <div class="p-6 text-center text-xs text-gray-500 italic bg-black/40 rounded-2xl border border-gray-800">
                            装備アイテムを所持していません。<br>アーケードモードを3連勝して装備アイテムを入手しよう！
                        </div>
                    ` : ownedList.map(eId => {
                        const equip = EQUIPMENT_DB[eId];
                        if (!equip) return '';
                        const isEquippedByOther = gameState.inventory.find(m => m.equippedItemId === eId && m.instanceId !== instanceId);
                        
                        return `
                            <button onclick="equipItemToMonster('${instanceId}', '${eId}')" class="w-full bg-gray-800 hover:bg-gray-750 p-3.5 rounded-2xl flex flex-col text-left border border-gray-700 transition shadow group">
                                <div class="flex items-center justify-between w-full mb-1">
                                    <span class="font-bold text-sm text-yellow-300 flex items-center space-x-2">
                                        <span class="text-lg">${equip.icon}</span>
                                        <span>${equip.name}</span>
                                    </span>
                                    ${equip.onlineOnly ? '<span class="text-[9px] bg-cyan-950 text-cyan-300 border border-cyan-700 px-1.5 py-0.5 rounded font-bold">ONLINE</span>' : ''}
                                    ${isEquippedByOther ? `<span class="text-[10px] bg-red-950 text-red-300 border border-red-800 px-2 py-0.5 rounded font-bold">${isEquippedByOther.name}が装備中</span>` : `<span class="text-xs text-cyan-400 font-bold group-hover:underline">装備する</span>`}
                                </div>
                                <p class="text-[11px] text-gray-400 leading-normal">${equip.desc}</p>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
            showModal(`装備設定: ${targetMon.name}`, html, '🎒', closeModal);
        }

        function equipItemToMonster(instanceId, itemId) {
            playSound('buff');
            if (itemId) {
                gameState.inventory.forEach(m => {
                    if (m.equippedItemId === itemId) m.equippedItemId = null;
                });
            }
            const target = gameState.inventory.find(m => m.instanceId === instanceId);
            if (target) {
                target.equippedItemId = itemId;
            }
            saveGame();
            closeModal();
            renderParty();
        }

        // --- 図鑑画面 ---
        function renderPokedex() {
            stopBattleBGM();
            gameState.currentView = 'pokedex';
            const container = document.getElementById('app-container');
            const allBaseKeys = Object.keys(MONSTERS_DB).filter(k => !MONSTERS_DB[k].hidden);

            container.innerHTML = `
                <div class="w-full max-w-5xl px-4">
                    <div class="glass-card border border-indigo-500/30 rounded-3xl p-6 sm:p-10 shadow-2xl relative">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
                            <h2 class="text-2xl sm:text-3xl font-black text-white text-center w-full">モンスター図鑑・詳細</h2>
                            <div class="text-xs sm:text-sm text-gray-400 font-bold whitespace-nowrap">登録数: ${allBaseKeys.filter(k => gameState.inventory.some(m => m.baseId === k)).length}/${allBaseKeys.length}</div>

                                        <div class="w-24 h-24 sm:w-28 sm:h-28 flex-shrink-0 ${isOwned ? '' : 'opacity-40 grayscale'}">

                                        <div class="flex-grow w-full text-center md:text-left">
                                            <div class="flex flex-wrap items-center justify-center md:justify-between gap-2 mb-3">
                                                <div class="flex items-center space-x-3">
                                                    <span class="font-black text-xl ${isOwned ? (key === 'kamiDeYaiba' ? 'text-yellow-300' : 'text-white') : 'text-gray-500'}">${isOwned ? base.name : '？？？'}</span>
                                                    ${isOwned && base.title ? `<span class="text-[10px] bg-purple-900/60 border border-purple-500/50 text-purple-200 rounded-full px-2 py-0.5">${base.title}</span>` : ''}
                                                    <div class="flex gap-1">
                                                        ${base.element.map(elKey => {
                                                            const el = ELEMENTS[elKey];
                                                            return `<span class="text-xs px-2.5 py-0.5 rounded font-bold ${el.badge}">${el.name}タイプ</span>`;
                                                        }).join('')}
                                                    </div>
                                                </div>
                                                ${['mirudew','shigo','tsumi'].includes(key) ? `<span class="text-xs bg-yellow-500/20 text-yellow-300 border border-yellow-500 px-3 py-0.5 rounded-full font-black tracking-widest">カジノレア報酬</span>` : key === 'kamiDeYaiba' ? `<span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500 px-3 py-0.5 rounded-full font-black tracking-widest">アーケードレア報酬</span>` : key === 'jahibi' ? `<span class="text-xs bg-purple-500/20 text-purple-300 border border-purple-500 px-3 py-0.5 rounded-full font-black tracking-widest">カジュアルレア報酬</span>` : key === 'chibasin' ? `<span class="text-xs bg-cyan-500/20 text-cyan-300 border border-cyan-500 px-3 py-0.5 rounded-full font-black tracking-widest">イベントレア報酬</span>` : ''}
                                            </div>
                                            
                                            ${isOwned ? `
                                                <div class="text-xs text-gray-300 mb-3 bg-gray-950/60 p-3 rounded-xl border border-gray-800 text-left">
                                                    <span class="text-yellow-400 font-bold">特性【${base.ability.name}】:</span> <span class="text-gray-300">${base.ability.desc}</span>
                                                </div>
                                                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 text-center font-mono text-xs bg-black/40 p-3 rounded-xl border border-gray-800 mb-3">
                                                    <div><span class="text-gray-500 block text-[10px]">HP</span><span class="font-bold text-white">${base.hp}</span></div>
                                                    <div><span class="text-gray-500 block text-[10px]">攻撃</span><span class="font-bold text-white">${base.atk}</span></div>
                                                    <div><span class="text-gray-500 block text-[10px]">防御</span><span class="font-bold text-white">${base.def}</span></div>
                                                    <div><span class="text-gray-500 block text-[10px]">特攻</span><span class="font-bold text-white">${base.spa}</span></div>
                                                    <div><span class="text-gray-500 block text-[10px]">特防</span><span class="font-bold text-white">${base.spd}</span></div>
                                                    <div><span class="text-gray-500 block text-[10px]">素早</span><span class="font-bold text-white">${base.speed}</span></div>
                                                </div>
                                                <div class="mb-3 text-left">
                                                    <span class="text-xs text-gray-400 font-semibold block mb-1.5">覚える技:</span>
                                                    <div class="flex flex-wrap gap-2">
                                                        ${base.skillIds.map(sId => {
                                                            const s = SKILLS_DB[sId];
                                                            if(!s) return '';
                                                            const sEl = ELEMENTS[s.type] || ELEMENTS.normal;
                                                            return `<button onclick="showSkillDetail('${s.name}', '${s.type}', '${s.category}', ${s.power}, ${s.accuracy}, ${s.maxPp}, '${s.desc}')" class="text-xs ${sEl.button} px-3 py-1 rounded-xl font-bold transition shadow">${s.name}</button>`;

                                        </div>

                        </div>
                    </div>

            `;

        function showSkillDetail(name, typeKey, category, power, accuracy, pp, desc) {
            playSound('click');
            const catName = category === 'physical' ? '物理技' : category === 'special' ? '特殊技' : '変化技';
            const sEl = ELEMENTS[typeKey] || ELEMENTS.normal;
            const html = `
                <div class="text-left space-y-3 w-full bg-gray-950/60 p-4 rounded-2xl border border-gray-800">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold px-3 py-1 rounded-full ${sEl.badge}">${sEl.name}タイプ</span>
                        <span class="text-sm font-bold px-2.5 py-0.5 rounded bg-gray-800 text-yellow-300 border border-gray-700">${catName}</span>
                        <span class="text-xs text-gray-400 font-mono">CP(PP): ${pp}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs font-mono text-gray-300 bg-black/40 p-2.5 rounded-xl border border-gray-800">
                        <div>威力: <span class="font-bold text-white">${power > 0 && power !== 999 ? power : '-'}</span></div>
                        <div>命中率: <span class="font-bold text-white">${accuracy}%</span></div>
                    </div>
                    <p class="text-xs text-gray-300 leading-relaxed pt-1">${desc}</p>
                </div>
            `;
            showModal(`技情報: ${name}`, html, '📖', closeModal);
        }

        // 状態異常の説明文(ステータス確認画面で表示)
        const STATUS_INFO = {
            yakedo: { name: 'やけど', desc: 'ターン終わりに最大HPの1/16のダメージを受ける。与える攻撃技のダメージが1/2になる。' },
            reishou: { name: '冷笑', desc: '5%の確率で技が使えない。ターン終わりに自分の使った技のCPが1減る。' },
            nemuri: { name: 'ねむり', desc: '2ターンの間技が使えなくなる。終了後にねむり状態が解除される。' },
            panic: { name: 'パニック', desc: '1〜3ターンの間、1/3の確率で自分を攻撃してしまう。終了後にパニック状態が解除される。' },
            hirumi: { name: 'ひるみ', desc: 'そのターンの行動が1回できなくなる。終了後にひるみ状態が解除される。' },
            doku: { name: 'どく', desc: 'ターン終わりに最大HPの1/8のダメージを受ける。' },
            mahi: { name: 'まひ', desc: '12.5%の確率で技が使えない。素早さが1/2になる。' },
            akushyuu: { name: 'あくしゅう', desc: 'バトル上のくさ・どくタイプ以外はターン終わりに最大HPの1/16のダメージを受ける。くさ・どくタイプの攻撃が1.5倍になる。' },
            charging: { name: '溜め', desc: '技を出すために1ターン溜めている。次のターンで技を出し、終了後に溜め状態が解除される。' }
        };
        function showMonsterStatusDetail(monster) {
            playSound('click');
            const statusEmoji = [monster.status ? (STATUS_EMOJIS[monster.status] || monster.status) : '', ...(monster.volatileStatuses || []).map(x => STATUS_EMOJIS[x] || (x === 'akushyuu' ? '🤢' : x)), monster.chargingSkill ? '🪽溜め' : ''].filter(Boolean).join(' / ') || 'なし';
            const stageNames = { atk: '攻撃', def: '防御', spa: '特攻', spd: '特防', speed: '素早さ' };
            const stageHtml = Object.entries(monster.stages || {}).map(([key, value]) => `<span class="inline-block mr-2">${stageNames[key] || key}: ${value > 0 ? '+' : ''}${value} (${getStageMultiplier(value).toFixed(2)}倍)</span>`).join('');
            const equip = monster.equippedItemId ? EQUIPMENT_DB[monster.equippedItemId] : null;

        function startArcadeBattle() {
            const currentTrainer = arcadeState.trainers[arcadeState.currentStage - 1];

            const playerTeam = gameState.team.map(instId => {
                const original = gameState.inventory.find(m => m.instanceId === instId);
                return JSON.parse(JSON.stringify(original));
            });
            playerTeam.forEach(m => {
                m.hp = m.maxHp;
                m.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
                m.status = null;
                m.statusTurns = 0;
                m.volatileStatuses = [];
                m.turnsInBattle = 0;
                m.hasSturdied = false;
                if (m.ability?.name === '死後高速' && m.hasShigoSpeedBoost) m.speed /= 2;
                m.hasShigoSpeedBoost = false;
                m.isSkipTurn = false;
                m.isProtected = false;
                m.protectCount = 0;
                m.isFirstTurn = true;
                m.chargingSkill = null;
                m.lockedMoveIndex = null;
                m.abilityAtkMultiplier = 1;
                m.abilityDefMultiplier = 1;
                m.hasPizaPanActivated = false;
                m.hasDisinfected = false;
                m.lastMoveFailed = false;
            });
            playerTeam.forEach(resetMonsterForBattle);

            const stageBuff = (arcadeState.currentStage - 1) * 0.1;
            const cpuTeam = currentTrainer.teamIds.map(baseId => {
                const cpuMon = createMonsterInstance(baseId);
                cpuMon.hp = Math.floor(cpuMon.hp * (1 + stageBuff));
                cpuMon.maxHp = cpuMon.hp;
                cpuMon.atk = Math.floor(cpuMon.atk * (1 + stageBuff));
                cpuMon.def = Math.floor(cpuMon.def * (1 + stageBuff));
                cpuMon.spa = Math.floor(cpuMon.spa * (1 + stageBuff));
                cpuMon.spd = Math.floor(cpuMon.spd * (1 + stageBuff));
                cpuMon.speed = Math.floor(cpuMon.speed * (1 + stageBuff));
                cpuMon.isFirstTurn = true;
                return cpuMon;
            });

            battleState = {
                mode: 'arcade',
                arcadeTrainerId: currentTrainer.id,
                arcadeStyle: currentTrainer.style,
                playerTeam: playerTeam,
                playerIndex: 0,
                cpuTeam: cpuTeam,
                cpuIndex: 0,
                log: [`ARCADE BATTLE ${arcadeState.currentStage}: トレーナー 【${currentTrainer.name}】 との勝負！`, `戦闘スタイル：【${currentTrainer.style}】`],
                field: { stealthCutPlayer: false, stealthCutCpu: false, akuShuuTurns: 0, oikazePlayerTurns: 0, oikazeCpuTurns: 0 },
                turnPhase: 'processing'
            };

            playBattleBGM(); // 今回の戦闘モードが決まった後にBGMを選ぶ
            checkBattleStartAbilities();
            renderBattleScreen();

            setTimeout(() => {
                processStartOfBattleTurn();
            }, 800);
        }
