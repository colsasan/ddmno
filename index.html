                                </div>
                            `}
                        </div>

                    </div>
                </div>
            `;
            const logBox = document.getElementById('battle-log-box');
            if(logBox) logBox.scrollTop = logBox.scrollHeight;

            particleSystem.init('particle-canvas');
        }

        function processStartOfBattleTurn() {
            battleState.turnPhase = 'menu';
            renderBattleScreen();
        }

        function showSwitchMenu() {
            if (battleState.turnPhase === 'processing') return;
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cHasFreestyle = isAbilitySuppressor(cMon) || isAbilitySuppressor(pMon);

            // ブラック戦は特性による交代封じ判定の対象外。プレイヤーの手動交代を常に許可する。
            if (battleState.mode !== 'black' && !cHasFreestyle && cMon.ability.name === 'だる絡み') {
                showModal('交代不可', `相手の【${cMon.name}】の特性「だる絡み」により、ポケモンを交代することができない！`, '⚠️', closeModal);
                return;
            }

            const availableMonsters = battleState.playerTeam.map((m, idx) => ({ m, idx })).filter(item => item.idx !== battleState.playerIndex && item.m.hp > 0);
            if (availableMonsters.length === 0) {
                showModal('交代不可', '控えに戦闘可能なモンスターがいません！', '⚠️', closeModal);
                return;
            }
            const html = `
                <div class="space-y-3 w-full">
                    ${availableMonsters.map(item => `
                        <button onclick="playSound('click'); closeModal(); ${battleState.mode === 'online' ? `sendOnlineAction('switch', ${item.idx})` : `executeSwitch(${item.idx})`}" class="w-full bg-gray-800/90 hover:bg-gray-700 p-3.5 rounded-2xl flex items-center justify-between text-white font-bold border border-gray-700 shadow transition group">
                            <div class="flex items-center space-x-3 overflow-hidden">
                                <span class="text-base font-black truncate">${item.m.name}</span>
                                <div class="flex gap-1">
                                    ${item.m.element.map(elKey => {
                                        const el = ELEMENTS[elKey];
                                        return `<span class="text-[9px] px-2 py-0.5 rounded font-bold ${el.badge}">${el.name}</span>`;
                                    }).join('')}
                                </div>
                            </div>
                            <span class="text-xs text-emerald-400 font-mono font-bold whitespace-nowrap">HP:${item.m.hp}/${item.m.maxHp}</span>
                        </button>
                    `).join('')}
                </div>
            `;
            showModal('手持ちから交代', html, '🔄', closeModal);
        }

        function executeSwitch(newIdx) {
            if (!battleState || battleState.turnPhase === 'gameover') return;
            if (!Number.isInteger(Number(newIdx)) || !battleState.playerTeam[Number(newIdx)] || Number(newIdx) === battleState.playerIndex || battleState.playerTeam[Number(newIdx)].hp <= 0) return;
            // ブラック戦では「だる絡み」等の交代封じを適用せず、控えが生存していれば交代可能。
            if (battleState.mode !== 'black') {
                const activeEnemy = battleState.cpuTeam[battleState.cpuIndex];
                const activePlayer = battleState.playerTeam[battleState.playerIndex];
                const freestyle = isAbilitySuppressor(activeEnemy) || isAbilitySuppressor(activePlayer);
                if (!freestyle && activeEnemy?.ability?.name === 'だる絡み') return;
            }
            newIdx = Number(newIdx);
            battleState.turnPhase = 'processing';
            const prevMon = battleState.playerTeam[battleState.playerIndex];
            prevMon.lockedMoveIndex = null;

            const nextMon = battleState.playerTeam[newIdx];
            battleState.playerIndex = newIdx;
            nextMon.isFirstTurn = true;
            nextMon.chargingSkill = null;
            nextMon.isReleasingCharge = false;
            nextMon.lockedMoveIndex = null;
            nextMon.abilityAtkMultiplier = 1;
            nextMon.abilityDefMultiplier = 1;
            nextMon.isSkipTurn = false;
            if (battleState.field.akuShuuTurns > 0) nextMon.status = 'akushyuu';
            if (nextMon.status === 'hirumi') nextMon.status = null;

            triggerOnEntryAbility(nextMon, true);

            if (battleState.field.stealthCutPlayer) {
                const isFuuyuu = nextMon.ability.name === 'ふゆう';
                const cMon = battleState.cpuTeam[battleState.cpuIndex];
                const hasFreestyle = isAbilitySuppressor(cMon);
                if (!isFuuyuu || hasFreestyle) {
                    const multi = getTypeMultiplier('normal', nextMon.element);
                    const cutDmg = Math.max(1, Math.floor((nextMon.maxHp / 8) * multi));
                    nextMon.hp = Math.max(0, nextMon.hp - cutDmg);
                    battleState.log.push(`[ステルスカット] 交代して出てきた ${nextMon.name} に ${cutDmg} のダメージ！`);
                }
            }

            playSound('buff');
            battleState.log.push(`[交代] いけっ！ ${nextMon.name}！`);
            renderBattleScreen();

            setTimeout(() => {
                runCpuTurnAfterSwitch();
            }, 1000);
        }

        function runCpuTurnAfterSwitch() {
            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cpuSkill = selectSmartCpuSkill(cMon, pMon);
            if(cpuSkill.pp > 0) cpuSkill.pp--;

            runAction(cMon, pMon, cpuSkill, false, null, () => {
                checkBattleEnd();
                if (battleState.turnPhase !== 'gameover') {
                    battleState.turnPhase = 'menu';
                    renderBattleScreen();
                }
            });
        }

        function selectSmartCpuSkill(cMon, pMon) {
            if (cMon.chargingSkill) return cMon.chargingSkill;

            let validSkills = cMon.skills.filter(s => s.pp > 0);
            validSkills = validSkills.filter(s => !(s.name === 'ねこだまし' && !cMon.isFirstTurn));

            if (cMon.equippedItemId === 'wing_kakera' && cMon.lockedMoveIndex !== null) {
                validSkills = [cMon.skills[cMon.lockedMoveIndex]];
            }

            if (validSkills.length === 0) {
                return { name: 'わるあがき', type: 'normal', category: 'physical', power: 50, accuracy: 100, maxPp: 1 };
            }

            for (let skill of validSkills) {
                if (skill.category !== 'status' && skill.power > 0) {
                    const multi = getTypeMultiplier(skill.type, pMon.element);
                    if (multi > 1) return skill;
                }
            }

            const hpRatio = cMon.hp / cMon.maxHp;
            if (hpRatio < 0.3) {
                const healSkill = validSkills.find(s => s.name === 'じこさいせい' || s.name === 'はねやすめ');
                if (healSkill) return healSkill;
            }

            const highPowerSkills = validSkills.filter(s => s.category !== 'status' && s.power >= 80);
            if (highPowerSkills.length > 0) {
                return highPowerSkills[Math.floor(Math.random() * highPowerSkills.length)];
            }

            return validSkills[Math.floor(Math.random() * validSkills.length)];
        }

        function executePlayerTurn(skillIdx) {
            if (battleState.turnPhase === 'processing') return;
            battleState.turnPhase = 'processing';

            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];

            if (pMon.equippedItemId === 'wing_kakera') {
                pMon.lockedMoveIndex = skillIdx;
            }

            let skill = pMon.chargingSkill || pMon.skills[skillIdx];
            if (!pMon.chargingSkill && skill.pp <= 0) {
                showModal('CP切れ', 'この技のCPが切れています！', '⚠️', closeModal);
                battleState.turnPhase = 'menu';
                renderBattleScreen();
                return;
            }
            if (!pMon.chargingSkill) skill.pp--;

            const cpuSkill = selectSmartCpuSkill(cMon, pMon);
            if(cpuSkill.pp > 0 && !cMon.chargingSkill) cpuSkill.pp--;

            let pSpeed = pMon.speed * getStageMultiplier(pMon.stages.speed);
            let cSpeed = cMon.speed * getStageMultiplier(cMon.stages.speed);
            
            if (pMon.equippedItemId === 'wing_kakera') pSpeed *= 1.5;
            if (cMon.equippedItemId === 'wing_kakera') cSpeed *= 1.5;
            if (pMon.name === 'マエザワン' && pMon.equippedItemId === 'katsura') pSpeed *= 2;
            if (cMon.name === 'マエザワン' && cMon.equippedItemId === 'katsura') cSpeed *= 2;

            if (pMon.status === 'mahi') pSpeed *= 0.5;
            if (cMon.status === 'mahi') cSpeed *= 0.5;
            if (battleState.field.oikazePlayerTurns > 0) pSpeed *= 2;
            if (battleState.field.oikazeCpuTurns > 0) cSpeed *= 2;

            function getPriority(mon, s) {
                if (mon.ability.name === '絶対命令' && mon.hp === mon.maxHp && s.type === 'ghost') return 1;
                if (s.name === 'ねこだまし' || s.name === 'はやてがえし') return 3;
                if (s.name === 'しんそく') return 2;
                if (s.name === 'アクアジェット' || s.name === 'しんくうは' || s.name === 'マッハパンチ') return 1;
                return 0;
            }

            let pPriority = getPriority(pMon, skill);
            let cPriority = getPriority(cMon, cpuSkill);

            const cHasFreestyle = isAbilitySuppressor(cMon) || isAbilitySuppressor(pMon);
            if (!cHasFreestyle) {
                if (pMon.ability.name === '安心感') pPriority = 0;
                if (cMon.ability.name === '安心感') cPriority = 0;
            }

            let playerFirst = (pPriority > cPriority) || (pPriority === cPriority && pSpeed >= cSpeed);

            if (pPriority === cPriority) {
                if (pMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = true;
                    battleState.log.push(`[装備発動: ${pMon.name}のDOPE] 先制行動！`);
                } else if (cMon.equippedItemId === 'nope' && Math.random() < 0.3) {
                    playerFirst = false;
                    battleState.log.push(`[装備発動: ${cMon.name}のDOPE] 先制行動！`);
                }
            }

            if (!cHasFreestyle) {
                if (pMon.ability.name === '最風' && Math.random() < 0.2) {
                    playerFirst = true;
                    battleState.log.push(`[特性発動: ${pMon.name}の最風] 20%の確率で先制する！`);
                }
                if (cMon.ability.name === '最風' && Math.random() < 0.2) {
                    playerFirst = false;
                    battleState.log.push(`[特性発動: ${cMon.name}の最風] 20%の確率で先制する！`);
                }
            }

            if (playerFirst) {
                runAction(battleState.playerTeam[battleState.playerIndex], battleState.cpuTeam[battleState.cpuIndex], skill, true, cpuSkill, () => {
                    checkBattleEnd();
                    if (battleState.turnPhase !== 'gameover' && cMon.hp > 0 && pMon.hp > 0) {
                        setTimeout(() => {
                            runAction(battleState.cpuTeam[battleState.cpuIndex], battleState.playerTeam[battleState.playerIndex], cpuSkill, false, skill, () => {
                                checkBattleEnd();
                                if (battleState.turnPhase !== 'gameover') {
                                    processTurnEndEffects(() => {
                                        checkBattleEnd();
                                        if (battleState.turnPhase !== 'gameover') {
                                            pMon.isFirstTurn = false;
                                            cMon.isFirstTurn = false;
                                            battleState.turnPhase = 'menu';
                                            renderBattleScreen();
                                        }
                                    });
                                }
                            });
                        }, 1000);
                    } else if (battleState.turnPhase !== 'gameover') {
                        pMon.isFirstTurn = false;
                        cMon.isFirstTurn = false;
                        battleState.turnPhase = 'menu';
                        renderBattleScreen();
                    }
                });
            } else {
                runAction(cMon, pMon, cpuSkill, false, skill, () => {
                    checkBattleEnd();
                    if (battleState.turnPhase !== 'gameover' && pMon.hp > 0 && cMon.hp > 0) {
                        setTimeout(() => {
                            runAction(pMon, cMon, skill, true, cpuSkill, () => {
                                checkBattleEnd();
                                if (battleState.turnPhase !== 'gameover') {
                                    processTurnEndEffects(() => {
                                        checkBattleEnd();
                                        if (battleState.turnPhase !== 'gameover') {
                                            pMon.isFirstTurn = false;
                                            cMon.isFirstTurn = false;
                                            battleState.turnPhase = 'menu';
                                            renderBattleScreen();
                                        }
                                    });
                                }
                            });
                        }, 1000);
                    } else if (battleState.turnPhase !== 'gameover') {
                        pMon.isFirstTurn = false;
                        cMon.isFirstTurn = false;
                        battleState.turnPhase = 'menu';
                        renderBattleScreen();
                        if (pMon.hp <= 0 && battleState.playerTeam.some((mon, idx) => idx !== battleState.playerIndex && mon.hp > 0)) {
                            setTimeout(() => showSwitchMenu(), 250);
                        }
                    }
                });
            }
        }

        function processTurnEndEffects(callback) {
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];

            if (pMon.hp > 0 && pMon.equippedItemId === 'tabenokoshi' && pMon.hp < pMon.maxHp) {
                const heal = Math.max(1, Math.floor(pMon.maxHp / 16));
                pMon.hp = Math.min(pMon.maxHp, pMon.hp + heal);
                battleState.log.push(`[装備発動: ${pMon.name}のたべのこし] HPが ${heal} 回復した！`);
            }
            if (cMon.hp > 0 && cMon.equippedItemId === 'tabenokoshi' && cMon.hp < cMon.maxHp) {
                const heal = Math.max(1, Math.floor(cMon.maxHp / 16));
                cMon.hp = Math.min(cMon.maxHp, cMon.hp + heal);
                battleState.log.push(`[装備発動: ${cMon.name}のたべのこし] HPが ${heal} 回復した！`);
            }

            [pMon, cMon].forEach(mon => {
                if (!mon) return;
                if (mon.hp > 0 && mon.status === 'reishou' && mon.lastMoveUsedThisTurn) {
                    const usedMove = mon.lastMoveUsedThisTurn;
                    if (typeof usedMove.pp === 'number' && usedMove.pp > 0) {
                        usedMove.pp = Math.max(0, usedMove.pp - 1);
                        battleState.log.push(`[冷笑状態] ${mon.name}の${usedMove.name}のCPが追加で1減った！`);
                    }
                }
                mon.lastMoveUsedThisTurn = null;
                if (mon.hp <= 0) return;
                if (mon.status === 'yakedo' || mon.status === 'doku') {
                    const fraction = mon.status === 'yakedo' ? 16 : 8;
                    const damage = Math.max(1, Math.floor(mon.maxHp / fraction));
                    mon.hp = Math.max(0, mon.hp - damage);
                    battleState.log.push(`[${mon.status === 'yakedo' ? 'やけど' : 'どく'}] ${mon.name}は${damage}のダメージを受けた！`);
                }
                if (mon.hp > 0 && battleState.field.akuShuuTurns > 0 && !mon.element.includes('kusa') && !mon.element.includes('doku')) {
                    const akuDamage = Math.max(1, Math.floor(mon.maxHp / 16));
                    mon.hp = Math.max(0, mon.hp - akuDamage);
                    battleState.log.push(`[あくしゅう] ${mon.name}は${akuDamage}のダメージを受けた！`);
                }
                if (mon.hp > 0 && mon.equippedItemId === 'pizapan' && !mon.hasPizaPanActivated && mon.hp <= mon.maxHp / 2) {
                    mon.hasPizaPanActivated = true;
                    const heal = Math.max(1, Math.floor(mon.maxHp / 4));
                    mon.hp = Math.min(mon.maxHp, mon.hp + heal);
                    battleState.log.push(`[装備発動: ${mon.name}のピザパン] HPが${heal}回復した！`);
                }
                if (mon.hp > 0 && mon.equippedItemId === 'shoudokueki' && mon.status) {
                    mon.status = null;
                    mon.statusTurns = 0;
                    mon.hasDisinfected = true;
                    mon.equippedItemId = null;
                    battleState.log.push(`[装備発動: ${mon.name}の消毒液] 状態異常を全て回復した！`);
                }
            });
            if (battleState.field.akuShuuTurns > 0) {
                battleState.field.akuShuuTurns--;
                if (battleState.field.akuShuuTurns === 0) {
                    battleState.log.push('あたりのあくしゅう状態が消えた！');
                    [...battleState.playerTeam, ...battleState.cpuTeam].forEach(mon => { if (mon) mon.volatileStatuses = (mon.volatileStatuses || []).filter(x => x !== 'akushyuu'); });
                }
            }

            renderBattleScreen();
            setTimeout(callback, 500);
        }

        function triggerParticleEffect(spriteId, particleType) {
            const targetEl = document.getElementById(spriteId);
            const canvasEl = document.getElementById('particle-canvas');
            if (!targetEl || !canvasEl) return;

            const tRect = targetEl.getBoundingClientRect();
            const cRect = canvasEl.getBoundingClientRect();

            const x = (tRect.left + tRect.width / 2) - cRect.left;
            const y = (tRect.top + tRect.height / 2) - cRect.top;

            particleSystem.spawn(x, y, particleType, 45);
        }

        function runAction(attacker, defender, skill, isPlayer, opponentSkill, callback) {
            attacker.isProtected = false;
            if (attacker.chargingSkill) skill = attacker.chargingSkill;
            if (skill.name !== 'まもる') attacker.protectCount = 0;

            if (attacker.ability.name === 'マスク換え' && !attacker.hasTransformedMask) {
                attacker.hasTransformedMask = true;
                attacker.element = [skill.type];
                battleState.log.push(`[特性発動: ${attacker.name}のマスク換え] タイプが【${ELEMENTS[skill.type].name}】に変化した！`);
            }

            if (attacker.isSkipTurn) {
                attacker.isSkipTurn = false;
                battleState.log.push(`${attacker.name}はピザ食いの反動で動けない！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            if (attacker.equippedItemId === 'shoudokueki' && attacker.status && !attacker.hasDisinfected) {
                attacker.status = null;
                attacker.statusTurns = 0;
                attacker.hasDisinfected = true;
                attacker.equippedItemId = null;
                battleState.log.push(`[装備発動: ${attacker.name}の消毒液] 状態異常を全て回復した！`);
            }

            if (attacker.ability.name === '横揺れ') {
                attacker.stages.speed = Math.min(3, attacker.stages.speed + 1);
                battleState.log.push(`[特性発動: ${attacker.name}の横揺れ] 素早さが1段階上がった！`);
            }

            if ((attacker.volatileStatuses || []).includes('hirumi') || attacker.status === 'hirumi') {
                attacker.volatileStatuses = (attacker.volatileStatuses || []).filter(x => x !== 'hirumi');
                if (attacker.status === 'hirumi') attacker.status = null;
                battleState.log.push(`${attacker.name}はひるんで動けない！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            if (attacker.status === 'nemuri') {
                attacker.statusTurns = (attacker.statusTurns || 0) + 1;
                if (attacker.statusTurns >= 2) {
                    attacker.status = null;
                    attacker.statusTurns = 0;
                    battleState.log.push(`${attacker.name}は目を覚ました！`);
                } else {
                    battleState.log.push(`${attacker.name}はぐっすり眠っている！`);
                    renderBattleScreen();
                    setTimeout(callback, 1000);
                    return;
                }
            }

            if (attacker.status === 'mahi' && Math.random() < 0.125) {
                battleState.log.push(`${attacker.name}は身体が痺れて動けない！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            if (attacker.status === 'panic') {
                attacker.statusTurns = (attacker.statusTurns || 0) + 1;
                if (attacker.statusTurns > 3) {
                    attacker.status = null;
                    attacker.statusTurns = 0;
                    battleState.log.push(`${attacker.name}のパニックが治まった！`);
                } else if (Math.random() < (1 / 3)) {
                    const selfDmg = Math.max(1, Math.floor(attacker.maxHp / 6));
                    attacker.hp = Math.max(0, attacker.hp - selfDmg);
                    playSound('hit');
                    battleState.log.push(`${attacker.name}はパニックで自分を攻撃してしまった！ (${selfDmg}ダメージ)`);
                    renderBattleScreen();
                    setTimeout(callback, 1000);
                    return;
                }
            }

            if (attacker.status === 'reishou' && Math.random() < 0.05) {
                battleState.log.push(`${attacker.name}は冷笑状態のため技が出せない！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            if (skill.name === 'ねこだまし' && !attacker.isFirstTurn) {
                battleState.log.push(`${skill.name} は登場して最初に出す技ではないため失敗した！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            if (skill.name === 'はやてがえし') {
                const oppPriority = opponentSkill ? ((opponentSkill.name === 'しんそく' ? 2 : (opponentSkill.name === 'ねこだまし' || opponentSkill.name === 'はやてがえし') ? 3 : (opponentSkill.name === 'アクアジェット' || opponentSkill.name === 'しんくうは' || opponentSkill.name === 'マッハパンチ') ? 1 : 0)) : 0;
                if (oppPriority <= 0) {
                    battleState.log.push(`${skill.name} は相手が先制技を使っていないため失敗した！`);
                    renderBattleScreen();
                    setTimeout(callback, 1000);
                    return;
                }
            }

            if (attacker.chargingSkill) {
                const execSkill = attacker.chargingSkill;
                attacker.chargingSkill = null;
                attacker.isReleasingCharge = true;
                battleState.log.push(`${attacker.name}は溜めていた力を解き放った！`);
                executeResolvedSkill(attacker, defender, execSkill, isPlayer, opponentSkill, callback);
                return;
            }
            executeResolvedSkill(attacker, defender, skill, isPlayer, opponentSkill, callback);
        }

        function performPivotSwitch(isPlayer) {
            const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
            const currentIndex = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
            const nextIndex = team.findIndex((mon, idx) => idx !== currentIndex && mon && mon.hp > 0);
            if (nextIndex < 0) return false;
            const outgoing = team[currentIndex];
            if (outgoing) outgoing.lockedMoveIndex = null;
            const nextMon = team[nextIndex];
            if (isPlayer) battleState.playerIndex = nextIndex;
            else battleState.cpuIndex = nextIndex;
            nextMon.isFirstTurn = true;
            nextMon.chargingSkill = null;
            nextMon.isReleasingCharge = false;
            nextMon.lockedMoveIndex = null;
            nextMon.isSkipTurn = false;
            if (battleState.field.akuShuuTurns > 0) nextMon.status = 'akushyuu';
            if (nextMon.status === 'hirumi') nextMon.status = null;
            triggerOnEntryAbility(nextMon, isPlayer);
            const hazardActive = isPlayer ? battleState.field.stealthCutPlayer : battleState.field.stealthCutCpu;
            const enemy = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
            const enemyFreestyle = isAbilitySuppressor(enemy);
            if (hazardActive && (nextMon.ability.name !== 'ふゆう' || enemyFreestyle)) {
                const hazardDamage = Math.max(1, Math.floor((nextMon.maxHp / 8) * getTypeMultiplier('normal', nextMon.element)));
                nextMon.hp = Math.max(0, nextMon.hp - hazardDamage);
                battleState.log.push(`[ステルスカット] ${nextMon.name}に${hazardDamage}のダメージ！`);
            }
            battleState.log.push(`[交代技] ${outgoing.name}は戻り、${nextMon.name}が戦闘に出た！`);
            return true;
        }

        function applyBinjoFromStageChanges(sourceMon, sourceIsPlayer, stagesBefore) {
            if (!sourceMon || !stagesBefore || !battleState) return;
            const targetTeam = sourceIsPlayer ? battleState.cpuTeam : battleState.playerTeam;
            const targetIndex = sourceIsPlayer ? battleState.cpuIndex : battleState.playerIndex;
            const copyMon = targetTeam && targetTeam[targetIndex];
            if (!copyMon || copyMon.hp <= 0 || copyMon.ability?.name !== 'びんじょう') return;
            const statNames = { atk: '攻撃', def: '防御', spa: '特攻', spd: '特防', speed: '素早さ' };
            const copied = [];
            Object.keys(statNames).forEach(stat => {
                const gained = Math.max(0, (sourceMon.stages?.[stat] || 0) - (stagesBefore[stat] || 0));
                if (gained > 0) {
                    const oldStage = copyMon.stages[stat] || 0;
                    const nextStage = Math.min(3, oldStage + gained);
                    const actualGain = nextStage - oldStage;
                    if (actualGain > 0) {
                        copyMon.stages[stat] = nextStage;
                        copied.push(`${statNames[stat]}+${actualGain}`);
                    }
                }
            });
            if (copied.length) battleState.log.push(`[特性発動: ${copyMon.name}のびんじょう] 相手の能力上昇に便乗！ ${copied.join('・')}！`);
        }

        function showBattleSkillPresentation(skill, attackerSpriteId, targetSpriteId) {
            const power = Number(skill && skill.power) || 0;
            const rank = power >= 130 ? 4 : power >= 90 ? 3 : power >= 60 ? 2 : 1;
            const labels = { 1: 'CHANCE', 2: 'FEVER', 3: '激熱', 4: 'ULTIMATE FEVER' };
            const colors = { honoo:'#ff5a1f', mizu:'#22d3ee', kusa:'#4ade80', denki:'#fde047', normal:'#f8fafc', kakuto:'#fb7185', aku:'#c084fc', doku:'#e879f9', jimen:'#fbbf24', hikou:'#7dd3fc', ghost:'#a78bfa' };
            const color = colors[skill?.type] || '#f8fafc';
            const root = document.createElement('div');
            root.className = 'battle-fx-overlay';
            root.style.setProperty('--fx-color', color);
            const intensity = rank === 4 ? 'fx-flash fx-ultimate' : 'fx-flash';
            root.innerHTML = `<div class="${intensity}"></div>${rank >= 2 ? '<div class="fx-rays"></div><div class="fx-burst"></div>' : ''}<div class="fx-title">${String(skill?.name || 'ATTACK').replace(/[<>]/g, '')}</div><div class="fx-rank">${labels[rank]}</div>`;
            document.body.appendChild(root);
            const app = document.getElementById('app-container');
            if (app && rank >= 2) {
                app.classList.remove('battle-shake');
                void app.offsetWidth;
                app.classList.add('battle-shake');
                setTimeout(() => app.classList.remove('battle-shake'), 460);
            }
            if (rank >= 3) {
                root.style.background = 'radial-gradient(circle at center, transparent 18%, rgba(0,0,0,.62) 100%)';
            }
            if (rank === 4) {
                const flash = root.querySelector('.fx-flash');
                if (flash) flash.style.background = 'linear-gradient(120deg,rgba(255,0,120,.72),rgba(255,210,0,.72),rgba(0,220,255,.72),rgba(180,80,255,.72))';
            }
            setTimeout(() => root.remove(), 1120);
        }

        function showBattleDamageNumber(targetSpriteId, damage) {
            if (!(damage > 0)) return;
            const target = document.getElementById(targetSpriteId);
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const pop = document.createElement('div');
            pop.className = 'battle-damage-pop';
            pop.textContent = `-${Math.floor(damage)}`;
            pop.style.left = `${rect.left + rect.width / 2}px`;
            pop.style.top = `${rect.top + rect.height * .2}px`;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        function executeResolvedSkill(attacker, defender, skill, isPlayer, opponentSkill, callback) {
            attacker.lastMoveUsedThisTurn = skill;
            const defenderHpBeforeMove = defender.hp;
            const attackerStagesBefore = { ...attacker.stages };
            const defenderStagesBefore = { ...defender.stages };
            battleState.log.push(`${attacker.name}の ${skill.name}！`);

            const targetSpriteId = isPlayer ? 'cpu-sprite' : 'player-sprite';
            const attackerSpriteId = isPlayer ? 'player-sprite' : 'cpu-sprite';

            let animClass = 'effect-normal';
            if (skill.type === 'honoo') { playSound('honoo'); animClass = 'effect-honoo'; }
            else if (skill.type === 'mizu') { playSound('mizu'); animClass = 'effect-mizu'; }
            else if (skill.type === 'kusa') { playSound('kusa'); animClass = 'effect-kusa'; }
            else if (skill.type === 'denki') { playSound('denki'); animClass = 'effect-denki'; }
            else if (skill.type === 'ghost') { playSound('ghost'); animClass = 'effect-ghost'; }
            else if (skill.type === 'normal') { playSound('hit'); animClass = 'effect-normal'; }
            else if (skill.type === 'kakuto') { playSound('hit'); animClass = 'effect-kakuto'; }
            else if (skill.type === 'aku') { playSound('hit'); animClass = 'effect-aku'; }
            else if (skill.type === 'doku') { playSound('hit'); animClass = 'effect-doku'; }
            else if (skill.type === 'jimen') { playSound('hit'); animClass = 'effect-jimen'; }
            else if (skill.type === 'hikou') { playSound('mizu'); animClass = 'effect-hikou'; }

            const el = document.getElementById(attackerSpriteId);
            if(el) {
                el.classList.add(animClass);
                setTimeout(() => el.classList.remove(animClass), 600);
            }
            // 技威力を参照するだけの演出ランク。威力・命中・乱数・処理順は変更しない。
            showBattleSkillPresentation(skill, attackerSpriteId, targetSpriteId);

            if (skill.category === 'status' && (skill.name.includes('じこさいせい') || skill.name.includes('はねやすめ') || skill.name.includes('リフレッシュ'))) {
                playSound('heal');
                triggerParticleEffect(attackerSpriteId, 'heal');
            } else if (skill.category === 'status') {
                playSound('buff');
                triggerParticleEffect(attackerSpriteId, 'buff');
            } else {
                triggerParticleEffect(targetSpriteId, skill.type);
                const targetEl = document.getElementById(targetSpriteId);
                if (targetEl) {
                    targetEl.classList.add('shake-anim');
                    setTimeout(() => targetEl.classList.remove('shake-anim'), 500);
                }
            }

            if (skill.name === 'ゴッドバード' && !attacker.isReleasingCharge) {
                attacker.chargingSkill = skill;
                battleState.log.push(`${attacker.name}は光り輝く羽を溜めている！（溜め状態）`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }
            attacker.isReleasingCharge = false;

            if (defender.isProtected && skill.category !== 'status') {
                battleState.log.push(`${defender.name}はまもるで攻撃を防いだ！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            if (Math.random() * 100 > skill.accuracy) {
                battleState.log.push(`しかし ${skill.name} は外れた！`);
                if (skill.name === 'かかとおとし' || skill.name === 'サンダーダイブ') {
                    const failDmg = Math.floor(attacker.maxHp / (skill.name === 'サンダーダイブ' ? 2 : 3));
                    attacker.hp = Math.max(0, attacker.hp - failDmg);
                    battleState.log.push(`技を外した反動で ${attacker.name} は ${failDmg} のダメージを受けた！`);
                }
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            const cMon = battleState.cpuTeam[battleState.cpuIndex];
            const hasFreestyle = isAbilitySuppressor(cMon) || attacker.ability.name === 'フリースタイル' || defender.ability.name === 'フリースタイル';

            if (!hasFreestyle && attacker.ability.name !== 'マイクラスルーム' && skill.category === 'status' && defender.ability.name === 'ツバサボディ') {
                battleState.log.push(`[特性発動: ${defender.name}のツバサボディ] 変化技を完全に無効化した！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            if (!hasFreestyle && attacker.ability.name !== 'マイクラスルーム' && defender.ability.name === 'バスケライフ' && skill.type !== 'kakuto' && skill.category !== 'status') {
                battleState.log.push(`[特性発動: ${defender.name}のバスケライフ] かくとうタイプ以外の技を無効化した！`);
                renderBattleScreen();
                setTimeout(callback, 1000);
                return;
            }

            let damageMultiplier = 1.0;
            if (skill.category !== 'status' && attacker.equippedItemId === 'kanshakudama') {
                damageMultiplier *= 1.3;
                const selfDmg = Math.max(1, Math.floor(attacker.maxHp / 10));
                attacker.hp = Math.max(0, attacker.hp - selfDmg);
                battleState.log.push(`[装備発動: ${attacker.name}の癇癪玉] 威力1.3倍だが、自傷ダメージでHPが ${selfDmg} 減少！`);
            }

            if (skill.category === 'status') {
                if (skill.name === 'まもる') {
                    const protectChance = (attacker.protectCount || 0) > 0 ? (1 / 3) : 1;
                    if (Math.random() < protectChance) {
                        attacker.isProtected = true;
                        attacker.protectCount = (attacker.protectCount || 0) + 1;
                        battleState.log.push(`${attacker.name}は身を守る態勢に入った！`);
                    } else {
                        attacker.protectCount = 0;
                        battleState.log.push(`${attacker.name}はまもるに失敗した！`);
                    }
                } else if (skill.name === 'とばす') {
                    const enemyTeamArr = isPlayer ? battleState.cpuTeam : battleState.playerTeam;
                    const aliveIndexes = enemyTeamArr.map((m, idx) => idx).filter(idx => idx !== (isPlayer ? battleState.cpuIndex : battleState.playerIndex) && enemyTeamArr[idx].hp > 0);
                    if (aliveIndexes.length > 0) {
                        const randTarget = aliveIndexes[Math.floor(Math.random() * aliveIndexes.length)];
                        if (isPlayer) battleState.cpuIndex = randTarget;
                        else battleState.playerIndex = randTarget;
                        triggerOnEntryAbility(enemyTeamArr[randTarget], !isPlayer);
                        battleState.log.push(`とばされて ${enemyTeamArr[randTarget].name} が引っ張り出された！`);
                    } else {
                        battleState.log.push(`しかし控えがいないため失敗した！`);
                    }
                } else if (skill.name === 'あくび') {
                    defender.status = 'nemuri';
                    defender.statusTurns = 0;
                    battleState.log.push(`${defender.name}はねむり状態になった！`);
                } else if (skill.name === 'じこさいせい' || skill.name === 'はねやすめ') {
                    const heal = Math.floor(attacker.maxHp / 2);
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                    battleState.log.push(`${attacker.name}のHPが回復した！`);
                } else if (skill.name === 'はねる') {
                    const heal = Math.max(1, Math.floor(attacker.maxHp / 6));
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                    battleState.log.push(`${attacker.name}ははねてHPが${heal}回復した！`);
                } else if (skill.name === 'つるぎのまい') {
                    attacker.stages.atk = Math.min(3, attacker.stages.atk + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の攻撃が1段階上がった！`);
                } else if (skill.name === 'てっぺき') {
                    attacker.stages.def = Math.min(3, attacker.stages.def + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の防御が1段階上がった！`);
                } else if (skill.name === 'ビルドアップ') {
                    attacker.stages.atk = Math.min(3, attacker.stages.atk + 1);
                    attacker.stages.def = Math.min(3, attacker.stages.def + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の攻撃と防御が1段階上がった！`);
                } else if (skill.name === 'いやなおと') {
                    defender.stages.def = Math.max(-3, defender.stages.def - 1);
                    battleState.log.push(`[ステータス変動] ${defender.name}の防御が1段階下がった！`);
                } else if (skill.name === 'うそなき' || skill.name === 'かいでんぱ') {
                    defender.stages.spd = Math.max(-3, defender.stages.spd - 2);
                    battleState.log.push(`[ステータス変動] ${defender.name}の能力が下がった！`);
                } else if (skill.name === 'わるだくみ') {
                    attacker.stages.spa = Math.min(3, attacker.stages.spa + 1);
                    battleState.log.push(`[ステータス変動] ${attacker.name}の特攻が1段階上がった！`);
                } else if (skill.name === 'おにび') {
                    tryInflictBurn(defender, 'おにび');
                } else if (skill.name === 'でんじは') {
                    if (defender.element.includes('jimen')) battleState.log.push(`${defender.name}はじめんタイプなので、でんじはは効かなかった！`);
                    else { defender.status = 'mahi'; battleState.log.push(`${defender.name}はまひ状態になった！`); }
                } else if (skill.name === 'どくのいと') {
                    defender.stages.speed = Math.max(-3, defender.stages.speed - 1);
                    defender.status = 'doku';
                    battleState.log.push(`${defender.name}の素早さが1段階下がり、どく状態になった！`);
                } else if (skill.name === 'どくどく') {
                    defender.status = 'doku';
                    battleState.log.push(`${defender.name}をどく状態にした！`);
                } else if (skill.name === 'ステルスカット') {
                    if (isPlayer) battleState.field.stealthCutCpu = true;
                    else battleState.field.stealthCutPlayer = true;
                    battleState.log.push(`相手の場をステルスカット状態にした！`);
                } else if (skill.name === 'おいかぜ') {
                    if (isPlayer) battleState.field.oikazePlayerTurns = 3;
                    else battleState.field.oikazeCpuTurns = 3;
                    battleState.log.push(`追い風が吹き、素早さが2倍になった！`);
                } else if (skill.name === 'いたみわけ') {
                    const avgHp = Math.floor((attacker.hp + defender.hp) / 2);
                    attacker.hp = avgHp;
                    defender.hp = avgHp;
                    battleState.log.push(`お互いの残りHPを分け合った！`);
                } else if (skill.name === 'リフレッシュ') {
                    attacker.status = null;
                    battleState.log.push(`${attacker.name}の状態異常が治った！`);
                } else if (skill.name === 'おなら') {
                    battleState.field.akuShuuTurns = 3;
                    const pActive = battleState.playerTeam[battleState.playerIndex];
                    const cActive = battleState.cpuTeam[battleState.cpuIndex];
                    if (pActive) pActive.volatileStatuses = [...new Set([...(pActive.volatileStatuses || []), 'akushyuu'])];
                    if (cActive) cActive.volatileStatuses = [...new Set([...(cActive.volatileStatuses || []), 'akushyuu'])];
                    battleState.log.push(`3ターンの間、あたりがあくしゅう状態に包まれた！`);
                } else if (skill.name === 'うらみ') {
                    if (opponentSkill && opponentSkill.pp !== undefined) {
                        opponentSkill.pp = Math.max(0, opponentSkill.pp - 3);
                        battleState.log.push(`相手の最後に使った技のCPを3減らした！`);
                    }
                } else {
                    battleState.log.push(`しかし うまく決まらなかった！`);
                }
            } else {
                let hitCount = (attacker.ability.name === '撃ちます') ? 2 : (skill.name === 'ひびきファージ' ? (Math.floor(Math.random() * 6) + 3) : (skill.name === 'タネマシンガン' ? (Math.floor(Math.random() * 4) + 2) : (skill.name === 'ダブルウィング' ? 2 : 1)));
                let totalDamage = 0;
                if (skill.name === 'ひびきファージ') battleState.log.push(`[連続攻撃] ひびきファージが${hitCount}回連続で襲いかかる！`);

                for (let h = 0; h < hitCount; h++) {
                    let currentPower = skill.power;
                    if (h === 1 && hitCount === 2 && attacker.ability.name === '撃ちます') currentPower *= 0.25;
                    if (skill.name === 'たたりめ' && defender.status) {
                        currentPower *= 2;
                        if (h === 0) battleState.log.push(`[技効果] ${defender.name}は状態異常中！たたりめの威力が2倍になった！`);
                    }

                    if (skill.name === 'おはかまいり') {
                        const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
                        const faintedCount = team.filter(m => m.hp <= 0).length;
                        currentPower = 60 + (faintedCount * 50);
                    }

                    let finalDmg = 0;
                    const typeMulti = getTypeMultiplier(skill.type, defender.element);
                    const activePlayerMon = battleState.playerTeam[battleState.playerIndex];
                    const activeCpuMon = battleState.cpuTeam[battleState.cpuIndex];
                    const opponentSuppressesAttacker = isAbilitySuppressor(isPlayer ? activeCpuMon : activePlayerMon);
                    const attackerIgnoresAbilities = attacker.ability.name === 'マイクラスルーム' && !opponentSuppressesAttacker;
                    const defenderAbilitySuppressed = isAbilitySuppressor(isPlayer ? activePlayerMon : activeCpuMon);
                    const defenderAbilityActive = !attackerIgnoresAbilities && !defenderAbilitySuppressed;

                    if (defenderAbilityActive && defender.ability.name === 'ぬれぬれ' && skill.type === 'mizu') {
                        finalDmg = 0;
                        const heal = Math.max(1, Math.floor(defender.maxHp / 4));
                        defender.hp = Math.min(defender.maxHp, defender.hp + heal);
                        battleState.log.push(`[特性発動: ${defender.name}のぬれぬれ] みず技を無効化し、HPが${heal}回復した！`);
                    } else if (defenderAbilityActive && defender.ability.name === 'すみません' && skill.type === 'kakuto') {
                        finalDmg = 0;
                        const heal = Math.max(1, Math.floor(defender.maxHp / 8));
                        defender.hp = Math.min(defender.maxHp, defender.hp + heal);
                        battleState.log.push(`[特性発動: ${defender.name}のすみません] かくとう技を無効化し、HPが${heal}回復した！`);
                    } else if (skill.name === 'じわれ' && defender.element.includes('hikou')) {
                        finalDmg = 0;
                        battleState.log.push(`${defender.name}はひこうタイプなので、じわれは当たらない！`);
                    } else if (skill.name === 'じわれ' || skill.name === 'ダンクシュート') {
                        finalDmg = defender.hp;
                        battleState.log.push(`一撃必殺！`);
                    } else if (typeMulti === 0) {
                        finalDmg = 0;
                        battleState.log.push(`効果がないようだ…`);
                    } else {
                        let atkStat = skill.category === 'physical' ? attacker.atk * getStageMultiplier(attacker.stages.atk) : attacker.spa * getStageMultiplier(attacker.stages.spa);
                        let defStat = skill.category === 'physical' ? defender.def * getStageMultiplier(defender.stages.def) : defender.spd * getStageMultiplier(defender.stages.spd);
                        if (skill.category === 'physical') atkStat *= attacker.abilityAtkMultiplier || 1;
                        if (skill.category === 'special') atkStat *= attacker.ability.name === 'コーンロウ' && attacker.status ? 2 : 1;
                        if (skill.category === 'physical') defStat *= defender.abilityDefMultiplier || 1;
                        if (attacker.name === 'マエザワン' && attacker.equippedItemId === 'katsura' && skill.category === 'physical') atkStat *= 2;
                        if (battleState.field.akuShuuTurns > 0 || (attacker.volatileStatuses || []).includes('akushyuu')) {
                            if (attacker.element.includes('kusa') || attacker.element.includes('doku')) atkStat *= 1.5;
                        }
                        if (defender.status === 'yakedo' && skill.category === 'physical') atkStat *= 0.5;

                        const randomFactor = 0.85 + Math.random() * 0.15;

                        let rawDamage = (((currentPower * atkStat / defStat) / 50) + 2) * randomFactor * typeMulti * damageMultiplier * 4;
                        if (!attackerIgnoresAbilities && !defenderAbilitySuppressed && defender.ability.name === '遅延行為') {
                            rawDamage *= (skill.type === 'mizu' ? 1.5 : 0.5);
                        }

                        finalDmg = Math.max(1, Math.floor(rawDamage));

                        if (typeMulti > 1) battleState.log.push(`効果はばつぐんだ！`);
                        else if (typeMulti < 1) battleState.log.push(`効果はいまひとつだ…`);
                    }

                    if (defender.hp > 0 && defender.hp - finalDmg <= 0) {
                        if (defender.equippedItemId === 'kiai_tasuki') {
                            defender.equippedItemId = null;
                            finalDmg = defender.hp - 1;
                            battleState.log.push(`[装備発動: ${defender.name}のきあいのタスキ] HP1で耐えた！`);
                        } else if (defender.ability.name === '怒涛の踏ん張り' && !defender.hasSturdied) {
                            defender.hasSturdied = true;
                            finalDmg = defender.hp - 1;
                            battleState.log.push(`[特性発動: ${defender.name}の怒涛の踏ん張り] 瀕死を耐えてHP1でとどまった！`);
                        }
                    }

                    defender.hp = Math.max(0, defender.hp - finalDmg);
                    totalDamage += finalDmg;

                    if (defender.equippedItemId === 'mountainhead' && finalDmg > 0 && attacker.hp > 0) {
                        const mtnDmg = Math.max(1, Math.floor(attacker.maxHp / 8));
                        attacker.hp = Math.max(0, attacker.hp - mtnDmg);
                        battleState.log.push(`[装備発動: ${defender.name}のマウンテンヘッド] 反射で ${attacker.name} に ${mtnDmg} のダメージ！`);
                    }

                    if (defender.hp <= 0) break;
                }

                if (!hasFreestyle) {
                    if (defender.ability.name === '極厚胸板' && skill.category !== 'status' && defender.hp > 0) {
                        defender.stages.def = Math.min(3, defender.stages.def + 1);
                        battleState.log.push(`[特性発動: ${defender.name}の極厚胸板] 防御が1段階上がった！`);
                    }
                    if (defender.ability.name === '骨までしゃぶる' && skill.category !== 'status' && defender.hp > 0) {
                        defender.speed = Math.max(1, defender.speed - 10);
                        defender.stages.def = Math.min(3, defender.stages.def + 1);
                        battleState.log.push(`[特性発動: ${defender.name}の骨までしゃぶる] 防御が上がり素早さが下がった！`);
                    }
                    if (defender.ability.name === '冷笑ボディ' && skill.category !== 'status' && Math.random() < 0.3 && defender.hp > 0) {
                        attacker.status = 'reishou';
                        battleState.log.push(`[特性発動: ${defender.name}の冷笑ボディ] ${attacker.name}を冷笑状態にした！`);
                    }
                    if (defender.ability.name === 'キクチクチク' && skill.category !== 'status' && Math.random() < 0.3 && defender.hp > 0) {
                        attacker.status = 'mahi';
                        battleState.log.push(`[特性発動: ${defender.name}のキクチクチク] ${attacker.name}をまひ状態にした！`);
                    }
                    if (defender.ability.name === 'マイン' && skill.category !== 'status' && Math.random() < 0.3 && defender.hp > 0) {
                        attacker.status = 'doku';
                        battleState.log.push(`[特性発動: ${defender.name}のマイン] ${attacker.name}をどく状態にした！`);
                    }
                    if (skill.type === 'aku' && defender.ability.name === 'エセ正義' && defender.hp > 0) {
                        defender.stages.atk = Math.min(3, defender.stages.atk + 1);
                        battleState.log.push(`[特性発動: ${defender.name}のエセ正義] 攻撃が1段階上がった！`);
                    }
                }

                if ((skill.name === 'ねこだまし' || skill.name === 'はやてがえし' || skill.name === 'おたけび' || skill.name === 'エアスラッシュ' || skill.name === 'あくのはどう' || skill.name === 'かみつく' || skill.name === 'かみなりのキバ' || skill.name === 'ゴッドバード') && defender.hp > 0 && totalDamage > 0) {
                    const guaranteedFlinch = ['ねこだまし', 'はやてがえし', 'おたけび'].includes(skill.name);
                    const flinchChance = skill.name === 'ゴッドバード' ? 0.5 : 0.3;
                    if (guaranteedFlinch || Math.random() < flinchChance) {
                        defender.volatileStatuses = [...new Set([...(defender.volatileStatuses || []), 'hirumi'])];
                        battleState.log.push(`[追加効果] ${defender.name}はひるんでしまった！`);
                    }
                }

                if (['ハイウィング', 'エレキネット', 'だくりゅう', 'マッドショット', 'ローキック', 'シャドーハック'].includes(skill.name)) {
                    if (skill.name !== 'だくりゅう' || Math.random() < 0.3) {
                        defender.stages.speed = Math.max(-3, defender.stages.speed - 1);
                        battleState.log.push(`[追加効果] ${defender.name}の素早さが1段階下がった！`);
                    }
                }
                if (skill.name === 'ネギシアタック' && defender.hp > 0 && Math.random() < 0.3) {
                    defender.stages.def = Math.max(-3, defender.stages.def - 1);
                    battleState.log.push(`[追加効果] ${defender.name}の防御が1段階下がった！`);
                }
                if (skill.name === 'メッシ' && defender.hp > 0 && Math.random() < 0.5) {
                    defender.status = 'mahi';
                    battleState.log.push(`[追加効果] ${defender.name}はまひ状態になった！`);
                }
                if (skill.name === '舌打ち' && defender.hp > 0) {
                    if (Math.random() < 0.25) {
                        defender.stages.def = Math.max(-3, defender.stages.def - 1);
                        battleState.log.push(`[追加効果] ${defender.name}の防御が1段階下がった！`);
                    }
                    if (Math.random() < 0.25) {
                        defender.status = 'panic';
                        defender.statusTurns = 0;
                        battleState.log.push(`[追加効果] ${defender.name}はパニック状態になった！`);
                    }
                }
                if (skill.name === 'かみなりのキバ' && defender.hp > 0 && Math.random() < 0.1) {
                    defender.status = 'mahi';
                    battleState.log.push(`[追加効果] ${defender.name}はまひ状態になった！`);
                }
                if (skill.name === '10万ボルト' && defender.hp > 0 && Math.random() < 0.1) defender.status = 'mahi';
                if (skill.name === 'かみなり' && defender.hp > 0 && Math.random() < 0.3) defender.status = 'mahi';
                if (skill.name === 'かみなりパンチ' && defender.hp > 0 && Math.random() < 0.1) defender.status = 'mahi';
                if (skill.name === 'サンダーダイブ' && defender.hp > 0 && Math.random() < 0.3) defender.status = 'mahi';
                if (skill.name === 'でんじほう' && defender.hp > 0) defender.status = 'mahi';
                if (skill.name === 'ほうでん' && defender.hp > 0 && Math.random() < 0.3) defender.status = 'mahi';
                if (skill.name === 'ボルテッカー' && defender.hp > 0 && Math.random() < 0.1) defender.status = 'mahi';
                if (skill.name === '10万ボルト' || skill.name === 'かみなり' || skill.name === 'かみなりパンチ' || skill.name === 'サンダーダイブ' || skill.name === 'でんじほう' || skill.name === 'ほうでん' || skill.name === 'ボルテッカー' || skill.name === 'かみなりのキバ') {
                    if (defender.status === 'mahi') battleState.log.push(`[追加効果] ${defender.name}はまひ状態になった！`);
                }

                if (skill.name === 'すてみタックル' || skill.name === 'フレアドライブ' || skill.name === 'ウッドハンマー' || skill.name === 'ウェーブタックル' || skill.name === 'ボルテッカー' || skill.name === 'ブレイブバード') {
                    const recoilDmg = Math.max(1, Math.floor(totalDamage / 3));
                    attacker.hp = Math.max(0, attacker.hp - recoilDmg);
                    battleState.log.push(`${attacker.name}は反動で ${recoilDmg} のダメージを受けた！`);
                }

                if (skill.name === 'インファイト' && attacker.hp > 0) {
                    attacker.stages.def = Math.max(-3, attacker.stages.def - 1);
                    attacker.stages.spd = Math.max(-3, attacker.stages.spd - 1);
                    battleState.log.push(`[追加効果] ${attacker.name}の防御と特防が1段階下がった！`);
                }

                if (skill.name === 'むねんのつるぎ' || skill.name === 'ギガドレイン' || skill.name === 'ドレインパンチ') {
                    const drainHeal = Math.max(1, Math.floor(totalDamage / 2));
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + drainHeal);
                    battleState.log.push(`${attacker.name}は相手のHPを ${drainHeal} 吸収回復した！`);
                }
                if (attacker.equippedItemId === 'uupaaruupaa' && totalDamage > 0) {
                    const heal = Math.max(1, Math.floor(totalDamage / 8));
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                    battleState.log.push(`[装備発動: ${attacker.name}のウーパールーパー] HPが${heal}回復した！`);
                }

                if (skill.name === 'だいばくはつ') {
                    attacker.hp = 0;
                    battleState.log.push(`${attacker.name}はだいばくはつで力尽きた！`);
                }

                if (attacker.ability.name === 'ピザ食い') {
                    attacker.isSkipTurn = true;
                }

                battleState.log.push(`${defender.name}に ${totalDamage} のダメージ！`);
                showBattleDamageNumber(targetSpriteId, totalDamage);
            }

            // やけど追加効果（攻撃が命中してダメージが発生した場合のみ判定）
            const burnChances = {
                'かえんほうしゃ': 0.10, 'だいもんじ': 0.10, 'ねっぷう': 0.10,
                'フレアドライブ': 0.10, 'ほのおのパンチ': 0.10,
                'ほのおのキバ': 0.30, 'ねっとう': 0.30, 'ねっさのだいち': 0.30
            };
            if (burnChances[skill.name] && defender.hp > 0 && totalDamage > 0 &&
                Math.random() < burnChances[skill.name]) {
                tryInflictBurn(defender, skill.name);
            }
            if (skill.name === 'うたかたのアリア' && defender.status === 'yakedo') {
                defender.status = null;
                defender.statusTurns = 0;
                battleState.log.push(`${defender.name}のやけど状態が治った！`);
            }

            if (skill.name === 'コールドフレア' && defender.hp > 0 && Math.random() < 0.2) {
                defender.status = 'reishou';
                battleState.log.push(`[追加効果] ${defender.name}は冷笑状態になった！`);
            }
            if (skill.name === 'フェイタルクロー' && defender.hp > 0 && Math.random() < 0.3) {
                const inflictedStatus = ['doku', 'reishou', 'nemuri'][Math.floor(Math.random() * 3)];
                defender.status = inflictedStatus;
                defender.statusTurns = 0;
                const statusName = inflictedStatus === 'doku' ? 'どく' : inflictedStatus === 'reishou' ? '冷笑' : 'ねむり';
                battleState.log.push(`[追加効果] ${defender.name}は${statusName}状態になった！`);
            }

            if (['フレアドライブ', 'ねっとう', 'ねっさのだいち'].includes(skill.name)) {
                if (attacker.status === 'reishou') {
                    attacker.status = null;
                    attacker.statusTurns = 0;
                    battleState.log.push(`${attacker.name}の冷笑状態が治った！`);
                }
                if ((skill.name === 'ねっとう' || skill.name === 'ねっさのだいち') && defender.status === 'reishou') {
                    defender.status = null;
                    defender.statusTurns = 0;
                    battleState.log.push(`${defender.name}の冷笑状態が治った！`);
                }
            }

            if (defender.hp <= 0 && defender.ability.name === '栄魂') {
                attacker.status = 'mahi';
                battleState.log.push(`[特性発動: ${defender.name}の栄魂] ${attacker.name}をまひ状態にした！`);
            }

            if (['ボルトチェンジ', 'クイックターン'].includes(skill.name) && defender.hp < defenderHpBeforeMove && attacker.hp > 0) {
                if (!performPivotSwitch(isPlayer)) battleState.log.push(`${attacker.name}は交代しようとしたが、控えがいない！`);
            }
            applyBinjoFromStageChanges(attacker, isPlayer, attackerStagesBefore);
            applyBinjoFromStageChanges(defender, !isPlayer, defenderStagesBefore);
            renderBattleScreen();
            setTimeout(callback, 1200);
        }

        function checkBattleEnd() {
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];

            if (cMon.hp <= 0) {
                playSound('buff');
                battleState.log.push(`相手の ${cMon.name} は倒れた！`);
                battleState.cpuIndex++;

                if (battleState.cpuIndex >= battleState.cpuTeam.length) {
                    stopBattleBGM();
                    battleState.turnPhase = 'gameover';

                    if (battleState.mode === 'arcade') {
                        arcadeState.wins++;
                        if (arcadeState.currentStage < 3) {
                            battleState.log.push(`第${arcadeState.currentStage}戦 勝利！次のトレーナー戦へ進みます！`);
                            arcadeState.currentStage++;
                            saveGame();
                            showModal(`STAGE ${arcadeState.currentStage - 1} 勝利！ 🎉`, `第${arcadeState.currentStage - 1}戦に勝利しました！\n（※アーケードモードの報酬は3連勝達成時のみ獲得できます）`, '🏆', () => {
                                closeModal();
                                renderArcadePreview();
                            });
                        } else {
                            processArcadeVictory();
                        }
                    } else if (battleState.mode === 'black') {
                        const alreadyOwned = gameState.inventory.some(m => m.baseId === 'jahibi');
                        if (!alreadyOwned) gameState.inventory.push(createMonsterInstance('jahibi'));
                        saveGame();
                        renderJahibiAcquisitionScreen(alreadyOwned);
                    } else {
                        gameState.coins += 150;
                        saveGame();
                        if (Math.random() < 0.05) {
                            showModal('勝利！ 🎉', 'カジュアルマッチ勝利！150コイン獲得！<br><br><span class="text-purple-300 font-black">……しかし、謎のトレーナー【ブラック】が現れた。</span><br>特別なバトルに挑戦しますか？', '⬛', () => { closeModal(); showMenu(); });
                            const buttons = document.getElementById('modal-buttons');
                            buttons.innerHTML = '<button onclick="startBlackBattle()" class="flex-1 bg-gradient-to-r from-red-700 to-purple-800 text-white font-black py-3 rounded-xl">ブラックと対戦する</button><button onclick="closeModal();showMenu()" class="flex-1 bg-gray-700 text-white font-bold py-3 rounded-xl">今回はやめる</button>';
                        } else {
                            showModal('勝利！ 🎉', 'カジュアルマッチに勝利しました！\n報酬として 150 コイン獲得しました！', '🏆', () => { closeModal(); showMenu(); });
                        }
                    }

                    renderBattleScreen();
                    return true;
                } else {
                    const nextCpu = battleState.cpuTeam[battleState.cpuIndex];
                    nextCpu.isFirstTurn = true;
                    triggerOnEntryAbility(nextCpu, false);
                    battleState.log.push(`相手は ${nextCpu.name} を繰り出した！`);
                }
            }

            if (pMon.hp <= 0) {
                playSound('faint');
                battleState.log.push(`${pMon.name} は倒れてしまった！`);
                const nextAlive = battleState.playerTeam.findIndex(m => m.hp > 0);

                if (nextAlive === -1) {
                    stopBattleBGM();
                    battleState.turnPhase = 'gameover';

                    if (battleState.mode === 'arcade') {
                        arcadeState = null;
                        showModal('敗北… 挑戦終了 💦', 'アーケードモードで敗北しました。\n途中の勝利報酬も含め、報酬は付与されません。', '💀', () => {
                            closeModal();
                            renderArcadeHub();
                        });
                    } else {
                        gameState.coins += 50;
                        saveGame();
                        showModal('敗北… 💦', 'チームが全滅してしまいました…\n参加賞として 50 コイン獲得しました。', '☠️', () => { closeModal(); showMenu(); });
                    }

                    renderBattleScreen();
                    return true;
                } else {
                    battleState.playerIndex = nextAlive;
                    const nextPlayerMon = battleState.playerTeam[nextAlive];
                    nextPlayerMon.isFirstTurn = true;
                    triggerOnEntryAbility(nextPlayerMon, true);
                    battleState.log.push(`いけっ！ ${nextPlayerMon.name}！`);
                }
            }

            renderBattleScreen();
            return false;
        }

        function updateHeader() {
            const headerStatus = document.getElementById('header-user-status');
            const coinsEl = document.getElementById('player-coins');
            const menuBtnContainer = document.getElementById('menu-button-container');

            if (gameState.hasStarted) {
                headerStatus.classList.remove('hidden');
                headerStatus.classList.add('flex');
                coinsEl.innerText = gameState.coins;

                if (gameState.currentView === 'battle') {
                    if(menuBtnContainer) menuBtnContainer.classList.add('hidden');
                } else {
                    if(menuBtnContainer) menuBtnContainer.classList.remove('hidden');
                }
            } else {
                headerStatus.classList.add('hidden');
                headerStatus.classList.remove('flex');
            }
        }

        function showModal(title, message, icon = '✨', okCallback = closeModal) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('modal-icon').innerText = icon;
            const okBtn = document.getElementById('modal-ok-btn');
            okBtn.onclick = okCallback;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.hidden = true;
            document.getElementById('custom-modal').classList.add('hidden');
        }

        window.onload = function() {
            loadGame();
            if (gameState.hasStarted && gameState.inventory.length > 0) {
                showMenu();
            } else {
                renderStarterSelect();
            }
        };
    </script>
</body>
</html>
