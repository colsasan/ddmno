<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ディディットモンスター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.IO Client Library (HTTPS対応) -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Zen Maru Gothic', sans-serif;
            background-color: #060911;
            color: #f3f4f6;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1322;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.15); }
        }
        .animate-card:hover {
            animation: pulseGlow 1.5s infinite;
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes floatEffect {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .floating {
            animation: floatEffect 3s ease-in-out infinite;
        }
        @keyframes gachaFlash {
            0% { transform: scale(0.3); opacity: 0; filter: brightness(3); }
            50% { transform: scale(1.2); opacity: 1; filter: brightness(2); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
        .gacha-anim {
            animation: gachaFlash 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-3deg); }
            40%, 80% { transform: translateX(10px) rotate(3deg); }
        }
        .shake-anim {
            animation: shake 0.5s ease-in-out;
        }

        /* モーションエフェクト */
        @keyframes animHonoo {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(249,115,22,0.5)); }
            50% { transform: scale(1.25) rotate(5deg); filter: drop-shadow(0 0 40px rgba(239,68,68,1)) brightness(1.8); }
            100% { transform: scale(1); }
        }
        .effect-honoo { animation: animHonoo 0.6s ease-in-out; }

        @keyframes animMizu {
            0% { transform: translateY(0); filter: drop-shadow(0 0 5px rgba(59,130,246,0.5)); }
            50% { transform: translateY(-16px) scale(1.15); filter: drop-shadow(0 0 35px rgba(96,165,250,1)) brightness(1.6); }
            100% { transform: translateY(0); }
        }
        .effect-mizu { animation: animMizu 0.6s ease-in-out; }

        @keyframes animKusa {
            0% { transform: rotate(0deg); filter: drop-shadow(0 0 5px rgba(16,185,129,0.5)); }
            25% { transform: rotate(-12deg) scale(1.12); }
            75% { transform: rotate(12deg) scale(1.12); filter: drop-shadow(0 0 35px rgba(52,211,153,1)); }
            100% { transform: rotate(0deg); }
        }
        .effect-kusa { animation: animKusa 0.6s ease-in-out; }

        @keyframes animDenki {
            0%, 100% { filter: brightness(1); transform: scale(1); }
            20% { filter: brightness(3.5) drop-shadow(0 0 35px rgba(250,204,21,1)); transform: scale(1.2); }
            40% { filter: brightness(0.3); transform: scale(0.92); }
            60% { filter: brightness(3.0) drop-shadow(0 0 35px rgba(250,204,21,1)); transform: scale(1.15); }
        }
        .effect-denki { animation: animDenki 0.5s ease-in-out; }

        @keyframes animNormal {
            0% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(2.0) drop-shadow(0 0 30px rgba(255,255,255,0.95)); transform: scale(1.12); }
            100% { filter: brightness(1); }
        }
        .effect-normal { animation: animNormal 0.5s ease-in-out; }

        @keyframes animKakuto {
            0% { transform: translateX(0) scale(1); }
            30% { transform: translateX(-20px) scale(1.25); filter: brightness(1.8) drop-shadow(0 0 35px rgba(239,68,68,1)); }
            100% { transform: translateX(0) scale(1); }
        }
        .effect-kakuto { animation: animKakuto 0.5s ease-in-out; }

        @keyframes animAku {
            0% { filter: brightness(1); }
            50% { filter: brightness(0.2) drop-shadow(0 0 40px rgba(168,85,247,1)); transform: scale(1.1); }
            100% { filter: brightness(1); }
        }
        .effect-aku { animation: animAku 0.6s ease-in-out; }

        @keyframes animDoku {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(130deg) brightness(1.6) drop-shadow(0 0 30px rgba(217,70,239,1)); transform: scale(1.1); }
            100% { filter: hue-rotate(0deg); }
        }
        .effect-doku { animation: animDoku 0.6s ease-in-out; }

        @keyframes animJimen {
            0%, 100% { transform: translateY(0); }
            20% { transform: translateY(12px) rotate(-4deg); filter: drop-shadow(0 0 25px rgba(234,179,8,1)); }
            40% { transform: translateY(-12px) rotate(4deg); }
            60% { transform: translateY(10px) rotate(-3deg); }
            80% { transform: translateY(-6px) rotate(3deg); }
        }
        .effect-jimen { animation: animJimen 0.6s ease-in-out; }

        @keyframes animHikou {
            0% { transform: translateX(-25px) scale(0.9); opacity: 0.7; }
            50% { transform: translateX(25px) scale(1.15); filter: drop-shadow(0 0 30px rgba(56,189,248,1)); opacity: 1; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }
        .effect-hikou { animation: animHikou 0.6s ease-in-out; }

        @keyframes animGhost {
            0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px rgba(147,51,234,0.5)); }
            30% { transform: translateY(-10px) scale(1.2); opacity: 0.3; filter: drop-shadow(0 0 35px rgba(168,85,247,1)) brightness(2); }
            70% { transform: translateY(5px) scale(0.9); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .effect-ghost { animation: animGhost 0.6s ease-in-out; }

        /* UIスタイル */
        .neon-border-player {
            border: 2px solid rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        .neon-border-cpu {
            border: 2px solid rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }
        .log-box-custom {
            background: linear-gradient(180deg, rgba(5, 10, 20, 0.95) 0%, rgba(10, 15, 30, 0.9) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 10px rgba(59, 130, 246, 0.1);
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* 必殺技演出レイヤー：バトル計算・通信状態には一切触れない */
        @keyframes battleScreenShake { 0%,100%{transform:translate3d(0,0,0)} 15%{transform:translate3d(-5px,2px,0)} 30%{transform:translate3d(5px,-2px,0)} 45%{transform:translate3d(-4px,-1px,0)} 60%{transform:translate3d(4px,1px,0)} 75%{transform:translate3d(-2px,0,0)} }
        @keyframes battleFlash { 0%{opacity:0} 12%{opacity:.82} 100%{opacity:0} }
        @keyframes battleBurst { 0%{transform:translate(-50%,-50%) scale(.08) rotate(0);opacity:0} 25%{opacity:1} 100%{transform:translate(-50%,-50%) scale(1.8) rotate(28deg);opacity:0} }
        @keyframes battleTitle { 0%{transform:translate(-50%,-50%) scale(1.8);opacity:0;filter:blur(8px)} 18%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:blur(0)} 78%{transform:translate(-50%,-50%) scale(1);opacity:1} 100%{transform:translate(-50%,-50%) scale(.82);opacity:0} }
        @keyframes battleRays { from{transform:translate(-50%,-50%) rotate(0) scale(.25);opacity:0} 20%{opacity:.7} to{transform:translate(-50%,-50%) rotate(35deg) scale(1.5);opacity:0} }
        @keyframes battleDamagePop { 0%{transform:translate(-50%,0) scale(.35);opacity:0} 18%{transform:translate(-50%,-18px) scale(1.2);opacity:1} 100%{transform:translate(-50%,-64px) scale(.9);opacity:0} }
        .battle-shake { animation:battleScreenShake .42s linear; }
        .battle-fx-overlay { position:fixed; inset:0; z-index:80; pointer-events:none; overflow:hidden; }
        .battle-fx-overlay .fx-flash { position:absolute; inset:0; background:var(--fx-color); mix-blend-mode:screen; animation:battleFlash .62s ease-out forwards; }
        .battle-fx-overlay .fx-burst { position:absolute; left:50%; top:50%; width:min(76vw,620px); aspect-ratio:1; border:8px solid var(--fx-color); border-radius:50%; box-shadow:0 0 35px var(--fx-color),inset 0 0 45px var(--fx-color); animation:battleBurst .72s ease-out forwards; }
        .battle-fx-overlay .fx-rays { position:absolute; left:50%; top:50%; width:140vw; height:140vw; background:repeating-conic-gradient(from 0deg,transparent 0deg 7deg,var(--fx-color) 7.5deg 8.2deg,transparent 8.8deg 15deg); opacity:0; mask-image:radial-gradient(circle,black 0%,transparent 68%); animation:battleRays .78s ease-out forwards; }
        .battle-fx-overlay .fx-title { position:absolute; left:50%; top:43%; width:100%; padding:0 12px; text-align:center; color:#fff; font-size:clamp(25px,7vw,64px); line-height:1.1; font-weight:1000; font-style:italic; letter-spacing:.06em; -webkit-text-stroke:1px rgba(20,10,30,.8); text-shadow:0 4px 0 #381047,0 0 12px var(--fx-color),0 0 34px var(--fx-color); animation:battleTitle 1.05s cubic-bezier(.16,.8,.2,1) forwards; }
        .battle-fx-overlay .fx-rank { position:absolute; left:50%; top:57%; transform:translateX(-50%); color:#fff7b2; font-size:clamp(12px,3vw,22px); font-weight:1000; letter-spacing:.22em; text-shadow:0 0 14px #ffb000; }
        .battle-damage-pop { position:fixed; z-index:85; pointer-events:none; font-weight:1000; font-size:clamp(28px,8vw,58px); color:#fff; -webkit-text-stroke:1.5px #7f1d1d; text-shadow:0 3px 0 #7f1d1d,0 0 18px #fb923c,0 0 32px #ef4444; animation:battleDamagePop .95s ease-out forwards; }
        @media (prefers-reduced-motion: reduce) { .battle-shake,.battle-fx-overlay *,.battle-damage-pop { animation-duration:.01ms !important; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 overflow-x-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-[#060911] to-black">

    <header class="w-full max-w-6xl flex items-center justify-between glass-card px-6 py-4 rounded-2xl mb-6 border border-indigo-500/30">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-400 tracking-wider drop-shadow-md cursor-pointer" onclick="showMenu()">
                ディディットモンスター
            </h1>
        </div>
        <div class="flex items-center space-x-3">
            <div id="header-user-status" class="hidden items-center space-x-3">
                <div class="flex items-center bg-black/60 px-4 py-2 rounded-xl border border-yellow-500/30 shadow-inner">
                    <span class="text-yellow-400 font-bold mr-1.5 text-base">🪙</span>
                    <span id="player-coins" class="font-black text-yellow-300 text-sm sm:text-base font-mono">900</span>
                </div>
                <div id="menu-button-container">
                    <button onclick="showMenu()" class="text-xs sm:text-sm bg-gradient-to-r from-gray-800 to-gray-700 hover:from-gray-700 hover:to-gray-600 text-gray-200 px-4 py-2 rounded-xl border border-gray-600 transition font-bold shadow whitespace-nowrap">
                        メニュー
                    </button>
                </div>
            </div>
            <button onclick="toggleFullScreen()" class="text-sm bg-gray-800/80 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-xl border border-gray-700 transition font-bold" title="全画面表示">
                ⛶
            </button>
        </div>
    </header>

    <main id="app-container" class="w-full max-w-6xl flex-grow flex flex-col justify-center items-center relative my-auto">
        <!-- Dynamic Views -->
    </main>

    <footer class="w-full max-w-6xl text-center py-4 text-xs text-gray-500 tracking-wider">
        &copy; 2026 Monster Battlers Project. All Rights Reserved.
    </footer>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-box" class="glass-card border border-gray-700 rounded-3xl p-8 max-w-md w-full shadow-2xl modal-animate flex flex-col items-center text-center">
            <div id="modal-icon" class="text-5xl mb-4">✨</div>
            <h3 id="modal-title" class="text-2xl font-black text-white mb-3 tracking-wide">お知らせ</h3>
            <div id="modal-message" class="text-gray-300 text-base mb-8 leading-relaxed max-h-80 overflow-y-auto w-full">ここにメッセージが表示されます。</div>
            <div id="modal-buttons" class="flex space-x-3 w-full">
                <button id="modal-ok-btn" onclick="closeModal()" class="flex-1 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition tracking-wide text-base whitespace-nowrap">
                    OK
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // --- 1. BGM & SOUND Synthesizer ---
        // ==========================================
        const bgmAudio = new Audio('戦闘.mp3');
        bgmAudio.loop = true;
        const blackBattleBgmAudio = new Audio('ブラック戦闘.mp3');
        blackBattleBgmAudio.loop = true;
        let activeBgmAudio = bgmAudio;

        function playBattleBGM() {
            stopBattleBGM();
            activeBgmAudio = battleState && battleState.mode === 'black' ? blackBattleBgmAudio : bgmAudio;
            activeBgmAudio.currentTime = 0;
            activeBgmAudio.play().catch(e => console.log("BGM自動再生ブロック:", e));
        }

        function stopBattleBGM() {
            [bgmAudio, blackBattleBgmAudio].forEach(audio => { audio.pause(); audio.currentTime = 0; });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'honoo') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'mizu') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'denki') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'kusa') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'ghost') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'buff') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(500, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'faint') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'victory') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.15);
                osc.frequency.setValueAtTime(659.25, now + 0.3);
                osc.frequency.setValueAtTime(880, now + 0.45);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        // ==========================================
        // --- 2. CANVAS PARTICLE ENGINE ---
        // ==========================================
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                if (type === 'honoo') {
                    this.vx *= 0.5;
                    this.vy = -(2 + Math.random() * 5);
                    this.color = ['#ff4500', '#ff8c00', '#ffa500', '#ffff00'][Math.floor(Math.random() * 4)];
                } else if (type === 'mizu') {
                    this.color = ['#00bfff', '#1e90ff', '#4169e1', '#00ffff'][Math.floor(Math.random() * 4)];
                    this.vy += 1.5;
                } else if (type === 'kusa') {
                    this.color = ['#00ff7f', '#32cd32', '#228b22', '#adff2f'][Math.floor(Math.random() * 4)];
                } else if (type === 'denki') {
                    this.color = ['#ffd700', '#ffff00', '#fffacd', '#ffffe0'][Math.floor(Math.random() * 4)];
                    this.vx *= 1.8;
                    this.vy *= 1.8;
                } else if (type === 'ghost') {
                    this.color = ['#a855f7', '#c084fc', '#e879f9', '#7e22ce', '#ffffff'][Math.floor(Math.random() * 5)];
                    this.vy = -(1 + Math.random() * 3);
                } else if (type === 'arcade_ultra' || type === 'super_rare') {
                    this.color = ['#ffd700', '#ff1493', '#00ffff', '#ffffff', '#a855f7'][Math.floor(Math.random() * 5)];
                    this.vx *= 1.5;
                    this.vy *= 1.5;
                } else if (type === 'equip') {
                    this.color = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#ffffff'][Math.floor(Math.random() * 5)];
                } else if (type === 'heal') {
                    this.color = ['#00ff7f', '#adff2f', '#ffffff', '#00ffff'][Math.floor(Math.random() * 4)];
                } else if (type === 'buff') {
                    this.color = ['#ffd700', '#ff4500', '#ff1493', '#ffffff'][Math.floor(Math.random() * 4)];
                } else {
                    this.color = ['#ffffff', '#d3d3d3', '#a9a9a9', '#f5f5f5'][Math.floor(Math.random() * 4)];
                }

                this.size = 4 + Math.random() * 8;
                this.maxLife = 30 + Math.random() * 30;
                this.life = this.maxLife;
                this.alpha = 1.0;
                this.gravity = (type === 'jimen' || type === 'mizu') ? 0.2 : -0.05;
                this.friction = 0.93;
                this.shape = Math.random() > 0.3 ? 'spark' : 'circle';
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.25;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                this.alpha = Math.max(0, this.life / this.maxLife);
                this.size = Math.max(0.5, this.size * 0.97);
                this.rotation += this.rotSpeed;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.shadowBlur = 16;
                ctx.shadowColor = this.color;

                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        ctx.lineTo(0, -this.size);
                        ctx.rotate(Math.PI / 4);
                        ctx.lineTo(0, -this.size * 0.4);
                        ctx.rotate(Math.PI / 4);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class ParticleSystemManager {
            constructor() {
                this.particles = [];
                this.canvas = null;
                this.ctx = null;
                this.animId = null;
                this.isRunning = false;
            }

            init(canvasId) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.loop();
                }
            }

            resize() {
                if (!this.canvas) return;
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width || window.innerWidth;
                this.canvas.height = rect.height || 400;
            }

            spawn(x, y, type, count = 35) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x, y, type));
                }
            }

            burstCenter(type = 'arcade_ultra', count = 100) {
                if (!this.canvas) return;
                const cx = this.canvas.width / 2;
                const cy = this.canvas.height / 2;
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(cx, cy, type));
                }
            }

            loop() {
                if (!this.isRunning || !this.ctx || !this.canvas) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.update();
                    p.draw(this.ctx);
                    if (p.life <= 0 || p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                this.animId = requestAnimationFrame(() => this.loop());
            }

            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
                this.particles = [];
            }
        }

            const base = MONSTERS_DB[baseId];
            if (!base) return null;
            return {
                instanceId: 'inst_' + (instanceCounter++) + '_' + Date.now(),
                baseId: base.id,
                name: base.name,
                element: [...base.element],

        function saveGame() {
            localStorage.setItem('monster_battlers_save_v26', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('monster_battlers_save_v26');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                    if (!gameState.ownedEquipment) gameState.ownedEquipment = [];
                    let jahibiStatsMigrated = false;
                    (gameState.inventory || []).forEach(mon => {
                        if (!mon) return;
                        if (mon.baseId === 'jahibi') {
                            const oldMaxHp = Number(mon.maxHp) || MONSTERS_DB.jahibi.maxHp;
                            const oldHp = Number(mon.hp);
                            const hpRate = oldMaxHp > 0 && Number.isFinite(oldHp) ? Math.max(0, Math.min(1, oldHp / oldMaxHp)) : 1;
                            const base = MONSTERS_DB.jahibi;
                            mon.name = base.name;
                            mon.element = [...base.element];
                            mon.maxHp = base.maxHp;
                            mon.hp = Math.min(mon.maxHp, Math.max(0, Math.round(mon.maxHp * hpRate)));
                            mon.atk = base.atk;
                            mon.def = base.def;
                            mon.spa = base.spa;
                            mon.spd = base.spd;
                            mon.speed = base.speed;
                            mon.ability = { ...base.ability };
                            jahibiStatsMigrated = true;
                        } else if (mon.baseId === 'kamiDeYaiba' && Array.isArray(mon.skills)) {
                            mon.skills.forEach(skill => {
                                const updated = skill.name === 'カミデヤイバ' ? SKILLS_DB.kamiDeYaibaSkill : (skill.name === 'ゴッドバード' ? SKILLS_DB.goddobaado : null);
                                if (!updated) return;
                                skill.type = updated.type;
                                skill.category = updated.category;
                                skill.power = updated.power;
                                skill.accuracy = updated.accuracy;
                                skill.maxPp = updated.maxPp;
                                skill.desc = updated.desc;
                                skill.pp = Math.min(Number(skill.pp) || 0, updated.maxPp);
                                jahibiStatsMigrated = true;
                            });
                        }
                    });
                    if (jahibiStatsMigrated) saveGame();
                } catch(e) {
                    console.error("Save load error:", e);
                }
            }
            if (!gameState.playerId) {
                gameState.playerId = 'usr_' + Math.random().toString(36).substring(2, 10) + Date.now();
                saveGame();
            }
        }

        function sanitizeName(name) {
            if (!name) return '';
            let clean = name.trim().replace(/<[^>]*>?/gm, '');
            return clean.substring(0, 12);

        // Socket.IO Manager (単一インスタンス・ターン完全同期)
        function initOnlineSocket() {
            const storedName = gameState.playerName || '';
            addOnlineLog(`1. プレイヤー確認: 名前="${storedName}" (ID: ${gameState.playerId})`);

            if (!storedName) {
                onlineState.authStatus = 'unauthenticated';
                onlineState.lastError = 'プレイヤー名が未登録です。';
                addOnlineLog(`⚠️ プレイヤー名が未登録のためオンライン処理を開始できません。`);
                updateOnlineUI();
                return;
            }

            if (socket) {
                if (socket.connected) {
                    if (!onlineState.isRegistered && !onlineState.registerRequested) {
                        sendRegisterPlayer();
                    }
                    return;
                } else {
                    addOnlineLog("既存のSocketインスタンスを再接続します...");
                    socket.connect();
                    return;
                }
            }

            onlineState.authStatus = 'authenticating';
            updateOnlineUI();

            addOnlineLog(`2. io("${RENDER_SERVER_URL}") を実行します`);
            socket = io(RENDER_SERVER_URL, {
                autoConnect: true,
                reconnection: true,
                reconnectionAttempts: 10,
                reconnectionDelay: 1000,
                transports: ["websocket", "polling"],
                secure: true
            });

            socket.on('connect', () => {
                onlineState.isConnected = true;
                onlineState.lastError = null;
                addOnlineLog(`3. connectイベント発生: Socket.ID = ${socket.id}`);
                updateOnlineUI();

                sendRegisterPlayer();
            });

            socket.on('connect_error', (err) => {
                onlineState.isConnected = false;
                onlineState.isRegistered = false;
                onlineState.authStatus = 'error';
                onlineState.registerRequested = false;
                onlineState.lastError = err.message || '接続エラーが発生しました。';
                addOnlineLog(`4. connect_error発生: ${onlineState.lastError}`);
                updateOnlineUI();
            });

            socket.on('disconnect', (reason) => {
                onlineState.isConnected = false;
                onlineState.isRegistered = false;
                onlineState.authStatus = 'unauthenticated';
                onlineState.registerRequested = false;
                addOnlineLog(`⚠️ サーバー切断: ${reason}`);
                updateOnlineUI();
            });

            const handleRegisteredSuccess = (data) => {
                onlineState.playerId = (data && data.playerId) || (socket && socket.id) || '';
                onlineState.isRegistered = true;
                onlineState.authStatus = 'authenticated';
                onlineState.lastError = null;
                onlineState.registerRequested = false;
                addOnlineLog(`登録完了(registered受信)！ 認証状態: authenticated`);
                updateOnlineUI();

                if (onlineState.pendingMatchAfterRegister) {
                    onlineState.pendingMatchAfterRegister = false;
                    addOnlineLog(`保留中のマッチングを実行します。`);
                    executeJoinQueueInternal();
                }
            };

            socket.on('registered', handleRegisteredSuccess);
            socket.on('player_registered', handleRegisteredSuccess);
            socket.on('registerSuccess', handleRegisteredSuccess);

            const handleRegisterError = (data) => {
                const errMsg = typeof data === 'string' ? data : (data.message || JSON.stringify(data));
                addOnlineLog(`登録エラー発生: ${errMsg}`);
                onlineState.lastError = errMsg;
                onlineState.isRegistered = false;
                onlineState.authStatus = 'error';
                onlineState.registerRequested = false;
                updateOnlineUI();
            };

            socket.on('registerError', handleRegisterError);
            socket.on('register_error', handleRegisterError);
            socket.on('error', handleRegisterError);

            socket.on('queueJoined', () => addOnlineLog(`キュー登録成功: 対戦待ち中...`));
            socket.on('queue_joined', () => addOnlineLog(`キュー登録成功: 対戦相手を検索中...`));

            const handleMatchFound = (data) => {
                try {
                    addOnlineLog(`🎉 matchFoundイベントを受信しました: ${JSON.stringify(data || {})}`);

                    if (!data) return;

                    onlineState.isSearching = false;
                    onlineState.roomId = data.roomId || data.room_id || 'room_default';
                    onlineState.playerId = data.playerId || (socket && socket.id) || onlineState.playerId || '';
                    onlineState.localIsFirst = !!(onlineState.playerId && onlineState.roomId.startsWith('match_' + onlineState.playerId + '_'));
                    onlineState.turn = 1;
                    onlineState.turnSubmitted = false;

                    const oppName = data.opponentName || data.opponent_name || (data.opponent && data.opponent.name) || '対戦相手';
                    onlineState.opponentName = oppName;

                    let oppTeamRaw = data.opponentTeam || data.opponent_team || (data.opponent && data.opponent.party) || data.party || [];

                    let formattedOpponentTeam = oppTeamRaw.map(mon => {
                        let baseMon = MONSTERS_DB[mon.baseId || mon.id] || MONSTERS_DB['koujiradon'];
                        return {
                            instanceId: mon.instanceId || ('opp_' + Math.random().toString(36).substring(2, 9)),
                            baseId: baseMon.id,
                            name: mon.name || baseMon.name,
                            element: mon.element || [...baseMon.element],
                            hp: mon.hp !== undefined ? mon.hp : baseMon.hp,
                            maxHp: mon.maxHp || mon.hp || baseMon.maxHp,
                            atk: mon.atk || baseMon.atk,
                            def: mon.def || baseMon.def,
                            spa: mon.spa || baseMon.spa,
                            spd: mon.spd || baseMon.spd,
                            speed: mon.speed || baseMon.speed,
                            ability: mon.ability || { ...baseMon.ability },
                            skills: (mon.skills && mon.skills.length > 0) ? mon.skills : baseMon.skillIds.map(sId => ({ ...SKILLS_DB[sId], pp: SKILLS_DB[sId].maxPp })),
                            imageUrl: mon.imageUrl || baseMon.imageUrl || '',
                            desc: mon.desc || baseMon.desc,
                            equippedItemId: mon.equippedItemId || null,
                            stages: mon.stages || { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 },
                            status: mon.status || null,
                            statusTurns: 0,
                            turnsInBattle: 0,
                            hasSturdied: false,
                            isSkipTurn: false,
                            isProtected: false,
                            isFirstTurn: true
                        };
                    });

                    if (formattedOpponentTeam.length === 0) {
                        formattedOpponentTeam = ['koujiradon', 'reishoujin', 'rafureon'].map(bId => createMonsterInstance(bId));
                    }

                    onlineState.opponentTeam = formattedOpponentTeam;
                    addOnlineLog(`バトル画面へ遷移開始: RoomID=${onlineState.roomId}, 相手=${onlineState.opponentName}`);
                    
                    startOnlineBattle();

                } catch (err) {
                    console.error("matchFound受信処理でエラーが発生しました:", err);
                    addOnlineLog(`❌ matchFound受信エラー: ${err.message}`);
                }
            };

            socket.on('matchFound', handleMatchFound);
            socket.on('match_found', handleMatchFound);

            socket.on('serverError', handleRegisterError);
            socket.on('server_error', handleRegisterError);

            // オンラインターン処理受信
            const handleTurnResolution = (data) => {
                handleOnlineTurnResolution(data);
            };

            socket.on('turn_resolution', handleTurnResolution);
            socket.on('turnResolution', handleTurnResolution);
            socket.on('turn_result', handleTurnResolution);
            socket.on('battle_turn', handleTurnResolution);

            socket.on('opponent_disconnected', () => {
                addOnlineLog(`相手プレイヤーが切断されました。`);
                showModal('通信切断勝訴', '相手プレイヤーが切断されたため、あなたの不戦勝となりました！', '🎉', () => {
                    closeModal();
                    renderOnlineMenu();
                });
            });
        }

            const nameToSend = gameState.playerName || '';

            if (onlineState.isRegistered && onlineState.authStatus === 'authenticated') return;

            const payloadObject = {
                playerId: gameState.playerId,
                playerName: nameToSend,
                name: nameToSend,
                id: gameState.playerId
            };

            onlineState.registerRequested = true;
            addOnlineLog(`registerPlayer送信: ${JSON.stringify(payloadObject)}`);

            socket.emit('registerPlayer', payloadObject);
        }

        function getAuthBadgeStyle() {
            if (onlineState.authStatus === 'authenticated') return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
            if (onlineState.authStatus === 'authenticating') return 'bg-amber-500/20 text-amber-300 border border-amber-500/40 animate-pulse';
            if (onlineState.authStatus === 'error') return 'bg-red-500/20 text-red-400 border border-red-500/40';
            return 'bg-gray-500/20 text-gray-400 border border-gray-500/40';
        }

        function getAuthStatusText() {
            if (onlineState.authStatus === 'authenticated') return '● 接続・プレイヤー登録完了 (認証OK)';
            if (onlineState.authStatus === 'authenticating') return '○ 接続完了 (サーバー認証中...)';
            if (onlineState.authStatus === 'error') return '❌ 認証・接続エラー発生';
            return '○ 未認証';
        }

        function updateOnlineUI() {
            const badge = document.getElementById('connection-status-badge');
            if (badge) {
                badge.className = `text-xs px-3 py-1 rounded-full font-bold mb-4 ${getAuthBadgeStyle()}`;
                badge.innerText = getAuthStatusText();
            }
            if (gameState.currentView === 'online-menu') {
                renderOnlineMenu();
            }
        }

        function startRandomMatch() {
            if (!socket || !onlineState.isConnected) {
                addOnlineLog("Socketが未接続です。接続試行を行います...");
                onlineState.pendingMatchAfterRegister = true;
                initOnlineSocket();
                return;
            }

            if (onlineState.authStatus !== 'authenticated' || !onlineState.isRegistered) {
                addOnlineLog("⚠️ まだプレイヤー登録認証が完了していません。登録認証を待ってマッチングします。");
                onlineState.pendingMatchAfterRegister = true;
                sendRegisterPlayer();
                return;
            }

            executeJoinQueueInternal();
        }

        function executeJoinQueueInternal() {
            onlineState.isSearching = true;
            renderOnlineMenu();

            const myParty = gameState.team.map(instId => {
                const original = gameState.inventory.find(m => m.instanceId === instId);
                return JSON.parse(JSON.stringify(original));
            });

            const matchPayload = {
                playerId: gameState.playerId,
                playerName: gameState.playerName,
                party: myParty
            };

            addOnlineLog(`送信: マッチング要求 (joinQueue/join_random_match)`);
            socket.emit('joinQueue', matchPayload);
        }

        function cancelMatching() {
            onlineState.pendingMatchAfterRegister = false;
            if (socket) {
                addOnlineLog("送信: キャンセル要求");
                socket.emit('cancel_match');
            }
            onlineState.isSearching = false;
            renderOnlineMenu();
        }

        function startOnlineBattle() {
            try {
                playBattleBGM();

                const playerTeam = gameState.team.map(instId => {
                    const original = gameState.inventory.find(m => m.instanceId === instId);
                    return JSON.parse(JSON.stringify(original));
                });
                playerTeam.forEach(m => {
                    m.hp = m.maxHp;
                    m.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
                    m.status = null;
                    m.statusTurns = 0;
                    m.volatileStatuses = [];
                    m.protectCount = 0;
                    m.turnsInBattle = 0;
                    m.hasSturdied = false;
                    m.isSkipTurn = false;
                    m.isProtected = false;
                    m.isFirstTurn = true;
                });

                battleState = {
                    mode: 'online',
                    playerTeam: playerTeam,
                    playerIndex: 0,
                    cpuTeam: onlineState.opponentTeam,
                    cpuIndex: 0,
                    log: [`ONLINE BATTLE MATCHED: vs ${onlineState.opponentName}！`],
                    field: { stealthCutPlayer: false, stealthCutCpu: false, akuShuuTurns: 0, oikazePlayerTurns: 0, oikazeCpuTurns: 0 },
                    turnPhase: 'menu'
                };

                checkBattleStartAbilities();
                renderBattleScreen();
            } catch (err) {
                console.error("startOnlineBattleの実行中にエラーが発生しました:", err);
                addOnlineLog(`❌ バトル画面切り替えエラー: ${err.message}`);
            }
        }

        // --- オンライン行動送信 (二重入力防止 & 統一フォーマット & 詳細ログ記録) ---
        function sendOnlineAction(actionType, detailIndex) {
            // [ログ] 技選択ボタンが押されたとき
            addOnlineLog(`[技選択] roomId=${onlineState.roomId}, playerId=${gameState.playerId}, turn=${onlineState.turn}, actionType=${actionType}, index=${detailIndex}`);

            if (battleState.turnPhase === 'processing' || onlineState.turnSubmitted) {
                addOnlineLog(`[二重送信防止] すでに行動送信済みまたは処理中です。(turn=${onlineState.turn})`);
                return;
            }

            if (!socket || !socket.connected) {
                const connErr = '通信エラー: サーバーとの接続が切断されています。';
                addOnlineLog(`❌ ${connErr}`);
                showModal('通信エラー', 'サーバーとの接続が切断されています。', '⚠️', closeModal);
                return;
            }

            // 同一ターン内での重複送信をガード
            onlineState.turnSubmitted = true;
            battleState.turnPhase = 'processing';
            battleState.log.push(`相手の行動選択を待っています...`);
            renderBattleScreen();

            // サーバーとクライアントのイベント名・データ形式統一
            const actionPayload = {
                roomId: onlineState.roomId,
                playerId: (socket && socket.id) || onlineState.playerId,
                turn: onlineState.turn,
                turnNumber: onlineState.turn,
                action: { type: actionType, index: detailIndex },
                type: actionType,
                index: detailIndex
            };

            // [ログ] 技選択データをサーバーへ送信したとき
            addOnlineLog(`[送信: 技選択データ] ${JSON.stringify(actionPayload)}`);
            
            socket.emit('submit_action', actionPayload);
        }

        // --- リレーサーバーから届いた両者の行動を同じ順序で実行 ---
        function handleOnlineTurnResolution(data) {
            if (!battleState || battleState.mode !== 'online' || !data) return;
            if (onlineState.resolvingTurn || Number(data.turn) !== onlineState.turn) {
                addOnlineLog(`[同期無視] 進行中またはターン不一致: received=${data.turn}, current=${onlineState.turn}`);
                return;
            }
            if (!data.myAction || !data.opponentAction) {
                addOnlineLog('❌ ターン結果に両プレイヤーの行動が含まれていません。');
                return;
            }

            onlineState.resolvingTurn = true;
            addOnlineLog(`[受信: ターン行動] turn=${data.turn}, my=${JSON.stringify(data.myAction)}, opponent=${JSON.stringify(data.opponentAction)}`);
            battleState.turnPhase = 'processing';

            // roomIdはserver.jsが match_<先着socket.id>_<後着socket.id> で生成する。
            // 両クライアントで同じ先着側から処理することで乱数消費順も一致させる。
            const firstAction = onlineState.localIsFirst ? data.myAction : data.opponentAction;
            const secondAction = onlineState.localIsFirst ? data.opponentAction : data.myAction;
            const seedText = `${onlineState.roomId}:${data.turn}`;
            let seed = 2166136261;
            for (let i = 0; i < seedText.length; i++) {
                seed ^= seedText.charCodeAt(i);
                seed = Math.imul(seed, 16777619);
            }
            let randomState = seed >>> 0;
            const originalRandom = Math.random;
            Math.random = function() {
                randomState += 0x6D2B79F5;
                let t = randomState;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };

            const localActorIsFirst = onlineState.localIsFirst;
            const firstIsPlayer = localActorIsFirst;
            const secondIsPlayer = !localActorIsFirst;
            const getActorMon = isPlayer => isPlayer
                ? battleState.playerTeam[battleState.playerIndex]
                : battleState.cpuTeam[battleState.cpuIndex];
            const getTargetMon = isPlayer => isPlayer
                ? battleState.cpuTeam[battleState.cpuIndex]
                : battleState.playerTeam[battleState.playerIndex];

            const finish = () => {
                try {
                    finishOnlineTurn(data.turn);
                } finally {
                    Math.random = originalRandom;
                    onlineState.resolvingTurn = false;
                }
            };

            const performAction = (action, isPlayer, opponentAction, callback) => {
                const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
                const activeIndex = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
                const actor = team[activeIndex];
                if (!actor || actor.hp <= 0) {
                    battleState.log.push(`${actor ? actor.name : '行動側'}は倒れていて行動できない！`);
                    callback();
                    return;
                }

                if (action.type === 'switch') {
                    const nextIndex = Number(action.index);
                    const enemy = getTargetMon(isPlayer);
                    const freestyle = isAbilitySuppressor(actor) || isAbilitySuppressor(enemy);
                    if (!Number.isInteger(nextIndex) || nextIndex < 0 || nextIndex >= team.length || nextIndex === activeIndex || !team[nextIndex] || team[nextIndex].hp <= 0 || (!freestyle && enemy && enemy.ability.name === 'だる絡み')) {
                        battleState.log.push(`${actor.name}は交代できなかった！`);
                        callback();
                        return;
                    }
                    actor.lockedMoveIndex = null;
                    const nextMon = team[nextIndex];
                    if (isPlayer) battleState.playerIndex = nextIndex;
                    else battleState.cpuIndex = nextIndex;
                    nextMon.isFirstTurn = true;
                    nextMon.chargingSkill = null;
                    nextMon.isReleasingCharge = false;
                    nextMon.lockedMoveIndex = null;
                    nextMon.isSkipTurn = false;
                    if (battleState.field.akuShuuTurns > 0) nextMon.status = 'akushyuu';
                    if (nextMon.status === 'hirumi') nextMon.status = null;
                    triggerOnEntryAbility(nextMon, isPlayer);
                    const stealthCut = isPlayer ? battleState.field.stealthCutPlayer : battleState.field.stealthCutCpu;
                    if (stealthCut) {
                        const isFuuyuu = nextMon.ability.name === 'ふゆう';
                        const enemyNow = getTargetMon(isPlayer);
                        const enemyFreestyle = isAbilitySuppressor(enemyNow);
                        if (!isFuuyuu || enemyFreestyle) {
                            const multi = getTypeMultiplier('normal', nextMon.element);
                            const cutDmg = Math.max(1, Math.floor((nextMon.maxHp / 8) * multi));
                            nextMon.hp = Math.max(0, nextMon.hp - cutDmg);
                            battleState.log.push(`[ステルスカット] ${nextMon.name}に ${cutDmg} のダメージ！`);
                        }
                    }
                    battleState.log.push(`[交代] ${nextMon.name}が戦闘に出た！`);
                    renderBattleScreen();
                    setTimeout(callback, 350);
                    return;
                }

                if (action.type !== 'skill') {
                    battleState.log.push(`${actor.name}の行動データが不正です！`);
                    callback();
                    return;
                }
                const skillIndex = Number(action.index);
                let skill = actor.skills && actor.skills[skillIndex];
                if (!Number.isInteger(skillIndex) || !skill) {
                    battleState.log.push(`${actor.name}は技を選択できなかった！`);
                    callback();
                    return;
                }
                if (actor.chargingSkill) {
                    skill = actor.chargingSkill;
                } else if (skill.pp <= 0) {
                    battleState.log.push(`${actor.name}の${skill.name}はCP切れで出せない！`);
                    callback();
                    return;
                } else {
                    skill.pp--;
                }
                if (actor.equippedItemId === 'wing_kakera') actor.lockedMoveIndex = skillIndex;

                let opponentSkill = null;
                if (opponentAction && opponentAction.type === 'skill') {
                    const opponent = getTargetMon(isPlayer);
                    opponentSkill = opponent && opponent.skills ? opponent.skills[Number(opponentAction.index)] : null;
                    if (opponent && opponent.chargingSkill) opponentSkill = opponent.chargingSkill;
                }
                runAction(actor, getTargetMon(isPlayer), skill, isPlayer, opponentSkill, callback);
            };

            // 先制度・素早さを同一の乱数列で評価。交代は技より先に処理する。
            const actionPriority = (action, isPlayer) => {
                if (action && action.type === 'switch') return 6;
                const mon = getActorMon(isPlayer);
                const skill = mon && mon.chargingSkill ? mon.chargingSkill : (mon && mon.skills ? mon.skills[Number(action && action.index)] : null);
                if (!skill) return 0;
                if (mon.ability.name === '絶対命令' && mon.hp === mon.maxHp && skill.type === 'ghost') return 1;
                if (skill.name === 'ねこだまし' || skill.name === 'はやてがえし') return 3;
                if (skill.name === 'しんそく') return 2;
                if (['アクアジェット', 'しんくうは', 'マッハパンチ'].includes(skill.name)) return 1;
                return 0;
            };
            const speedOf = isPlayer => {
                const mon = getActorMon(isPlayer);
                let speed = mon.speed * getStageMultiplier(mon.stages.speed);
                if (mon.equippedItemId === 'wing_kakera') speed *= 1.5;
                if (mon.name === 'マエザワン' && mon.equippedItemId === 'katsura') speed *= 2;
                if (mon.status === 'mahi') speed *= 0.5;
                if (isPlayer && battleState.field.oikazePlayerTurns > 0) speed *= 2;
                if (!isPlayer && battleState.field.oikazeCpuTurns > 0) speed *= 2;
                return speed;
            };
            let firstPriority = actionPriority(firstAction, firstIsPlayer);
            let secondPriority = actionPriority(secondAction, secondIsPlayer);
            const firstMon = getActorMon(firstIsPlayer);
            const secondMon = getActorMon(secondIsPlayer);
            const freestyle = isAbilitySuppressor(firstMon) || isAbilitySuppressor(secondMon);
            if (!freestyle) {
                if (firstMon.ability.name === '安心感') firstPriority = 0;
                if (secondMon.ability.name === '安心感') secondPriority = 0;
            }
            let firstGoesFirst = firstPriority > secondPriority || (firstPriority === secondPriority && speedOf(firstIsPlayer) >= speedOf(secondIsPlayer));
            if (firstPriority === secondPriority) {
                if (firstMon.equippedItemId === 'nope' && Math.random() < 0.3) firstGoesFirst = true;
                else if (secondMon.equippedItemId === 'nope' && Math.random() < 0.3) firstGoesFirst = false;
            }
            if (!freestyle) {
                if (firstMon.ability.name === '最風' && Math.random() < 0.2) {
                    firstGoesFirst = true;
                    battleState.log.push(`[特性発動: ${firstMon.name}の最風] 20%の確率で先制する！`);
                }
                if (secondMon.ability.name === '最風' && Math.random() < 0.2) {
                    firstGoesFirst = false;
                    battleState.log.push(`[特性発動: ${secondMon.name}の最風] 20%の確率で先制する！`);
                }
            }

            const ordered = firstGoesFirst
                ? [[firstAction, firstIsPlayer, secondAction], [secondAction, secondIsPlayer, firstAction]]
                : [[secondAction, secondIsPlayer, firstAction], [firstAction, firstIsPlayer, secondAction]];
            performAction(ordered[0][0], ordered[0][1], ordered[0][2], () => {
                const nextActor = getActorMon(ordered[1][1]);
                if (!nextActor || nextActor.hp <= 0) {
                    battleState.log.push(`${nextActor ? nextActor.name : '後攻側'}は行動できない！`);
                    finish();
                    return;
                }
                performAction(ordered[1][0], ordered[1][1], ordered[1][2], finish);
            });
        }

        function finishOnlineTurn(resolvedTurn) {
            const replaceFainted = (isPlayer) => {
                const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
                let index = isPlayer ? battleState.playerIndex : battleState.cpuIndex;
                if (team[index] && team[index].hp > 0) return true;
                const nextIndex = team.findIndex(mon => mon.hp > 0);
                if (nextIndex < 0) return false;
                if (isPlayer) battleState.playerIndex = nextIndex;
                else battleState.cpuIndex = nextIndex;
                const nextMon = team[nextIndex];
                nextMon.isFirstTurn = true;
                triggerOnEntryAbility(nextMon, isPlayer);
                battleState.log.push(`いけっ！ ${nextMon.name}！`);
                return true;
            };

            const playerAlive = replaceFainted(true);
            const opponentAlive = replaceFainted(false);
            onlineState.turn = Number(resolvedTurn) + 1;
            onlineState.turnSubmitted = false;
            processTurnEndEffects(() => {
                if (battleState.mode !== 'online') return;
                if (!playerAlive || !opponentAlive) {
                    battleState.turnPhase = 'gameover';
                    stopBattleBGM();
                    if (!playerAlive && !opponentAlive) {
                        showModal('引き分け', '両チームが全滅しました。', '🤝', () => { closeModal(); renderOnlineMenu(); });
                    } else if (!playerAlive) {
                        showModal('ONLINE 敗北… 💦', 'チームが全滅しました。', '☠️', () => { closeModal(); renderOnlineMenu(); });
                    } else {
                        showModal('ONLINE 勝利！ 🎉', '相手チームが全滅しました！', '🏆', () => { closeModal(); renderOnlineMenu(); });
                    }
                    return;
                }
                battleState.playerTeam[battleState.playerIndex].isFirstTurn = false;
                battleState.cpuTeam[battleState.cpuIndex].isFirstTurn = false;
                battleState.turnPhase = 'menu';
                renderBattleScreen();
            });
        }

        function executeGacha(cost) {
            if (gameState.coins < cost) {
                showModal('コイン不足', 'ガチャを回すためのコインが足りません！対戦でコインを稼ぎましょう。', '⚠️', closeModal);
                return;
            }
            gameState.coins -= cost;
            playSound('buff');

            const orb = document.getElementById('gacha-orb');
            const btn = document.getElementById('gacha-btn');
            if(orb) { orb.classList.add('shake-anim'); orb.innerText = '⚡'; }
            if(btn) btn.disabled = true;

            setTimeout(() => {
                const gachaKeys = Object.keys(MONSTERS_DB).filter(k => k !== 'kamiDeYaiba' && k !== 'jahibi');
                const randomKey = gachaKeys[Math.floor(Math.random() * gachaKeys.length)];
                const newMonster = createMonsterInstance(randomKey);
                gameState.inventory.push(newMonster);

                if (gameState.team.length < 3) {
                    gameState.team.push(newMonster.instanceId);
                }

                saveGame();

                showModal(
                    `✨ 召喚成功！ ✨`,
                    `<div class="gacha-anim py-2 flex flex-col items-center">
                        <div class="w-20 h-20 mb-2">${renderMonsterImage(newMonster, 'w-20 h-20')}</div>
                        <div class="text-xl font-black text-amber-300 mb-1">${newMonster.name}</div>
                        <div class="text-xs text-gray-400">新しい仲間がBOXに加わりました！</div>
                    </div>`,
                    '🌟',
                    () => { closeModal(); renderGacha(); }
                );
            }, 800);
        }

        // --- キャラ編成 & 装備設定画面 ---
        function renderParty() {
            stopBattleBGM();
            gameState.currentView = 'party';
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-5xl px-4">
                    <div class="glass-card border border-indigo-500/30 rounded-3xl p-6 sm:p-10 shadow-2xl relative">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">

        function startArcadeBattle() {
            playBattleBGM();

            const playerTeam = gameState.team.map(instId => {
                const original = gameState.inventory.find(m => m.instanceId === instId);

            });
            playerTeam.forEach(m => {
                m.hp = m.maxHp;

                m.hasSturdied = false;
                m.isSkipTurn = false;
                m.isProtected = false;
                m.protectCount = 0;
                m.isFirstTurn = true;

                playerIndex: 0,

        let battleState = null;

        function startBlackBattle() {
            closeModal();
            if (!gameState.team || gameState.team.length === 0) return;
            const playerTeam = gameState.team.map(instId => JSON.parse(JSON.stringify(gameState.inventory.find(m => m.instanceId === instId))));
            playerTeam.forEach(m => { m.hp=m.maxHp; m.stages={atk:0,def:0,spa:0,spd:0,speed:0}; m.status=null; m.statusTurns=0; m.volatileStatuses=[]; m.turnsInBattle=0; m.hasSturdied=false; m.isSkipTurn=false; m.isProtected=false; m.protectCount=0; m.isFirstTurn=true; m.chargingSkill=null; m.lockedMoveIndex=null; m.abilityAtkMultiplier=1; m.abilityDefMultiplier=1; m.hasPizaPanActivated=false; m.hasDisinfected=false; m.lastMoveFailed=false; });
            const cpuTeam = BLACK_TRAINER.teamIds.map(id => createMonsterInstance(id));
            cpuTeam.forEach(m => { m.hp=m.maxHp; m.isFirstTurn=true; });
            battleState = { mode:'black', playerTeam, playerIndex:0, cpuTeam, cpuIndex:0, log:['謎のトレーナー【ブラック】が立ちはだかった！'], field:{stealthCutPlayer:false,stealthCutCpu:false,akuShuuTurns:0,oikazePlayerTurns:0,oikazeCpuTurns:0}, turnPhase:'processing' };
            playBattleBGM(); checkBattleStartAbilities(); renderBattleScreen();
            setTimeout(() => processStartOfBattleTurn(), 800);
        }

        function startCasualMatch() {
            if (!gameState.team || gameState.team.length === 0) {
                showModal('エラー', 'チームにモンスターが編成されていません。', '⚠️', closeModal);
                return;
            }
            playBattleBGM();
            playSound('buff');

            const playerTeam = gameState.team.map(instId => {
                const original = gameState.inventory.find(m => m.instanceId === instId);
                return JSON.parse(JSON.stringify(original));
            });
            playerTeam.forEach(m => {
                m.hp = m.maxHp;
                m.stages = { atk: 0, def: 0, spa: 0, spd: 0, speed: 0 };
                m.status = null;
                m.statusTurns = 0;
                m.volatileStatuses = [];
                m.protectCount = 0;
                m.turnsInBattle = 0;
                m.hasSturdied = false;
                m.isSkipTurn = false;
                m.isProtected = false;
                m.isFirstTurn = true;
            });

            const allKeys = Object.keys(MONSTERS_DB).filter(k => k !== 'kamiDeYaiba' && k !== 'jahibi');
            const cpuTeam = [];
            for (let i = 0; i < 3; i++) {
                const randKey = allKeys[Math.floor(Math.random() * allKeys.length)];

            battleState = {
                mode: 'casual',

                cpuIndex: 0,
                log: ['カジュアルマッチ開始！相手トレーナーが勝ぶを挑んできた！'],
                field: { stealthCutPlayer: false, stealthCutCpu: false, akuShuuTurns: 0, oikazePlayerTurns: 0, oikazeCpuTurns: 0 },
                turnPhase: 'processing'
            };

            checkBattleStartAbilities();
            renderBattleScreen();

            setTimeout(() => {
                processStartOfBattleTurn();
            }, 800);

        function tryInflictBurn(target, sourceLabel = '追加効果') {
            if (!target || target.hp <= 0) return false;
            if (target.ability && target.ability.name === '海の幸') {
                battleState.log.push(`[特性発動: ${target.name}の海の幸] やけど状態にならない！`);
                return false;
            }
            if (target.status) return false;
            target.status = 'yakedo';
            battleState.log.push(`[${sourceLabel}] ${target.name}はやけど状態になった！`);
            return true;
        }

        function triggerOnEntryAbility(mon, isPlayer) {
            if (!mon || mon.hp <= 0) return;
            const opposingActive = isPlayer
                ? battleState.cpuTeam[battleState.cpuIndex]
                : battleState.playerTeam[battleState.playerIndex];
            if (isAbilitySuppressor(opposingActive)) {
                battleState.log.push(`[特性発動: ${opposingActive.name}のフリースタイル] ${mon.name}の特性効果を無効化した！`);
                return;
            }

            if (mon.ability.name === '呪炎ウラミノホノオ') {
                const targetMon = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
                if (targetMon && targetMon.hp > 0) { targetMon.status = 'yakedo'; battleState.log.push(`[${isPlayer ? '自分' : '相手'}の特性発動: ${mon.name}の呪炎ウラミノホノオ] 相手をやけど状態にした！`); }
            } else if (mon.ability.name === 'ナミキフィールド' || mon.ability.name === 'あせっかき') {
                battleState.field.akuShuuTurns = 5;
                const pActive = battleState.playerTeam[battleState.playerIndex];
                const cActive = battleState.cpuTeam[battleState.cpuIndex];
                if (pActive) pActive.volatileStatuses = [...new Set([...(pActive.volatileStatuses || []), 'akushyuu'])];
                if (cActive) cActive.volatileStatuses = [...new Set([...(cActive.volatileStatuses || []), 'akushyuu'])];
                battleState.log.push(`[${isPlayer ? '自分' : '相手'}の特性発動: ${mon.name}の${mon.ability.name}] 5ターンの間、あたりがあくしゅう状態になった！`);
            } else if (mon.ability.name === '神剣カミデヤイバ') {
                const targetMon = isPlayer ? battleState.cpuTeam[battleState.cpuIndex] : battleState.playerTeam[battleState.playerIndex];
                if (targetMon) {
                    targetMon.status = 'reishou';
                    battleState.log.push(`[${isPlayer ? '自分' : '相手'}の特性発動: ${mon.name}の神剣カミデヤイバ] 相手を冷笑状態にした！`);
                }
            } else if (mon.ability.name === '荒い鼻息') {
                mon.stages.atk = Math.min(3, mon.stages.atk + 1);
                battleState.log.push(`[${isPlayer ? '自分' : '相手'}の特性発動: ${mon.name}の荒い鼻息] 攻撃が1段階上がった！`);
            } else if (mon.ability.name === '冷静沈着') {
                const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
                team.forEach(m => m.status = null);
                battleState.log.push(`[${isPlayer ? '自分' : '相手'}の特性発動: ${mon.name}の冷静沈着] 味方全員の状態異常を回復した！`);
            } else if (mon.ability.name === '撃ちます') {
                battleState.log.push(`[${isPlayer ? '自分' : '相手'}の特性発動: ${mon.name}の撃ちます] 技が2連撃になり、2回目の威力が0.25倍（効果2回分発動）になる！`);
            } else if (mon.ability.name === '不幸は蜜の味') {
                const team = isPlayer ? battleState.playerTeam : battleState.cpuTeam;
                const fallen = team.filter(m => m.hp <= 0).length;
                const multiplier = Math.pow(1.2, fallen);
                mon.abilityAtkMultiplier = multiplier;
                mon.abilityDefMultiplier = multiplier;
                battleState.log.push(`[${isPlayer ? '自分' : '相手'}の特性発動: ${mon.name}の不幸は蜜の味] 倒れた味方${fallen}体分、攻撃・防御が${multiplier.toFixed(2)}倍になった！`);
            }
        }

        function checkBattleStartAbilities() {
            const pActive = battleState.playerTeam[battleState.playerIndex];
            const cActive = battleState.cpuTeam[battleState.cpuIndex];

            triggerOnEntryAbility(pActive, true);
            triggerOnEntryAbility(cActive, false);
        }

        // オオニシンの「フリースタイル」も、既存の特性無効化判定と同じ経路で処理する。
        function isAbilitySuppressor(mon) {
            return mon?.ability?.name === 'フリースタイル';
        }

        function getStageMultiplier(stage) {
            if (stage === 1) return 1.5;
            if (stage === 2) return 2.0;
            if (stage >= 3) return 3.0;
            if (stage === -1) return 1 / 1.5;
            if (stage === -2) return 0.5;
            if (stage <= -3) return 1 / 3.0;
            return 1.0;
        }

        function renderBattleScreen() {
            gameState.currentView = 'battle';
            updateHeader();
            const container = document.getElementById('app-container');
            const pMon = battleState.playerTeam[battleState.playerIndex];
            const cMon = battleState.cpuTeam[battleState.cpuIndex];

            const pHpPercent = Math.max(0, Math.min(100, (pMon.hp / pMon.maxHp) * 100));
            const cHpPercent = Math.max(0, Math.min(100, (cMon.hp / cMon.maxHp) * 100));

            const pStatusEmoji = (pMon.status ? (STATUS_EMOJIS[pMon.status] || '') : '') + ((pMon.volatileStatuses || []).map(x => STATUS_EMOJIS[x] || (x === 'akushyuu' ? '🤢' : '')).join('')) + (pMon.chargingSkill ? '🪽' : '');
            const cStatusEmoji = (cMon.status ? (STATUS_EMOJIS[cMon.status] || '') : '') + ((cMon.volatileStatuses || []).map(x => STATUS_EMOJIS[x] || (x === 'akushyuu' ? '🤢' : '')).join('')) + (cMon.chargingSkill ? '🪽' : '');

            const pEquip = pMon.equippedItemId ? EQUIPMENT_DB[pMon.equippedItemId] : null;
            const cEquip = cMon.equippedItemId ? EQUIPMENT_DB[cMon.equippedItemId] : null;

            const isProcessing = battleState.turnPhase === 'processing';
            const isOnlineMode = battleState.mode === 'online';

            container.innerHTML = `
                <div class="w-full max-w-4xl px-4 relative">
                    <canvas id="particle-canvas" class="absolute inset-0 pointer-events-none z-30 w-full h-full rounded-3xl"></canvas>

                    <div class="glass-card border border-indigo-500/40 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <!-- CPU / Opponent Side (奥) -->
                            <div class="bg-gray-900/90 neon-border-cpu rounded-2xl p-4 flex items-center space-x-4 shadow-2xl cursor-pointer hover:scale-[1.01] transition relative" onmousedown="showMonsterStatusDetail(battleState.cpuTeam[battleState.cpuIndex])" ontouchstart="showMonsterStatusDetail(battleState.cpuTeam[battleState.cpuIndex])">
                                <div id="cpu-sprite" class="w-24 h-24 flex-shrink-0 relative">${renderMonsterImage(cMon, 'w-24 h-24')}</div>
                                <div class="flex-grow overflow-hidden">
                                    <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-black text-base text-red-400 tracking-wide truncate">${cMon.name} ${cStatusEmoji}</span>
                                            <div class="flex gap-1">
                                                ${cMon.element.map(elKey => {
                                                    const el = ELEMENTS[elKey];
                                                    return `<span class="text-[9px] px-1.5 py-0.5 rounded font-bold ${el.badge}">${el.name}</span>`;
                                                }).join('')}
                                            </div>
                                        </div>
                                        <span class="text-[10px] bg-red-950/90 text-red-300 px-2.5 py-0.5 rounded-full border border-red-700 font-bold tracking-wider">${isOnlineMode ? onlineState.opponentName : '相手'}</span>
                                    </div>
                                    <div class="w-full bg-gray-950 h-3.5 rounded-full overflow-hidden mb-1 border border-gray-800 p-0.5 shadow-inner">
                                        <div class="bg-gradient-to-r from-red-600 via-orange-500 to-amber-400 h-full rounded-full transition-all duration-500" style="width: ${cHpPercent}%"></div>
                                    </div>
                                    <div class="flex justify-between text-xs font-mono text-gray-300">
                                        <span class="font-bold">HP: ${Math.ceil(cHpPercent)}%</span>
                                        ${cEquip ? `<span class="text-yellow-300 font-bold text-[10px]">${cEquip.icon} ${cEquip.name}</span>` : '<span class="text-gray-500 text-[10px]">タップで詳細</span>'}
                                    </div>
                                </div>
                            </div>

                            <!-- Player Side (手前) -->
                            <div class="bg-gray-900/90 neon-border-player rounded-2xl p-4 flex items-center space-x-4 shadow-2xl cursor-pointer hover:scale-[1.01] transition relative" onmousedown="showMonsterStatusDetail(battleState.playerTeam[battleState.playerIndex])" ontouchstart="showMonsterStatusDetail(battleState.playerTeam[battleState.playerIndex])">
                                <div id="player-sprite" class="w-24 h-24 flex-shrink-0 relative">${renderMonsterImage(pMon, 'w-24 h-24')}</div>
                                <div class="flex-grow overflow-hidden">
                                    <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-black text-base text-emerald-400 tracking-wide truncate">${pMon.name} ${pStatusEmoji}</span>
                                            <div class="flex gap-1">
                                                ${pMon.element.map(elKey => {
                                                    const el = ELEMENTS[elKey];
                                                    return `<span class="text-[9px] px-1.5 py-0.5 rounded font-bold ${el.badge}">${el.name}</span>`;
                                                }).join('')}
                                            </div>
                                        </div>
                                        <span class="text-[10px] bg-emerald-950/90 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-700 font-bold tracking-wider">${gameState.playerName || '自分'}</span>
                                    </div>
                                    <div class="w-full bg-gray-950 h-3.5 rounded-full overflow-hidden mb-1 border border-gray-800 p-0.5 shadow-inner">
                                        <div class="bg-gradient-to-r from-emerald-600 via-green-500 to-teal-400 h-full rounded-full transition-all duration-500" style="width: ${pHpPercent}%"></div>
                                    </div>
                                    <div class="flex justify-between text-xs font-mono text-gray-300">
                                        <span class="font-bold">HP: ${Math.ceil(pHpPercent)}%</span>
                                        ${pEquip ? `<span class="text-yellow-300 font-bold text-[10px]">${pEquip.icon} ${pEquip.name}</span>` : '<span class="text-emerald-400 font-bold text-[10px]">タップで詳細</span>'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Battle Log -->
                        <div class="log-box-custom rounded-2xl p-4 mb-6 h-40 overflow-y-auto font-mono text-xs text-gray-200 space-y-2 shadow-inner border border-blue-500/30" id="battle-log-box">
                            ${battleState.log.map(line => `<div class="leading-relaxed border-b border-gray-800/40 pb-1"><span class="text-cyan-400 font-bold">›</span> ${line}</div>`).join('')}
                        </div>

                        <!-- Action Controls -->
                        <div id="battle-controls" class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-xl">
                            ${battleState.turnPhase === 'gameover' ? `
                                <div class="text-center py-4">
                                    <button onclick="playSound('click'); ${isOnlineMode ? 'renderOnlineMenu()' : (battleState.mode === 'arcade' ? 'renderArcadeHub()' : 'showMenu()')}" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-bold py-3.5 px-10 rounded-2xl shadow-xl transition text-base tracking-wider">
                                        次へ進む →
                                    </button>
                                </div>
                            ` : `
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
                                    ${pMon.skills.map((skill, sIdx) => {
                                        const sEl = ELEMENTS[skill.type] || ELEMENTS.normal;
                                        const isLockedByWing = pMon.equippedItemId === 'wing_kakera' && pMon.lockedMoveIndex !== null && pMon.lockedMoveIndex !== sIdx;
                                        const isNekodamashiInvalid = skill.name === 'ねこだまし' && !pMon.isFirstTurn;
                                        const isLockedByCharge = !!pMon.chargingSkill && skill.name !== pMon.chargingSkill.name;
                                        const isChargingMove = !!pMon.chargingSkill && skill.name === pMon.chargingSkill.name;

                                        return `
                                            <button onclick="${isOnlineMode ? `sendOnlineAction('skill', ${sIdx})` : `executePlayerTurn(${sIdx})`}" ${(!isChargingMove && skill.pp <= 0) || isProcessing || isLockedByWing || isNekodamashiInvalid || isLockedByCharge || (isOnlineMode && onlineState.turnSubmitted) ? 'disabled' : ''} class="${sEl.button} p-3.5 rounded-2xl flex flex-col items-center justify-between transition transform hover:-translate-y-0.5 active:translate-y-0 shadow-lg font-bold disabled:opacity-30 border">
                                                <span class="text-sm tracking-wide truncate w-full text-center mb-1">${skill.name}${isChargingMove ? '（溜め完了）' : ''}</span>
                                                <span class="text-[10px] opacity-90 font-mono bg-black/40 px-2 py-0.5 rounded-full border border-white/10">CP: ${skill.pp}/${skill.maxPp}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                <div class="flex justify-center space-x-4 pt-3 border-t border-gray-800/80">
                                    <button onclick="playSound('click'); showSwitchMenu()" ${isProcessing || (isOnlineMode && onlineState.turnSubmitted) ? 'disabled' : ''} class="bg-gradient-to-r from-gray-800 to-gray-700 hover:from-gray-700 hover:to-gray-600 text-gray-200 text-xs font-bold py-2.5 px-8 rounded-xl border border-gray-600 transition shadow-lg disabled:opacity-40 flex items-center space-x-2">
                                        <span>🔄</span>
                                        <span>ポケモン交代 (1ターン消費)</span>
                                    </button>
